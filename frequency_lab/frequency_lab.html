<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequency Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}input{padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:8px}canvas{width:100%;height:300px;background:#181818;border-radius:12px;margin-top:15px}</style></head><body><main><h1>🎛️ Frequency Lab</h1><input id="hz" type="number" value="144" step="0.001"> Hz <button onclick="go()">Mutat</button><h2 id="out"></h2><canvas id="c" width="800" height="300"></canvas></main><script>function go(){let f=+hz.value,p=1000/f;out.textContent='Periódusidő: '+p.toFixed(6)+' ms';let q=c.getContext('2d');q.clearRect(0,0,800,300);q.beginPath();q.strokeStyle='#fff';for(let x=0;x<800;x++){let y=150+90*Math.sin(x/800*2*Math.PI*4);x?q.lineTo(x,y):q.moveTo(x,y)}q.stroke()}go()</script></body></html>
