<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Processor Explorer</title><style>
:root{font-family:system-ui;background:#0c1424;color:#e7f1ff}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:1000px;margin:auto}header,.bar,.items{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:24px;margin:10px 0}small,.muted{color:#91a6c7}.panel{background:#15243b;border:1px solid #304663;border-radius:14px;padding:15px;margin:12px 0}button,select,input,textarea{background:#203550;color:#fff;border:1px solid #496283;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#315176}.folder{flex:1;min-width:120px;padding:26px;font-size:23px}.file{display:inline-flex;align-items:center;gap:6px}dialog{background:#14243b;color:white;border:1px solid #6584a8;border-radius:14px;max-width:min(95vw,580px);width:100%}dialog::backdrop{background:#000b}label{display:block;margin:12px 0 5px}select,input,textarea{width:100%}textarea{min-height:100px}#files{display:flex;gap:8px;flex-wrap:wrap}#status{overflow-wrap:anywhere}#path{overflow-wrap:anywhere;font-family:monospace} .danger{color:#ffb0a8}</style>
<main><header><div><h1>⚙️ Processor Explorer</h1><small>Program ID: 7E4A91C2D6B8035F</small></div><div id="status"></div></header><div class="panel"><div class="bar"><button id="back">← Vissza</button><button id="home">⌂ Kezdőlap</button><button id="export">Export JSON</button><button id="importBtn">Import JSON</button><input id="importFile" type="file" accept=".json" hidden></div><p class="muted">Útvonal</p><div id="path">/</div></div><div class="panel"><h2>Mappák</h2><div class="bar"><button class="folder" data-bit="0">📁 0</button><button class="folder" data-bit="1">📁 1</button></div></div><div class="panel"><div class="bar"><h2>Fájlok</h2><button id="add">＋ Fájl</button></div><div id="files"></div></div><p class="muted">Logikai tervező és nyilvántartó; nem futtat áramköri szimulációt. A böngészőben automatikusan ment.</p></main>
<dialog id="newDialog"><h2>Új fájl</h2><label>Fájltípus</label><select id="kind"></select><div class="bar" style="margin-top:18px"><button id="create">Létrehozás</button><button onclick="newDialog.close()">Mégse</button></div></dialog>
<dialog id="editor"><h2 id="fileTitle"></h2><small id="fileLocation"></small><div id="ports"></div><label>Megjegyzés</label><textarea id="note"></textarea><div class="bar" style="margin-top:16px"><button id="save">Mentés</button><button id="delete" class="danger">Törlés</button><button onclick="editor.close()">Bezárás</button></div></dialog>
<script>
const TYPES=['NMOS','PMOS','WIRE','NODE','VDD','GND','INPUT','OUTPUT','CLOCK','RESET','NOT','AND','OR','NAND','NOR','XOR','XNOR','BUFFER','MUX','DEMUX','DECODER','ENCODER','LATCH','FLIPFLOP','REGISTER','MEMORY','HALF_ADDER','FULL_ADDER','ALU','MODULE','INSTANCE','LINK','PARAMETER','COMMENT'];
const PORTS={NMOS:['G','S','D','B'],PMOS:['G','S','D','B'],WIRE:['A','B'],NODE:['NET'],VDD:['NET'],GND:['NET'],INPUT:['Y'],OUTPUT:['A'],CLOCK:['Y'],RESET:['Y'],NOT:['A','Y'],BUFFER:['A','Y'],AND:['A','B','Y'],OR:['A','B','Y'],NAND:['A','B','Y'],NOR:['A','B','Y'],XOR:['A','B','Y'],XNOR:['A','B','Y'],MUX:['A','B','SEL','Y'],DEMUX:['A','SEL','Y0','Y1'],DECODER:['INPUTS','OUTPUTS'],ENCODER:['INPUTS','OUTPUTS'],LATCH:['D','EN','Q'],FLIPFLOP:['D','CLK','Q'],REGISTER:['D','CLK','Q'],MEMORY:['ADDR','DATA','WE','CLK'],HALF_ADDER:['A','B','SUM','CARRY'],FULL_ADDER:['A','B','CIN','SUM','COUT'],ALU:['A','B','OP','Y'],MODULE:['PORTS'],INSTANCE:['MODULE','PORTS'],LINK:['FROM','TO'],PARAMETER:['VALUE'],COMMENT:[]};
const KEY='processor-explorer-7E4A91C2D6B8035F';let db={files:[],counters:{}};try{const v=localStorage.getItem(KEY);if(v)db=JSON.parse(v)}catch(e){alert('A mentés nem olvasható: '+e.message)}let path='',active=null;const el=id=>document.getElementById(id),persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Mentési hiba: '+e.message)}};function render(){el('status').textContent='0 / '+path.length+' / 65536 depth';el('path').textContent='/'+path.split('').join('/');el('back').disabled=!path.length;el('files').replaceChildren();for(const f of db.files.filter(f=>f.path===path)){const b=document.createElement('button');b.className='file';b.textContent='📄 '+f.name;b.onclick=()=>openFile(f.id);el('files').append(b)}}
document.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{if(path.length>=65536)return alert('Maximális mélység');path+=b.dataset.bit;render()});el('back').onclick=()=>{path=path.slice(0,-1);render()};el('home').onclick=()=>{path='';render()};TYPES.forEach(t=>{let o=document.createElement('option');o.value=o.textContent=t;el('kind').append(o)});el('add').onclick=()=>el('newDialog').showModal();el('create').onclick=()=>{const type=el('kind').value;db.counters[type]=(db.counters[type]||0)+1;const name=type+db.counters[type];db.files.push({id:crypto.randomUUID(),type,name,path,ports:{},note:''});persist();el('newDialog').close();render()};
function openFile(id){active=id;const f=db.files.find(x=>x.id===id);if(!f)return;el('fileTitle').textContent=f.name;el('fileLocation').textContent='Mappa: /'+f.path.split('').join('/');el('ports').replaceChildren();const options=db.files.filter(x=>x.id!==f.id).flatMap(x=>(PORTS[x.type]||[]).map(p=>x.name+'.'+p));for(const p of PORTS[f.type]||[]){const l=document.createElement('label');l.textContent=p;const s=document.createElement('select');s.dataset.port=p;for(const val of ['',...options]){const o=document.createElement('option');o.value=val;o.textContent=val||'— Nincs kapcsolat —';s.append(o)}if(f.ports[p]&&!options.includes(f.ports[p])){const o=document.createElement('option');o.value=o.textContent=f.ports[p]+' (hiányzó cél)';s.append(o);s.value=o.value}else s.value=f.ports[p]||'';el('ports').append(l,s)}el('note').value=f.note||'';el('editor').showModal()}
el('save').onclick=()=>{const f=db.files.find(x=>x.id===active);if(!f)return;f.note=el('note').value;f.ports={};el('ports').querySelectorAll('select').forEach(s=>f.ports[s.dataset.port]=s.value);persist();el('editor').close();render()};el('delete').onclick=()=>{if(!confirm('Biztosan törlöd? A hivatkozások nem törlődnek automatikusan.'))return;db.files=db.files.filter(x=>x.id!==active);persist();el('editor').close();render()};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify({programId:'7E4A91C2D6B8035F',exportedAt:Date.now(),...db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='processor-explorer-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('importBtn').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.files)||!obj.counters||typeof obj.counters!=='object')throw Error('Hibás formátum');if(!confirm('Felülírod a jelenlegi tervet?'))return;db={files:obj.files,counters:obj.counters};path='';persist();render()}catch(err){alert('Importálási hiba: '+err.message)}e.target.value=''};render();
</script></html>
