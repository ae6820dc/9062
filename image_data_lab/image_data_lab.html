<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Data Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}input{margin:10px 0}img{max-width:100%;max-height:400px;border:1px solid #555;border-radius:10px}pre{background:#181818;padding:15px;border-radius:10px}</style></head><body><main><h1>🖼️ Image Data Lab</h1><input id="f" type="file" accept="image/*"><div><img id="im"></div><pre id="o">Válassz egy képet.</pre></main><script>f.onchange=()=>{let file=f.files[0];if(!file)return;let u=URL.createObjectURL(file);im.onload=()=>{let px=im.naturalWidth*im.naturalHeight;let raw=px*4;o.textContent='Fájlnév: '+file.name+'\nFájlméret: '+(file.size/1024).toFixed(2)+' KiB\nFelbontás: '+im.naturalWidth+' × '+im.naturalHeight+'\nPixelek: '+px.toLocaleString()+'\nKéparány: '+(im.naturalWidth/im.naturalHeight).toFixed(6)+'\n\nRGBA nyers adat becslése: '+(raw/1048576).toFixed(2)+' MiB';};im.src=u}</script></body></html>
