<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Hexic 2048</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf8ef;--txt:#776e65;--box:#bbada0;--boxtxt:#eee4da;--btn:#6f4e37;--btnt:#f9f6f2;--cell:#cbc1b4;--cellr:#b9ae9f;--menu:#333;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2622;--txt:#d8cfc6;--box:#5a4e45;--boxtxt:#cbbfb3;--cell:#4a413a;--cellr:#3d3530}}
:root[data-theme="dark"]{--bg:#2b2622;--txt:#d8cfc6;--box:#5a4e45;--boxtxt:#cbbfb3;--cell:#4a413a;--cellr:#3d3530}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:480px;height:100%;margin:0 auto;padding:8px 8px 10px;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:stretch}
.sq{background:var(--box);border-radius:4px;color:#fff}
#menuBtn{width:56px;height:56px;border:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 12px;cursor:pointer}
#menuBtn i{display:block;height:4px;background:#fff;border-radius:2px}
.sp{flex:1}
.sc{width:90px;text-align:center;padding:6px 4px;height:56px}
.sc small{display:block;font-size:12px;color:var(--boxtxt);letter-spacing:.5px}
.sc b{font-size:22px;line-height:1.2}
#hint{margin:8px 2px 4px;font-size:15px;min-height:20px}
#wrap{flex:1;min-height:0;position:relative}
#board{position:absolute;left:50%;top:50%;touch-action:none}
#board .cw,#board .tw{position:absolute}
.cw{background:var(--cellr)}
.cw i{position:absolute;inset:7%;background:var(--cell)}
.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.bx{border-radius:8%}
.tw{transition:transform var(--d,.11s) ease-in-out;z-index:2}
.tw .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.tw.new .t{animation:nw calc(var(--d,.11s) * 1.6) ease-out var(--d,0s)}
.tw.pop .t{animation:pp calc(var(--d,.11s) * 1.5) ease-out}
@keyframes nw{from{transform:scale(.2);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes pp{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.tw{transition:none}.tw .t{animation:none!important}}
#bar{display:flex;gap:6px;margin-top:8px;position:relative}
#bar button{flex:1;height:38px;border:0;border-radius:4px;background:var(--btn);color:var(--btnt);font-size:17px;cursor:pointer;position:relative}
#bar button.on{background:#a4703e;outline:2px solid #fff8}
#bar button:disabled{opacity:.55}
#bar button:focus-visible,#menuBtn:focus-visible{outline:3px solid #f59563}
#badge{position:absolute;right:-5px;top:-9px;background:#d9231b;color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 5px;pointer-events:none}
.pop-menu{position:absolute;background:var(--menu);color:#fff;border-radius:4px;box-shadow:0 4px 14px #0007;z-index:20;padding:6px 0;display:none;min-width:150px}
.pop-menu div{padding:9px 16px;font-size:16px;cursor:pointer}
.pop-menu div:hover,.pop-menu div.sel{background:#555}
.mm{bottom:48px}
#hm{top:64px;left:8px}
#ov{position:absolute;inset:0;background:#faf8efd9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;text-align:center;color:#5a4a3e}
#ov h2{font-size:34px;margin:0}
#ov .sb{background:var(--box);border-radius:4px;color:#fff;width:200px;padding:6px 0}
#ov .sb small{display:block;font-size:12px;color:var(--boxtxt)}
#ov .sb b{font-size:26px}
#ov .wb{position:relative}
#ov .wb i{position:absolute;right:-8px;top:-9px;background:#d9231b;color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:13px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}
#ov button{width:200px}
#ov button:disabled{opacity:.5}
#startTxt{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:56px;color:#ffe600;text-shadow:0 2px 6px #000a;z-index:25;cursor:pointer;font-weight:500}
#ov button{border:0;border-radius:4px;background:var(--btn);color:#fff;font-size:18px;padding:10px 22px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="menuBtn" class="sq" aria-label="Menü"><i></i><i></i><i></i></button>
    <div class="sp"></div>
    <div class="sq sc"><small>SCORE</small><b id="score">0</b></div>
    <div class="sq sc"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div id="hint"></div>
  <div id="wrap"><div id="board"></div>
    <div id="ov"></div><div id="startTxt">Start</div>
  </div>
  <div id="bar">
    <button id="bGrid">Grid</button>
    <button id="bAuto">Auto</button>
    <button id="bMode">Mode</button>
    <button id="bUndo">Undo<span id="badge">10</span></button>
    <div class="pop-menu mm" id="mm"></div>
  </div>
  <div class="pop-menu" id="hm"><div data-a="new">New game</div><div data-a="share">Share</div></div>
</div>
<script>
(function(){
const SQ3=Math.sqrt(3);
const MODES=[["Hex 2x2x2","hex",2,256],["Hex 3x3x3","hex",3,2048],["Hex 4x4x4","hex",4,32768],["Hex 5x5x5","hex",5,262144],
["Box 4x4","box",4,2048],["Box 5x5","box",5,16384],["Box 6x6","box",6,131072],["Box 7x7","box",7,262144],["Box 8x8","box",8,524288]];
const HEXD=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const BOXD=[[0,-1],[1,0],[0,1],[-1,0]];
const $=id=>document.getElementById(id);
let mi=0,gmode="classic",autoMode="Corner",started=true,survT=null,autoStep=0,cells=[],cset=new Set(),tiles=[],score=0n,best=0n,undos=10,hist=[],uid=0,autoT=null,over=false,won=false,keepGoing=false;
let els=new Map(),S=30,layout={};
const M=()=>MODES[mi];
const key=(q,r)=>q+","+r;
const dirs=()=>M()[1]==="hex"?HEXD:BOXD;

function ls(get,k,v){try{if(get)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const SAVEKEY="hex2048save_v1";
function saveGame(){
  try{
    localStorage.setItem(SAVEKEY,JSON.stringify({mi,gmode,autoMode,tiles:tiles.map(t=>({id:t.id,v:t.v,q:t.q,r:t.r})),score:score.toString(),best:best.toString(),undos,hist:hist.map(h=>({tiles:h.tiles,score:h.score.toString()})),uid,over,won,keepGoing,started}));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVEKEY);if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s||!Array.isArray(s.tiles)||!Number.isInteger(s.mi)||s.mi<0||s.mi>=MODES.length)return false;
    mi=s.mi;gmode=s.gmode||"classic";autoMode=s.autoMode||"Corner";
    buildCells();
    tiles=s.tiles.map(t=>({id:t.id,v:t.v,q:t.q,r:t.r})).filter(t=>cset.has(key(t.q,t.r)));
    try{score=BigInt(s.score??0)}catch(_){score=0n}
    try{best=BigInt(s.best??0)}catch(_){best=0n}
    undos=Number.isFinite(s.undos)?s.undos:10;
    hist=Array.isArray(s.hist)?s.hist.slice(-10).map(h=>{let hs=0n;try{hs=BigInt(h.score??0)}catch(_){}return{tiles:Array.isArray(h.tiles)?h.tiles:[],score:hs}}):[];uid=Number(s.uid)||Math.max(0,...tiles.map(t=>t.id||0));
    over=!!s.over;won=!!s.won;keepGoing=!!s.keepGoing;started=s.started!==false;
    {let oldBest=0n;try{oldBest=BigInt(ls(true,"hex2048best"+mi+gmode)||"0")}catch(_){}if(oldBest>best)best=oldBest;}
    $("hint").textContent=hintText();fullRender();
    if(over)showOver();
    else if(gmode==="survival"&&!started)$("startTxt").style.display="flex";
    else if(gmode==="survival"&&started)startSurv();
    return true;
  }catch(e){return false}
}

function buildCells(){
  cells=[];const [,t,n]=M();
  if(t==="hex"){const R=n-1;for(let q=-R;q<=R;q++)for(let r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++)cells.push([q,r])}
  else for(let q=0;q<n;q++)for(let r=0;r<n;r++)cells.push([q,r]);
  cset=new Set(cells.map(c=>key(c[0],c[1])));
}
function unit(q,r){return M()[1]==="hex"?[1.5*q,SQ3*(r+q/2)]:[2*q,2*r]}
function fit(){
  const wrap=$("wrap"),W=wrap.clientWidth-4,H=wrap.clientHeight-4;
  const hex=M()[1]==="hex";
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const hw=hex?1:1,hh=hex?SQ3/2:1;
  cells.forEach(([q,r])=>{const [x,y]=unit(q,r);x0=Math.min(x0,x-hw);x1=Math.max(x1,x+hw);y0=Math.min(y0,y-hh);y1=Math.max(y1,y+hh)});
  S=Math.min(W/(x1-x0),H/(y1-y0));
  layout={cx:-(x0+x1)/2*S,cy:-(y0+y1)/2*S,w:(x1-x0)*S,h:(y1-y0)*S};
  const b=$("board");b.style.width=layout.w+"px";b.style.height=layout.h+"px";b.style.marginLeft=-layout.w/2+"px";b.style.marginTop=-layout.h/2+"px";
}
function px(q,r){const [x,y]=unit(q,r);return [x*S+layout.w/2+layout.cx,y*S+layout.h/2+layout.cy]}
function dims(k){const hex=M()[1]==="hex";return hex?[2*S*k,SQ3*S*k]:[2*S*k,2*S*k]}

const COL={2:["#ece4d8","#776e65"],4:["#ebdfc4","#776e65"],8:["#f0a76b","#fff"],16:["#ee8558","#fff"],32:["#ec6c53","#fff"],64:["#e4523c","#fff"],128:["#ecd26a","#fff"],256:["#e8c650","#fff"],512:["#e5bb3c","#fff"],1024:["#e0ae28","#fff"],2048:["#dba314","#fff"]};
function colorOf(v){if(v==="X")return["#3b3b3b","#fff"];if(COL[v])return COL[v];
  if(v>2048){const n=Math.round(Math.log2(v));return["hsl("+((n*47)%360)+",42%,36%)","#fff"]}return["#ccc","#000"]}
function label(v){
  if(v==="X")return{h:"X",len:1};
  if(v>=1073741824){const n=Math.round(Math.log2(v));return{h:"2<sup style='font-size:.6em;vertical-align:.35em'>"+n+"</sup>",len:String(n).length*.6+1.2}}
  const s=String(v);return{h:s,len:s.length}}
function fsz(v){
  const l=Math.max(1,label(v).len);
  const w=(M()[1]==="hex"?1.55:1.7)*S;          // usable text width
  return Math.min(S*.85,w/(l*.62));
}

function drawBoard(){
  const b=$("board");b.innerHTML="";els=new Map();
  const cls=M()[1]==="hex"?"hex":"bx";
  cells.forEach(([q,r])=>{
    const [x,y]=px(q,r),[w,h]=dims(1);
    const d=document.createElement("div");d.className="cw "+cls;
    d.style.cssText=`left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;`;
    d.innerHTML="<i class='"+cls+"'></i>";b.appendChild(d);
  });
}
function elFor(t,isNew){
  let e=els.get(t.id);
  if(!e){
    e=document.createElement("div");e.className="tw"+(isNew?" new":"");
    const i=document.createElement("div");i.className="t "+(M()[1]==="hex"?"hex":"bx");e.appendChild(i);
    $("board").appendChild(e);els.set(t.id,e);
  }
  const [w,h]=dims(.92),[x,y]=px(t.q,t.r),i=e.firstChild;
  e.style.width=w+"px";e.style.height=h+"px";e.style.transform=`translate(${x-w/2}px,${y-h/2}px)`;
  const [bg,fg]=colorOf(t.v);i.style.background=bg;i.style.color=fg;i.style.fontSize=fsz(t.v)+"px";i.innerHTML=label(t.v).h;
  return e;
}
function render(newIds=[],popIds=[]){
  tiles.forEach(t=>elFor(t,newIds.includes(t.id)));
  popIds.forEach(id=>{const e=els.get(id);if(e){e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}});
  setNum($("score"),score);setNum($("best"),best);
  $("badge").textContent=undos;$("bUndo").disabled=!hist.length||undos<=0||gmode==="survival";
  $("badge").style.display=undos>0?"flex":"none";
}
function setNum(el,n){
  const s=String(n);
  let t=s;
  if(s.length>15){t=s[0]+"."+s.slice(1,5)+"e+"+(s.length-1)}
  el.textContent=t;el.title=s;
  el.style.fontSize=(t.length>8?Math.max(11,22*8/t.length):22)+"px"
}
function fullRender(){
  fit();drawBoard();tiles.forEach(t=>elFor(t,false));render();
}

function empties(ts){const o=new Set(ts.map(t=>key(t.q,t.r)));return cells.filter(c=>!o.has(key(c[0],c[1])))}
function spawn(isX){
  const em=empties(tiles);if(!em.length)return null;
  const c=em[Math.floor(Math.random()*em.length)];
  const t={id:++uid,v:isX?"X":(Math.random()<.9?2:4),q:c[0],r:c[1]};tiles.push(t);return t;
}
function step(ts,d){
  const grid=new Map();ts.forEach(t=>{t.m=false;t.dead=false;grid.set(key(t.q,t.r),t)});
  const order=ts.slice().sort((a,b)=>(b.q*d[0]+b.r*d[1])-(a.q*d[0]+a.r*d[1]));
  let moved=false,gained=0n;const pops=[];
  for(const t of order){
    let q=t.q,r=t.r;
    for(;;){
      const nq=q+d[0],nr=r+d[1],k=key(nq,nr);
      if(!cset.has(k))break;
      const o=grid.get(k);
      if(!o){q=nq;r=nr;continue}
      if(o.v===t.v&&t.v!=="X"&&!o.m&&!o.dead){
        grid.delete(key(t.q,t.r));t.dead=true;t.q=nq;t.r=nr;
        const merged=o.v*2;
        gained+=BigInt(merged);
        o.v=(o.v===M()[3]?2:merged);
        o.m=true;moved=true;pops.push(o.id);
      }
      break;
    }
    if(!t.dead&&(q!==t.q||r!==t.r)){grid.delete(key(t.q,t.r));t.q=q;t.r=r;grid.set(key(q,r),t);moved=true}
  }
  return{moved,gained,pops};
}
function canMove(){
  if(empties(tiles).length)return true;
  return dirs().some(d=>{const c=tiles.map(t=>({...t}));return step(c,d).moved});
}
function snapshot(){hist.push({tiles:tiles.map(t=>({id:t.id,v:t.v,q:t.q,r:t.r})),score});if(hist.length>10)hist.shift()}

function doMove(di){
  if(over||!started)return false;
  const d=dirs()[di];if(!d)return false;
  const snap={tiles:tiles.map(t=>({id:t.id,v:t.v,q:t.q,r:t.r})),score};
  const res=step(tiles,d);
  if(!res.moved){tiles.forEach(t=>{t.dead=false});return false}
  hist.push(snap);if(hist.length>10)hist.shift();
  const dead=tiles.filter(t=>t.dead);
  tiles=tiles.filter(t=>!t.dead);
  score+=res.gained;
  if(score>best){best=score;ls(false,"hex2048best"+mi+gmode,best.toString())}
  const nt=gmode==="survival"?null:spawn(gmode==="x"&&Math.random()<.08);
  dead.forEach(t=>{const e=els.get(t.id);if(e){const [w,h]=dims(.92),[x,y]=px(t.q,t.r);e.style.transform=`translate(${x-w/2}px,${y-h/2}px)`;els.delete(t.id);setTimeout(()=>e.remove(),autoT?420:140)}});
  render(nt?[nt.id]:[],res.pops);
  if(!canMove()){over=true;stopAuto();stopSurv();showOver()}
  saveGame();
  return true;
}
function showOv(t,b,f){const o=$("ov");o.innerHTML="<h2></h2><button></button>";o.firstChild.textContent=t;o.lastChild.textContent=b;o.lastChild.onclick=f;o.style.display="flex"}
function shareScore(){
  const txt="Hexic 2048 – "+M()[0]+" – pontszámom: "+score;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(()=>{})}
}
function showOver(){
  const o=$("ov");o.innerHTML="<h2>Game Over!</h2><div class='sb'><small>SCORE</small><b>"+score+"</b></div><div class='wb'><button id='ovU'>UNDO</button><i>"+undos+"</i></div><button id='ovS'>SHARE</button><button id='ovT'>TRY AGAIN</button>";
  o.style.display="flex";
  const u=$("ovU");u.disabled=!hist.length||undos<=0||gmode==="survival";
  u.onclick=()=>{undo()};$("ovS").onclick=shareScore;$("ovT").onclick=newGame;
}
function hideOv(){$("ov").style.display="none"}

function hintText(){
  if(gmode==="survival")return "Survival mode :Merge tiles as fast as possible!";
  if(gmode==="x")return "X-tile mode :X tile cannot be summed.";
  return "Big Hexic ∞ — "+M()[3]+" + "+M()[3]+" = 2. SCORE keeps growing forever!";
}
function stopSurv(){if(survT){clearTimeout(survT);survT=null}}
function survTick(){
  if(over||!started)return;
  const nt=spawn(false);
  if(nt){render([nt.id]);saveGame();}
  if(!canMove()){over=true;stopAuto();showOver();return}
  survT=setTimeout(survTick,Math.max(450,1600-Math.min(Number(score),3450)/3));
}
function startSurv(){
  $("startTxt").style.display="none";started=true;stopSurv();
  survT=setTimeout(survTick,900);saveGame();
}
function newGame(){
  stopAuto();stopSurv();hideOv();$("startTxt").style.display="none";buildCells();tiles=[];score=0n;hist=[];undos=10;over=false;won=false;keepGoing=false;started=true;
  const n=cells.length;
  if(gmode==="x"){const k=Math.max(1,Math.round(n/10));for(let i=0;i<k;i++)spawn(true)}
  const st=Math.max(2,Math.min(6,Math.round(n/8)));
  for(let i=0;i<st;i++)spawn(false);
  try{best=BigInt(ls(true,"hex2048best"+mi+gmode)||"0")}catch(_){best=0n}
  $("hint").textContent=hintText();
  fullRender();
  if(gmode==="survival"){started=false;$("startTxt").style.display="flex"}
  saveGame();
}
function undo(){
  if(undos<=0||!hist.length||gmode==="survival")return;
  const h=hist.pop();undos--;over=false;hideOv();
  tiles=h.tiles.map(t=>({...t}));score=h.score;
  fullRender();
  saveGame();
}

/* Auto */
function movable(){return dirs().map((d,i)=>{const c=tiles.map(t=>({...t}));const r=step(c,d);return r.moved?{i,g:r.gained,free:cells.length-c.filter(t=>!t.dead).length}:null}).filter(Boolean)}
function pickDir(){
  const mv=movable();if(!mv.length)return -1;
  const n=dirs().length,ok=i=>mv.find(m=>m.i===i);
  if(autoMode==="Random")return mv[Math.floor(Math.random()*mv.length)].i;
  if(autoMode==="Swirl"){for(let k=0;k<n;k++){const i=(autoStep+k)%n;if(ok(i)){autoStep=i+1;return i}}}
  if(autoMode==="Swing"){const a=autoStep%2?n===6?3:2:0;const b=n===6?3:2;const pref=autoStep%2?b:0;
    if(ok(pref)){autoStep++;return pref}
    const rest=mv.filter(m=>m.i!==pref);
    if(rest.length){autoStep++;return rest[Math.floor(Math.random()*rest.length)].i}}
  // Corner: keep pushing toward one corner
  const order=n===6?[0,5,1,4,2,3]:[0,3,1,2];
  const merge=mv.filter(m=>m.g>0&&order.slice(0,n===6?4:3).includes(m.i)).sort((x,y)=>order.indexOf(x.i)-order.indexOf(y.i));
  for(const o of order){if(ok(o))return o}
  return mv[0].i;
}
function stopAuto(){if(autoT){clearInterval(autoT);autoT=null}$("bAuto").classList.remove("on");$("board").style.removeProperty("--d")}
function startAuto(name){
  stopAuto();autoMode=name;autoStep=0;$("bAuto").classList.add("on");
  $("board").style.setProperty("--d",".38s");
  autoT=setInterval(()=>{if(over||!started){if(over)stopAuto();return}const d=pickDir();if(d<0)stopAuto();else doMove(d)},750);
}

/* Input */
function dirFromVec(dx,dy){
  const ds=dirs();let bi=0,bs=-2;
  const len=Math.hypot(dx,dy);
  ds.forEach((d,i)=>{
    let vx,vy;
    if(M()[1]==="hex"){vx=1.5*d[0];vy=SQ3*(d[1]+d[0]/2)}else{vx=d[0];vy=d[1]}
    const vl=Math.hypot(vx,vy),s=(dx*vx+dy*vy)/(len*vl);
    if(s>bs){bs=s;bi=i}
  });
  return bi;
}
let sx=0,sy=0,down=false;
const bd=$("wrap");
bd.addEventListener("pointerdown",e=>{if(e.target.closest("#ov"))return;down=true;sx=e.clientX;sy=e.clientY;});
window.addEventListener("pointerup",e=>{
  if(!down)return;down=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)<24)return;
  doMove(dirFromVec(dx,dy));
});
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();let di=-1;
  if(M()[1]==="hex"){di={w:0,e:1,d:2,s:3,a:4,q:5,arrowup:0,arrowdown:3}[k]??-1}
  else di={arrowup:0,w:0,arrowright:1,d:1,arrowdown:2,s:2,arrowleft:3,a:3}[k]??-1;
  if(di>=0){e.preventDefault();doMove(di)}
  else if(k==="z"||k==="u")undo();
});

/* UI */
function closeMenus(){$("mm").style.display="none";$("hm").style.display="none"}
function openMenu(btn,items,cur,onPick){
  const m=$("mm"),was=m.style.display==="block"&&m.dataset.for===btn.id;
  closeMenus();if(was)return;
  m.innerHTML="";m.dataset.for=btn.id;
  items.forEach((x,i)=>{const d=document.createElement("div");d.textContent=x;if(i===cur)d.className="sel";d.onclick=ev=>{ev.stopPropagation();closeMenus();onPick(i,x)};m.appendChild(d)});
  m.style.left=Math.min(btn.offsetLeft,$("bar").clientWidth-150)+"px";m.style.display="block";
}
const MODENAMES=["Classic","Survival","X-Tile"],MODEKEYS=["classic","survival","x"];
$("bGrid").onclick=e=>{e.stopPropagation();openMenu($("bGrid"),MODES.map(x=>x[0]),mi,i=>{mi=i;newGame()})};
$("bMode").onclick=e=>{e.stopPropagation();openMenu($("bMode"),MODENAMES,MODEKEYS.indexOf(gmode),i=>{gmode=MODEKEYS[i];newGame()})};
$("bAuto").onclick=e=>{e.stopPropagation();
  if(autoT){stopAuto();return}
  openMenu($("bAuto"),["Corner","Swing","Swirl","Random"],["Corner","Swing","Swirl","Random"].indexOf(autoMode),(i,x)=>{if(!over&&started)startAuto(x)})};
$("menuBtn").onclick=e=>{e.stopPropagation();const o=$("hm").style.display==="block";closeMenus();if(!o)$("hm").style.display="block"};
$("hm").onclick=e=>{e.stopPropagation();const a=e.target.closest("[data-a]");if(!a)return;closeMenus();
  if(a.dataset.a==="new")newGame();else shareScore()};
document.addEventListener("click",closeMenus);
$("startTxt").onclick=startSurv;
$("bUndo").onclick=undo;
window.addEventListener("resize",()=>{if(cells.length)fullRender()});
if(!loadGame())newGame();
})();
</script>
</body>
