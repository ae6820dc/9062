<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspect Ratio Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:700px;margin:auto}input{padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;width:120px}section{background:#181818;padding:20px;border-radius:12px;margin-top:15px}.box{background:#333;margin:20px auto;max-width:90%;aspect-ratio:16/9}</style></head><body><main><h1>📐 Aspect Ratio Lab</h1><section><input id="w" type="number" value="1920"> × <input id="h" type="number" value="1080"><button onclick="go()">Számol</button><h2 id="r"></h2><p id="p"></p><div class="box" id="box"></div></section></main><script>function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function go(){let a=+w.value,b=+h.value,g=gcd(a,b);r.textContent=a+'×'+b+' = '+a/g+':'+b/g;p.textContent='Arány: '+(a/b).toFixed(6);box.style.aspectRatio=a+'/'+b}go()</script></body></html>
