<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compression Simulator</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}textarea{width:100%;height:160px;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:10px}pre{background:#181818;padding:15px;border-radius:10px}</style></head><body><main><h1>🗜️ Compression Simulator</h1><textarea id="t">AAAAABBBBBBBBBCCCCCCCCCCCCDDDDDDDDDDDD</textarea><button onclick="go()">RLE szimuláció</button><pre id="o"></pre></main><script>function go(){let s=t.value,r='';for(let i=0;i<s.length;){let j=i+1;while(j<s.length&&s[j]===s[i])j++;r+=(j-i)+s[i];i=j}o.textContent='Eredeti: '+s.length+' karakter\nRLE: '+r+' karakter\n\n'+r+(r.length<s.length?'\n\nElméletben rövidebb lett.':'\n\nEbben az esetben nem lett rövidebb.')}go()</script></body></html>
