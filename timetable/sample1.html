        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                // Ellenőrizzük, hogy mind a 256 osztály megvan-e

                if (keys.length === 256) {
                    return parsed;

            }

        // Ha nincs mentve vagy hiányos, létrehozzuk az összeset

        return '00';
    }

    function saveSelectedClass(osztaly) {
        localStorage.setItem(SELECTED_CLASS_KEY, osztaly);
    }

    let osszesAdat = getOsszesOsztaly();
    let aktualisOsztaly = getSelectedClass();
    let aktualisAdatok = osszesAdat[aktualisOsztaly] || JSON.parse(JSON.stringify(ALAP_ORAREND));
    let szerkesztesAktiv = false;

    // ==================== OSZTÁLYVÁLASZTÓ FRISSÍTÉSE ====================
    function frissitOsztalySelector() {
        const select = document.getElementById('classSelect');
        const currentValue = select.value;
        select.innerHTML = '';
        
        const osztalyok = Object.keys(osszesAdat).sort((a, b) => {
            return parseInt(a, 16) - parseInt(b, 16);
        });
        
        osztalyok.forEach(osztaly => {
            const option = document.createElement('option');
            option.value = osztaly;
            option.textContent = osztaly;
            select.appendChild(option);
        });
        
        // Az elmentett osztályt állítjuk be, ha létezik
        if (osztalyok.includes(aktualisOsztaly)) {
            select.value = aktualisOsztaly;
        } else if (osztalyok.length > 0) {
            select.value = osztalyok[0];
            aktualisOsztaly = select.value;
            saveSelectedClass(aktualisOsztaly);
        }
    }

    // ==================== OSZTÁLYVÁLTÁS ====================
    function valtOsztaly() {
        const select = document.getElementById('classSelect');
        const ujOsztaly = select.value;
        
        // Ha szerkesztés volt, mentsük az aktuális állapotot
        if (szerkesztesAktiv) {
            osszesAdat[aktualisOsztaly] = JSON.parse(JSON.stringify(aktualisAdatok));
            saveOsszesOsztaly(osszesAdat);
            szerkesztesAktiv = false;
        }
        
        aktualisOsztaly = ujOsztaly;
        saveSelectedClass(aktualisOsztaly);
        aktualisAdatok = osszesAdat[ujOsztaly] || JSON.parse(JSON.stringify(ALAP_ORAREND));
        frissitNezet();
        
        document.getElementById('statusMsg').className = 'status-msg';
        document.getElementById('statusMsg').textContent = `📖 Osztály: ${ujOsztaly} – Olvasó mód`;
    }

    // ==================== RANDOM ÓRAREND ====================
    function randomOrarend() {
        const jelszo = prompt('🔐 A random generáláshoz add meg a jelszót:', '');
        if (jelszo !== '1111') {
            if (jelszo !== null) {
                document.getElementById('statusMsg').className = 'status-msg error';
                document.getElementById('statusMsg').textContent = '❌ Hibás jelszó!';
            }
            return;
        }

        if (szerkesztesAktiv) {
            szerkesztesAktiv = false;
        }

        const napok = ['hetfo', 'kedd', 'szerda', 'csutortok', 'pentek'];

        aktualisAdatok.forEach(sor => {
            napok.forEach(nap => {
                const randomIndex = Math.floor(Math.random() * TANTARGYAK.length);
                sor[nap] = TANTARGYAK[randomIndex];
            });
        });

        osszesAdat[aktualisOsztaly] = JSON.parse(JSON.stringify(aktualisAdatok));
        saveOsszesOsztaly(osszesAdat);
        frissitNezet();

        document.getElementById('statusMsg').className = 'status-msg random';
        document.getElementById('statusMsg').textContent = `🎲 Random órarend generálva (${aktualisOsztaly})!`;
    }

    // ==================== SELECT MENÜ ====================
    function createSelect(value, rowIdx, colKey) {
        const select = document.createElement('select');
        select.className = 'ora-select';
        select.dataset.row = rowIdx;
        select.dataset.col = colKey;

        TANTARGYAK.forEach(targy => {
            const option = document.createElement('option');
            option.value = targy;
            option.textContent = targy;
            if (targy === value) {
                option.selected = true;
            }
            select.appendChild(option);
        });

        return select;
    }

    // ==================== TABLA MEGJELENÍTÉS ====================
    function renderTabla(adatok, editMode) {
        const tbody = document.getElementById('orarendTest');
        tbody.innerHTML = '';

        adatok.forEach((sor, index) => {
            const tr = document.createElement('tr');
            const napok = ['ido', 'hetfo', 'kedd', 'szerda', 'csutortok', 'pentek'];

            napok.forEach((key, idx) => {
                const td = document.createElement('td');
                if (idx === 0) {
                    td.className = 'ido';
                    td.textContent = sor[key];
                } else {
                    const ertek = sor[key] || 'Szabad';
                    const osztaly = getOsztaly(ertek);

                    if (editMode) {
                        td.className = osztaly;
                        const select = createSelect(ertek, index, key);
                        td.appendChild(select);
                    } else {
                        td.className = osztaly;
                        const span = document.createElement('span');
                        span.className = 'ora-szoveg';
                        span.textContent = ertek;
                        td.appendChild(span);
                    }
                }
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });

        document.querySelectorAll('.ora-select').forEach(el => el.style.display = editMode ? 'block' : 'none');
        document.querySelectorAll('.ora-szoveg').forEach(el => el.style.display = editMode ? 'none' : 'block');

        if (editMode) {
            document.getElementById('orarendTabla').classList.add('szerkesztheto');
        } else {
            document.getElementById('orarendTabla').classList.remove('szerkesztheto');
        }
    }

    function frissitNezet() {
        renderTabla(aktualisAdatok, szerkesztesAktiv);
    }

    // ==================== SZERKESZTÉS INDÍTÁSA ====================
    function szerkesztesIndit() {
        const jelszo = prompt('🔐 Add meg a szerkesztési jelszót:', '');
        if (jelszo === '1111') {
            szerkesztesAktiv = true;
            frissitNezet();
            document.getElementById('statusMsg').className = 'status-msg success';
            document.getElementById('statusMsg').textContent = `✏️ Szerkesztő mód aktív (${aktualisOsztaly}) – válassz a legördülő menüből, majd kattints a Mentés gombra!`;
        } else if (jelszo === null) {
            // Mégse
        } else {
            document.getElementById('statusMsg').className = 'status-msg error';
            document.getElementById('statusMsg').textContent = '❌ Hibás jelszó!';
        }
    }

    // ==================== MENTÉS ====================
    function mentes() {
        if (!szerkesztesAktiv) {
            return;
        }

        const selects = document.querySelectorAll('.ora-select');
        const ujAdatok = JSON.parse(JSON.stringify(aktualisAdatok));

        selects.forEach(select => {
            const rowIdx = parseInt(select.dataset.row);
            const colKey = select.dataset.col;
            if (!isNaN(rowIdx) && colKey && ujAdatok[rowIdx]) {
                ujAdatok[rowIdx][colKey] = select.value || 'Szabad';
            }
        });

        aktualisAdatok = ujAdatok;
        osszesAdat[aktualisOsztaly] = JSON.parse(JSON.stringify(aktualisAdatok));
        saveOsszesOsztaly(osszesAdat);

        szerkesztesAktiv = false;
        frissitNezet();

        document.getElementById('statusMsg').className = 'status-msg success';
        document.getElementById('statusMsg').textContent = `✅ Órarend sikeresen elmentve (${aktualisOsztaly})!`;
    }

    // ==================== INDULÁS ====================
    frissitOsztalySelector();
    // Az elmentett osztályt már a frissitOsztalySelector beállította
    aktualisAdatok = osszesAdat[aktualisOsztaly] || JSON.parse(JSON.stringify(ALAP_ORAREND));
    frissitNezet();

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && szerkesztesAktiv) {
            const target = e.target;
            if (target.classList.contains('ora-select')) {
                mentes();
            }
        }
    });
</script>

</body>
