<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="세상을 뒤흔드는 뉴스"><link rel="manifest" href="./manifest-ko.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>세상을 뒤흔드는 뉴스</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#152033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#101827;color:white;padding:18px max(16px,calc((100vw - 1120px)/2))}h1{font-size:clamp(27px,5vw,43px);margin:0}header small{color:#c4d1e6}.ticker{background:#d3213a;color:white;padding:12px 18px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:20px 15px}.notice{background:#fff3d8;border-left:5px solid #e5a41d;padding:12px 16px;border-radius:7px;margin-bottom:17px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}button,input{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid #cbd3df}button{background:#14233b;color:white;cursor:pointer}button:hover{background:#314d73}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:17px}.article{background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 22px #15203312;display:flex;flex-direction:column}.art{width:100%;aspect-ratio:16/9;object-fit:cover;background:#c4d8ef}.content{padding:18px;flex:1}.tag{color:#c3213b;font-size:11px;font-weight:900;letter-spacing:1px}.content h2{font-size:21px;line-height:1.3;margin:10px 0}.content p{font-size:18px;line-height:1.75;color:#465368;white-space:pre-line}.foot{padding:0 18px 18px;display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:26px;color:#66758a}dialog{border:0;border-radius:17px;max-width:690px;width:calc(100% - 24px);padding:23px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0c1424b9}dialog img{width:100%;border-radius:12px}dialog p{font-size:18px;line-height:1.8;white-space:pre-line}#install{display:none}body{direction:ltr;text-align:left;font-family:system-ui,'Noto Sans KR','Malgun Gothic',sans-serif}header,.wrap,footer{direction:ltr}.notice{border-left:5px solid #e5a41d;border-right:0}.tag{letter-spacing:.5px}input{text-align:left}dialog{direction:ltr;text-align:left}</style></head><body><header><h1>🌪️ 세상을 뒤흔드는 뉴스</h1><small>한국어 무작위 풍자 뉴스 생성기 · 모든 내용은 허구입니다</small></header><div class="ticker">🔴 속보: 현실이 또다시 헤드라인에 대한 책임을 거부했습니다!</div><main class="wrap"><div class="notice"><b>🤣 풍자:</b> 모든 뉴스는 무작위로 생성된 허구의 풍자이며 실제 뉴스가 아닙니다.</div><div class="tools"><button id="new">🎲 황당한 뉴스 12개 생성</button><button id="one">📰 뉴스 하나 더</button><input id="search" placeholder="🔎 뉴스 검색…" aria-label="검색"><button id="install">📲 앱 설치</button></div><section id="grid" class="grid"></section></main><dialog id="detail"><button id="close" style="float:right">✕</button><div id="detailbody"></div></dialog><footer>세상을 뒤흔드는 뉴스 • 무작위 풍자 • Program ID: 906200000000000C<div id="dictstatus">사전 로딩 중…</div><small><a href="https://github.com/acidsound/korean_wordlist">한국어 사전 출처</a></small></footer><script>
const categories=['우주 혼란',"속보",'세계 뉴스','과학 기담','황당한 정치','기상 이변'];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const low=s=>s.charAt(0).toLocaleLowerCase('ko-KR')+s.slice(1);
const count=s=>(s.match(/\S+/g)||[]).length;
const words=("세계 지구 우주 은하 별 태양 달 화성 하늘 구름 폭풍 번개 비 무지개 기후 날씨 온도 시간 미래 과거 오늘 내일 어제 아침 밤 뉴스 기자 편집자 신문 방송 인터넷 휴대전화 컴퓨터 로봇 인공지능 알고리즘 데이터 정보 과학 수학 물리학 화학 생물학 천문학 역사 철학 경제 정치 문화 예술 음악 영화 소설 시 문학 교육 학교 대학 교수 학생 교사 박사 전문가 연구원 과학자 기술자 개발자 발명가 우주인 조종사 선장 의사 간호사 요리사 농부 노동자 운전사 상인 사장 시장 장관 위원회 정부 의회 법원 판사 변호사 경찰 소방관 시민 관광객 관객 배우 가수 감독 화가 작가 선수 감독 심판 친구 가족 아버지 어머니 아이 형제 자매 이웃 왕 여왕 왕자 공주 황제 장군 군인 외계인 마법사 용 공룡 괴물 유령 판다 호랑이 사자 코끼리 원숭이 고릴라 여우 늑대 개 고양이 토끼 쥐 소 말 양 닭 오리 펭귄 돌고래 고래 상어 문어 게 나비 벌 개미 거미 개구리 거북이 뱀 앵무새 독수리 비둘기 기계 비행기 기차 자동차 버스 자전거 배 로켓 위성 지하철 역 공항 항구 도시 마을 서울 부산 인천 제주 도서관 박물관 공원 정원 숲 사막 산 강 호수 바다 해변 섬 화산 빙하 다리 터널 도로 광장 건물 집 궁전 성 연구실 사무실 공장 상점 은행 식당 부엌 거실 창문 문 책상 의자 침대 소파 화면 키보드 시계 안경 모자 신발 옷 가방 열쇠 상자 거울 전구 배터리 카메라 사진 영상 파일 지도 종이 책 연필 편지 선물 금 은 보석 돈 예산 세금 무역 회사 산업 직업 계획 사업 회의 토론 법률 규칙 비밀 소문 수수께끼 기적 발견 발명 실험 이론 공식 숫자 확률 통계 결과 증거 설명 이유 답변 문제 의견 생각 꿈 희망 공포 행복 슬픔 분노 놀라움 농담 유머 풍자 위험 위기 승리 실패 성공 축구 농구 수영 달리기 춤 축제 공연 이야기 신화 음식 음료 차 커피 우유 물 빵 밥 국수 만두 김치 두부 채소 과일 사과 바나나 포도 수박 감자 토마토 오이 당근 양파 마늘 달걀 고기 생선 초콜릿 케이크 아이스크림 사탕 꿀 소금 후추 고추 양자 냉장고 우산").split(' ');
let wordForms=words.slice();
async function loadDictionary(){try{const parts=await Promise.all(Array.from({length:13},async(_,i)=>{const response=await fetch('./korean-dictionary-'+String(i+1).padStart(2,'0')+'.txt',{cache:'force-cache'});if(!response.ok)throw Error('HTTP '+response.status);return response.text()}));const dictionary=[...new Set(parts.join('\n').split(/\r?\n/).map(w=>w.trim().normalize('NFC')).filter(w=>/^[가-힣]{1,30}$/.test(w)))];if(dictionary.length<10000)throw Error('Dictionary too small');wordForms=[...new Set([...words,...dictionary])];stories=Array.from({length:12},generate);save();render();document.querySelector('#dictstatus').textContent='사전: '+wordForms.length.toLocaleString('ko-KR')+' 단어';}catch(e){document.querySelector('#dictstatus').textContent='기본 사전: '+wordForms.length+' 단어';console.warn(e)}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
// Fully random dictionary words: no grammatical or semantic sentence templates.
const randomEndings=['.','!','?'];
const randomSeparators=[',',',',';'];
function randomSentence(){
 const n=5+Math.floor(Math.random()*14);
 const arr=Array.from({length:n},()=>pick(wordForms));
 if(n>7&&Math.random()<0.65){const pos=2+Math.floor(Math.random()*(n-4));arr[pos-1]+=pick(randomSeparators);}
 return arr.join(' ')+pick(randomEndings);
}
function generate(){
 const body=Array.from({length:22},(_,i)=>randomSentence()+(i%5===4?'\n\n':'')).join('');
 const title=Array.from({length:4+Math.floor(Math.random()*7)},()=>pick(wordForms)).join(' ')+pick(randomEndings);
 return {title,body,category:pick(categories),symbol:pick(['☀️','🌙','🪐','🚀','🐔','🌍','👽','🚌','🥔','🐧','⏰','☁️'])};
}
function art(symbol){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#14233c"/><stop offset="1" stop-color="#523f75"/></linearGradient></defs><rect width="800" height="450" fill="url(#g)"/><text x="400" y="235" font-size="150" text-anchor="middle">'+symbol+'</text><text x="400" y="365" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle">세계 뉴스 · 풍자</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
const key='906200000000000C';let stories;try{stories=JSON.parse(localStorage.getItem(key));if(!Array.isArray(stories)||!stories.length)throw 0}catch(e){stories=Array.from({length:12},generate)}function save(){try{localStorage.setItem(key,JSON.stringify(stories))}catch(e){}}save();
const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');function openStory(i){let s=stories[i],el=document.querySelector('#detailbody');el.replaceChildren();let img=document.createElement('img');img.src=art(s.symbol);img.alt='유머 삽화： '+s.symbol;let tag=document.createElement('div');tag.className='tag';tag.textContent=s.category+' · 허구의 풍자';let h=document.createElement('h2');h.textContent=s.title;let p=document.createElement('p');p.textContent=s.body;let note=document.createElement('small');note.textContent='本文为随机生成的허구의 풍자 뉴스。';el.append(img,tag,h,p,note);dialog.showModal()}
function render(){let q=document.querySelector('#search').value.toLowerCase();grid.replaceChildren();stories.forEach((s,i)=>{if(!(s.title+' '+s.body+' '+s.category).toLocaleLowerCase('ko-KR').includes(q))return;let article=document.createElement('article');article.className='article';let img=document.createElement('img');img.className='art';img.src=art(s.symbol);img.alt='이미지： '+s.symbol;let content=document.createElement('div');content.className='content';let tag=document.createElement('span');tag.className='tag';tag.textContent=s.category+' · 풍자';let h=document.createElement('h2');h.textContent=s.title;let p=document.createElement('p');p.textContent=s.body;content.append(tag,h,p);let foot=document.createElement('div');foot.className='foot';let read=document.createElement('button');read.textContent='기사 읽기';read.onclick=()=>openStory(i);let share=document.createElement('button');share.textContent='공유';share.onclick=async()=>{let text='🤣 허구의 풍자 뉴스:  '+s.title+'\n\n'+s.body+'\n\n'+location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:s.title,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('뉴스가 복사되었습니다!')}else prompt('복사：',text)}catch(e){}};foot.append(read,share);article.append(img,content,foot);grid.append(article)})}
document.querySelector('#new').onclick=()=>{stories=Array.from({length:12},generate);save();render()};document.querySelector('#one').onclick=()=>{stories.unshift(generate());stories=stories.slice(0,24);save();render();window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('#search').oninput=render;document.querySelector('#close').onclick=()=>dialog.close();render();loadDictionary();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.querySelector('#install').style.display='block'});document.querySelector('#install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}};
</script></body></html>
