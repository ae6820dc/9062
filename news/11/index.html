async function loadDictionary(){try{const response=await fetch('./chinese-dictionary.txt',{cache:'force-cache'});if(!response.ok)throw Error('HTTP '+response.status);const dictionary=[...new Set((await response.text()).split(/\r?\n/).map(w=>w.trim()).filter(w=>/^[\u3400-\u9fff\uf900-\ufaff]{2,8}$/.test(w)))];if(dictionary.length<10000)throw Error('词典数量不足');wordForms=[...new Set([...words,...dictionary])];stories=Array.from({length:12},generate);save();render();console.info('中文词条数量:',wordForms.length)}catch(err){console.warn('词典暂不可用，使用内置词汇',err)}}

function generate(){let body='';for(let i=0;i<22;i++)body+=randomSentence()+(i%5===4?'\n\n':' ');const title=pick(subjects)+'与“'+pick(wordForms)+'”：'+pick(['紧急会议引发全球关注','不可思议的发现震惊世界','专家集体陷入沉思','最新决定引发激烈争论','神秘报告令人哭笑不得','意外事件让全城沸腾'])+'！';return {title,body,category:pick(categories),symbol:pick(['☀️','🌙','🪐','🚀','🐔','🌍','👽','🚌','🥔','🐧','⏰','☁️'])}}

const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');function openStory(i){let s=stories[i],el=document.querySelector('#detailbody');el.replaceChildren();let img=document.createElement('img');img.src=art(s.symbol);img.alt='幽默插画： '+s.symbol;let tag=document.createElement('div');tag.className='tag';tag.textContent=s.category+' · 虚构讽刺';let h=document.createElement('h2');h.textContent=s.title;let p=document.createElement('p');p.textContent=s.body;let note=document.createElement('small');note.textContent='本文为随机生成的虚构讽刺新闻。';el.append(img,tag,h,p,note);dialog.showModal()}
function render(){let q=document.querySelector('#search').value.toLowerCase();grid.replaceChildren();stories.forEach((s,i)=>{if(!(s.title+' '+s.body+' '+s.category).toLocaleLowerCase('ar').includes(q))return;let article=document.createElement('article');article.className='article';let img=document.createElement('img');img.className='art';img.src=art(s.symbol);img.alt='图片： '+s.symbol;let content=document.createElement('div');content.className='content';let tag=document.createElement('span');tag.className='tag';tag.textContent=s.category+' · 讽刺';let h=document.createElement('h2');h.textContent=s.title;let p=document.createElement('p');p.textContent=s.body;content.append(tag,h,p);let foot=document.createElement('div');foot.className='foot';let read=document.createElement('button');read.textContent='阅读全文';read.onclick=()=>openStory(i);let share=document.createElement('button');share.textContent='分享';share.onclick=async()=>{let text='🤣 خبر ساخر خيالي:  '+s.title+'\n\n'+s.body+'\n\n'+location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:s.title,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('已复制新闻！')}else prompt('复制：',text)}catch(e){}};foot.append(read,share);article.append(img,content,foot);grid.append(article)})}
