let wordForms=words.slice();
async function loadDictionary(){try{const response=await fetch('./arabic-dictionary.txt',{cache:'force-cache'});if(!response.ok)throw Error('HTTP '+response.status);const dictionary=[...new Set((await response.text()).split(/\r?\n/).map(w=>w.trim()).filter(w=>/^[\u0621-\u064a\u0671-\u06d3]{2,}$/.test(w)))];if(dictionary.length<10000)throw Error('القاموس صغير جداً');wordForms=[...new Set([...words,...dictionary])];console.info('كلمات القاموس العربي:',wordForms.length)}catch(err){console.warn('تعذر تحميل القاموس؛ تُستخدم الكلمات المدمجة',err)}}

// Fully random dictionary words: no grammatical or semantic sentence templates.
const randomEndings=[".","!","؟"];
const randomSeparators=["،","؛",","];
function randomSentence(){
  const n=5+Math.floor(Math.random()*14);
  const arr=Array.from({length:n},()=>pick(wordForms));
  const joiner=' ';
  if(n>7&&Math.random()<0.65){const pos=2+Math.floor(Math.random()*(n-4));arr[pos-1]+=' '+pick(randomSeparators);}
  let s=arr.join(joiner).trim();
  // Chinese, Japanese and Arabic scripts have no uppercase/lowercase distinction.
  return s+pick(randomEndings);
}
function generate(){
  const body=Array.from({length:22},(_,i)=>randomSentence()+(i%5===4?'\n\n':' ')).join('');
  const titleWords=Array.from({length:4+Math.floor(Math.random()*7)},()=>pick(wordForms));
  let title=titleWords.join(' ');
  
  title+=pick(randomEndings);
  return {title,body,category:pick(categories),symbol:pick(['☀️','🌙','🪐','🚀','🐔','🌍','👽','🚌','🥔','🐧','⏰','☁️'])};
}
function art(symbol){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#14233c"/><stop offset="1" stop-color="#523f75"/></linearGradient></defs><rect width="800" height="450" fill="url(#g)"/><text x="400" y="225" font-size="150" text-anchor="middle" dominant-baseline="central">'+symbol+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
const key='akhbar-ar10-v1-pure-random-v2';let stories;try{stories=JSON.parse(localStorage.getItem(key));if(!Array.isArray(stories)||!stories.length)throw 0}catch(e){stories=[]}function save(){try{localStorage.setItem(key,JSON.stringify(stories))}catch(e){}}
const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');const readingState = setupNewsReadingState({ key, dialog, search: document.querySelector('#search'), getStories: () => stories, openStory });

function render(){let q=document.querySelector('#search').value.toLowerCase();grid.replaceChildren();stories.forEach((s,i)=>{if(!(s.title+' '+s.body+' '+s.category).toLocaleLowerCase('ar').includes(q))return;let article=document.createElement('article');article.className='article';let img=document.createElement('img');img.className='art';img.src=art(s.symbol);img.alt='صورة: '+s.symbol;let content=document.createElement('div');content.className='content';let tag=document.createElement('span');tag.className='tag';tag.textContent=s.category+' · سخرية';let h=document.createElement('h2');h.textContent=s.title;let p=document.createElement('p');p.textContent=s.body;content.append(tag,h,p);let foot=document.createElement('div');foot.className='foot';let read=document.createElement('button');read.textContent='اقرأ الخبر كاملاً';read.onclick=()=>openStory(i);let share=document.createElement('button');share.textContent='مشاركة';share.onclick=async()=>{let text='🤣 خبر ساخر خيالي:  '+s.title+'\n\n'+s.body+'\n\n'+location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:s.title,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('تم نسخ الخبر!')}else prompt('نسخ:',text)}catch(e){}};foot.append(read,share);article.append(img,content,foot);grid.append(article)})}
document.querySelector('#new').onclick=()=>{stories=Array.from({length:12},generate);save();render()};document.querySelector('#one').onclick=()=>{stories.unshift(generate());stories=stories.slice(0,24);save();render();window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('#search').oninput=render;document.querySelector('#close').onclick=()=>dialog.close();render();
