<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px;text-align:center}main{max-width:700px;margin:auto}.time{font-size:4rem;font-variant-numeric:tabular-nums}button{padding:12px 18px;margin:4px;background:#222;color:#fff;border:1px solid #555;border-radius:8px}li{list-style:none;background:#181818;margin:5px;padding:8px}</style></head><body><main><h1>🕐 Stopwatch Lab</h1><div class="time" id="d">00:00.000</div><button onclick="start()">Start</button><button onclick="lap()">Kör</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button><ul id="l"></ul></main><script>let st=0,timer=null,last=0;function fmt(ms){let m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=ms%1000;return [m,s,x].map((v,i)=>String(v).padStart(i==2?3:2,'0')).join(i==0?':':'.')}function tick(){d.textContent=fmt(Date.now()-st)}function start(){if(!timer){st=st||Date.now();timer=setInterval(tick,10)}}function stop(){clearInterval(timer);timer=null;tick()}function lap(){let v=Date.now()-st;l.innerHTML+='<li>'+fmt(v)+'</li>'}function reset(){stop();st=0;d.textContent='00:00.000';l.innerHTML=''} </script></body></html>
