<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probability Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}input,button{padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:8px}pre{background:#181818;padding:15px;border-radius:10px}</style></head><body><main><h1>🎲 Probability Lab</h1><label>Dobások <input id="n" type="number" value="10000" min="1" max="1000000"></label><button onclick="go()">100-as kocka</button><pre id="o"></pre></main><script>function go(){let N=+n.value,c=Array(100).fill(0);for(let i=0;i<N;i++)c[Math.floor(Math.random()*100)]++;o.textContent=c.map((v,i)=>String(i+1).padStart(3)+' '+v+' '+('█'.repeat(Math.min(60,Math.round(v/N*1000))))).join('\n')}</script></body></html>
