<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2224%22%20fill%3D%22%230f1420%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%22118%22%20height%3D%22118%22%20rx%3D%2220%22%20fill%3D%22none%22%20stroke%3D%22%233ec7c2%22%20stroke-width%3D%225%22%2F%3E%3Ctext%20x%3D%2264%22%20y%3D%2229%22%20text-anchor%3D%22middle%22%20fill%3D%22%23e8eef8%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%3EV37%3C%2Ftext%3E%3Ctext%20x%3D%2264%22%20y%3D%2276%22%20text-anchor%3D%22middle%22%20fill%3D%22%233ec7c2%22%20font-family%3D%22Arial%22%20font-size%3D%2243%22%20font-weight%3D%22bold%22%3E96!%3C%2Ftext%3E%3Ctext%20x%3D%2264%22%20y%3D%22105%22%20text-anchor%3D%22middle%22%20fill%3D%22%23e8eef8%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3E%233%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Translate</title>
<style>
  :root{
    --bg:#0f1420; --tile-on:#3ec7c2; --tile-off:#2a3550;
    --ink:#e8eef8; --muted:#9fb3c8; --digit-ink:#e7f0ff; --gap:10px;
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial;
    display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color: transparent;
  }
  h1{font-size:18px; font-weight:700; margin:10px 0 8px}
  #frame{display:flex; flex-direction:column; align-items:center}
  .hud{width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; color:var(--muted); font-size:20px; padding:0 4px;}
  .row{display:flex; align-items:baseline; gap:8px; min-width:0}
  .row .label{white-space:nowrap}
  .value{display:block; width:100%; overflow-x:auto; white-space:nowrap; padding-bottom:2px; border-bottom:1px dashed rgba(231,240,255,0.2);}  
  canvas{display:block; position:relative; touch-action:manipulation}
  .bar{width:100%; display:flex; justify-content:center; gap:var(--gap); flex-wrap:wrap}
  button{
    margin:12px 0 14px; padding:0; border:none; border-radius:0px;
    background:var(--tile-off); color:var(--digit-ink); font-weight:700;
    touch-action:manipulation; user-select:none;
    width:64px; height:64px; min-width:unset; display:flex; align-items:center; justify-content:center;
  }
  .btn-on{ background:var(--tile-on)!important; color:#0a1320!important; }
  @media (max-width:420px){ .hud{font-size:18px; gap:5px; padding:0 2px} h1{font-size:16px} }
  .hud, .hud .label, .value .real { color: var(--ink); font-weight:700; }
</style>
</head>
<body>
<h1>Program ID : AB69BDD34E4085EC</h1>
<div id="frame">
  <div class="hud" id="hud">
    <div class="row">
      <span class="label">Step:</span>
      <div id="sValue" class="value" aria-label="Step counter"><span class="real">0</span></div>
    </div>
    <div class="row">
      <span class="label">Score:</span>
      <div id="mValue" class="value" aria-label="Score counter"><span class="real">0</span></div>
    </div>
  </div>
  <canvas id="stage" aria-label="9×12 toggleable grid with three 9×4 sections"></canvas>
  <div class="bar">
    <button id="n0" aria-label="N0" aria-pressed="false">N0</button>
    <button id="n1" aria-label="N1" aria-pressed="false">N1</button>
    <button id="n2" aria-label="N2" aria-pressed="false">N2</button>
    <button id="n3" aria-label="N3" aria-pressed="false">N3</button>
    <button id="autoToggle" aria-label="Auto Random Toggle" aria-pressed="false">R</button>
  </div>
</div>
<script>
(()=> {
  // ---------- GRID: 9 oszlop × 12 sor, három számozott blokk ----------
  const COLS = 9;    // 9 oszlop
  const ROWS = 12;   // 12 sor
  const SECTION_SIZE = 36;
  const SECTION_ROWS = SECTION_SIZE / COLS;
  const SECTION_GAPS = ROWS / SECTION_ROWS - 1;
  const DPR = Math.max(1, Math.min(window.devicePixelRatio||1, 2));
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COLORS = { BG: css('--bg'), ON: css('--tile-on'), OFF: css('--tile-off'), INK: css('--ink'), DIGIT_INK: css('--digit-ink') };
  const grid = { cols: COLS, rows: ROWS, size: 0, pad: 10, radius: 0 };

  function emptyMatrix() {
    return Array.from({ length: grid.rows }, () => Array(grid.cols).fill(false));
  }
  const defaultBoardState = () => ({ matrix: emptyMatrix(), step: "0", score: "0" });
  let boardsState = Array.from({ length: 16 }, defaultBoardState);
  let activeButtons = [false, false, false, false];
  let viewIndex = 0;
  const AUTO_TOGGLE_DELAY = 200;
  let autoToggleTimer = null;
  let isAutoToggleActive = false;

  const elM = document.getElementById('mValue');
  const elS = document.getElementById('sValue');
  const hud = document.getElementById('hud');
  const frame = document.getElementById('frame');
  const btns = [
    document.getElementById('n0'),
    document.getElementById('n1'),
    document.getElementById('n2'),
    document.getElementById('n3'),
    document.getElementById('autoToggle'),
  ];

  const STORAGE_KEY = 'A7A846ADEFDD35E4';

  // ---------- Big integer helpers ----------
  const stripZeros = (s) => {
    let t = (s || '0').replace(/^(-?)0+(?=\d)/, '$1');
    return t === '' ? '0' : t;
  };
  const splitSign = (s) => s[0] === '-' ? [-1, s.slice(1)] : [1, s];
  const cmpAbs = (a, b) => {
    if (a.length !== b.length) return a.length - b.length;
    if (a === b) return 0;
    return a < b ? -1 : 1;
  };
  const addAbs = (a, b) => {
    a = stripZeros(a); b = stripZeros(b);
    let res = '', carry = 0, i = a.length - 1, j = b.length - 1;
    while (i >= 0 || j >= 0 || carry) {
      const da = i >= 0 ? (a.charCodeAt(i) - 48) : 0;
      const db = j >= 0 ? (b.charCodeAt(j) - 48) : 0;
      const s = da + db + carry;
      res = (s % 10) + res; carry = (s / 10) | 0; i--; j--;
    }
    return stripZeros(res);
  };
  const subAbs = (a, b) => {
    a = stripZeros(a); b = stripZeros(b);
    let res = '', borrow = 0, i = a.length - 1, j = b.length - 1;
    while (i >= 0) {
      let da = a.charCodeAt(i) - 48 - borrow;
      const db = j >= 0 ? (b.charCodeAt(j) - 48) : 0;
      if (da < db) { da += 10; borrow = 1; } else borrow = 0;
      res = (da - db) + res; i--; j--;
    }
    return stripZeros(res.replace(/^0+(?=\d)/, ''));
  };
  const addSigned = (A, B) => {
    let [sa, a] = splitSign(stripZeros(A));
    let [sb, b] = splitSign(stripZeros(B));
    if (a === '0' && sa === 1) return (sb < 0 ? '-' : '') + b;
    if (b === '0' && sb === 1) return (sa < 0 ? '-' : '') + a;
    if (sa === sb) {
      const s = addAbs(a, b);
      return (sa < 0 ? '-' : '') + s;
    } else {
      const cmp = cmpAbs(a, b);
      if (cmp === 0) return '0';
      if (cmp > 0) {
        const s = subAbs(a, b);
        return (sa < 0 ? '-' : '') + s;
      } else {
        const s = subAbs(b, a);
        return (sb < 0 ? '-' : '') + s;
      }
    }
  };
  const incUnsigned = (A) => stripZeros(addAbs(stripZeros(A), '1'));
  const halfUnsigned = (A) => {
    A = stripZeros(A);
    let res = '';
    let carry = 0;
    for (let i = 0; i < A.length; i++) {
      const n = carry * 10 + (A.charCodeAt(i) - 48);
      const q = (n / 2) | 0;
      res += String(q);
      carry = n % 2;
    }
    return stripZeros(res);
  };

  const isBoardEmpty = (m) => {
    for (let r = 0; r < m.length; r++) {
      for (let c = 0; c < m[r].length; c++) {
        if (m[r][c]) return false;
      }
    }
    return true;
  };

  function maskFromButtons() {
    return (activeButtons[0] ? 1 : 0) | (activeButtons[1] ? 2 : 0) | (activeButtons[2] ? 4 : 0) | (activeButtons[3] ? 8 : 0);
  }
  function renderValue(el, v) {
    el.innerHTML = '<span class="real">' + v + '</span>';
    requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
  }
  const SAVE_EVERY_STEPS = 100;
  let unsavedSteps = 0;
  let stateDirty = false;

  function syncHUD() {
    const b = boardsState[viewIndex];
    renderValue(elM, b.score);
    renderValue(elS, b.step);
  }

  function toggleCell(r, c) {
    const b = boardsState[viewIndex];
    const wasOn = b.matrix[r][c];
    b.matrix[r][c] = !wasOn;

    b.step = incUnsigned(b.step);

    // Score: on -> -1, off -> +2  (the original scoring rule is preserved)
    b.score = wasOn ? addSigned(b.score, "2") : addSigned(b.score, "-1");

    if (isBoardEmpty(b.matrix) && b.step !== "0") {
      b.score = halfUnsigned(b.step);
    }

    unsavedSteps++;
    stateDirty = true;
    saveState();
    syncHUD();
    draw();
  }

  function scheduleAutoToggle() {
    autoToggleTimer = setTimeout(() => {
      const index = Math.floor(Math.random() * ROWS * COLS);
      toggleCell(Math.floor(index / COLS), index % COLS);
      scheduleAutoToggle();
    }, AUTO_TOGGLE_DELAY);
  }

  function startAutoToggle() {
    if (isAutoToggleActive) return;
    isAutoToggleActive = true;
    scheduleAutoToggle();
  }

  function stopAutoToggle() {
    isAutoToggleActive = false;
    clearTimeout(autoToggleTimer);
    autoToggleTimer = null;
    saveState(true);
  }

  function toggleAutoMode() {
    if (isAutoToggleActive) {
      stopAutoToggle();
    } else {
      startAutoToggle();
    }
    renderButtons();
  }

  function rr(x, y, w, h, r) {
    const a = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + a, y);
    ctx.arcTo(x + w, y, x + w, y + h, a);
    ctx.arcTo(x + w, y + h, x, y + h, a);
    ctx.arcTo(x, y + h, x, y, a);
    ctx.arcTo(x, y, x + w, y, a);
    ctx.closePath();
  }

  function drawSymbol(cx, cy, txt, isOn) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.max(14, Math.floor(grid.size * 0.42)) + 'px Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial';
    ctx.fillStyle = isOn ? '#0a1320' : COLORS.DIGIT_INK;
    ctx.fillText(txt, cx, cy);
  }

  function rowOffset(row) {
    return row * (grid.size + grid.pad) + (1 + Math.floor(row / SECTION_ROWS)) * grid.pad;
  }

  function draw() {
    const b = boardsState[viewIndex];
    ctx.fillStyle = COLORS.BG;
    ctx.fillRect(0, 0, canvas.width / DPR, canvas.height / DPR);

    for (let r = 0; r < grid.rows; r++) {
      for (let c = 0; c < grid.cols; c++) {
        // 36-os számrendszer: 0-9, A-Z
        const symbol = String(Math.floor(r / SECTION_ROWS));
        const x = c * (grid.size + grid.pad) + grid.pad;
        const y = rowOffset(r);
        rr(x, y, grid.size, grid.size, grid.radius);
        const on = b.matrix[r][c];
        ctx.fillStyle = on ? COLORS.ON : COLORS.OFF;
        ctx.fill();
        drawSymbol(x + grid.size / 2, y + grid.size / 2, symbol, on);
      }
    }
  }

  function pointerXY(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    return { x, y };
  }

  function toggleAt(x, y) {
    for (let r = 0; r < grid.rows; r++) {
      for (let c = 0; c < grid.cols; c++) {
        const cx = c * (grid.size + grid.pad) + grid.pad;
        const cy = rowOffset(r);
        if (x >= cx && x <= cx + grid.size && y >= cy && y <= cy + grid.size) {
          toggleCell(r, c);
          return;
        }
      }
    }
  }

  canvas.addEventListener('click', e => { const p = pointerXY(e); toggleAt(p.x, p.y); });

  function renderButtons() {
    btns.forEach((btn, i) => {
      if (i === 4) {
        const on = isAutoToggleActive;
        btn.classList.toggle('btn-on', on);
        btn.setAttribute('aria-pressed', String(on));
        btn.style.background = on ? COLORS.ON : COLORS.OFF;
        btn.style.color = on ? '#0a1320' : COLORS.DIGIT_INK;
      } else {
        const on = !!activeButtons[i];
        btn.classList.toggle('btn-on', on);
        btn.setAttribute('aria-pressed', String(on));
        btn.style.background = on ? COLORS.ON : COLORS.OFF;
        btn.style.color = on ? '#0a1320' : COLORS.DIGIT_INK;
      }
    });
  }

  function pressButton(index) {
    if (index === 4) {
      toggleAutoMode();
    } else {
      activeButtons[index] = !activeButtons[index];
      renderButtons();
      const m = maskFromButtons();
      viewIndex = m;
      stateDirty = true;
      saveState(true);
      syncHUD();
      draw();
    }
  }

  btns.forEach((btn, i) => {
    btn.addEventListener('click', (e) => { e.preventDefault(); pressButton(i); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); pressButton(i); }, { passive: false });
  });

  function fitCanvas() {
    const outer = 18;
    const h1 = document.querySelector('h1');
    const bar = document.querySelector('.bar');
    const h1H = h1 ? h1.getBoundingClientRect().height : 0;
    const hudH = hud ? hud.getBoundingClientRect().height : 0;
    const barH = bar ? bar.getBoundingClientRect().height : 0;
    const safetyY = 18;
    const maxW = window.innerWidth - outer * 2;
    const maxH = Math.max(260, window.innerHeight - (h1H + hudH + barH + safetyY + outer * 2));

    grid.pad = Math.round(Math.max(8, Math.min(18, Math.min(maxW, maxH) * 0.025)));

    const sizeFromW = Math.floor((maxW - (grid.pad * (grid.cols + 1))) / grid.cols);
    const verticalGaps = grid.pad * (grid.rows + 1 + SECTION_GAPS);
    const sizeFromH = Math.floor((maxH - verticalGaps) / grid.rows);
    const MAX_TILE = Math.min(96, Math.floor(window.innerWidth / 5));
    grid.size = Math.max(1, Math.min(MAX_TILE, sizeFromW, Math.max(20, sizeFromH)));

    const cssW = grid.cols * (grid.size + grid.pad) + grid.pad;
    const cssH = grid.rows * grid.size + verticalGaps;

    frame.style.width = cssW + 'px';
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    document.documentElement.style.setProperty('--gap', grid.pad + 'px');

    const tileFont = Math.max(14, Math.floor(grid.size * 0.42)) + 'px';
    btns.forEach(btn => {
      btn.style.width = grid.size + 'px';
      btn.style.height = grid.size + 'px';
      btn.style.borderRadius = grid.radius + 'px';
      btn.style.fontSize = tileFont;
    });

    draw();
  }

  function saveState(force = false) {
    if (!stateDirty || (!force && unsavedSteps < SAVE_EVERY_STEPS)) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ boardsState, activeButtons, viewIndex }));
      unsavedSteps = 0;
      stateDirty = false;
    } catch (e) {}
  }

  function loadState() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) {
        const st = JSON.parse(s);
        if (st && Array.isArray(st.boardsState) && st.boardsState.length === 16) {
          boardsState = st.boardsState.map((b) => {
            if (!b || !b.matrix) return defaultBoardState();
            // Ensure matrix dimensions match the new 9×12 grid
            if (!Array.isArray(b.matrix) || b.matrix.length !== ROWS || !Array.isArray(b.matrix[0]) || b.matrix[0].length !== COLS) {
              return defaultBoardState();
            }
            if (typeof b.step !== 'string') b.step = '0';
            if (typeof b.score !== 'string') b.score = '0';
            return b;
          });
          if (Array.isArray(st.activeButtons) && st.activeButtons.length === 4) {
            activeButtons = st.activeButtons.map(Boolean);
          }
          if (typeof st.viewIndex === 'number') viewIndex = Math.max(0, Math.min(15, st.viewIndex));
          return true;
        }
      }
    } catch (e) {
      localStorage.removeItem(STORAGE_KEY);
    }
    return false;
  }

  window.addEventListener('pagehide', () => saveState(true));
  window.addEventListener('beforeunload', () => saveState(true));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopAutoToggle();
      renderButtons();
      saveState(true);
    }
  });

  window.addEventListener('resize', () => fitCanvas());
  window.addEventListener('orientationchange', () => fitCanvas());

  if (!loadState()) {
    boardsState = Array.from({ length: 16 }, defaultBoardState);
  }
  renderButtons();
  syncHUD();
  draw();
  fitCanvas();
})();
</script>
</body>
</html>
