name: Publish message board update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-message-board.yml', 'message/board/**']
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed Pages build run containing the complete site artifact'
        required: true
        default: '42249441614'
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: message-board-pages-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: https://ae6820dc.github.io/9062/
    steps:
      - name: Validate source snapshot and avoid duplicate publisher
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const sourceRun = Number(context.payload.inputs?.source_run || '42249441614');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: sourceRun});
            if (source.name !== 'pages build and deployment' || source.head_branch !== 'main') {
              throw new Error('Source must be the complete main-branch Pages build.');
            }
            const {data: comparison} = await github.rest.repos.compareCommits({
              ...context.repo, base: source.head_sha, head: context.sha
            });
            const allowed = '.github/workflows/publish-message-board.yml';
            if (!comparison.files || comparison.files.length >= 300 || comparison.files.some(file => file.filename !== allowed && !file.filename.startsWith('message/board/'))) {
              throw new Error('Site contents changed since the source artifact. Select a newer Pages build.');
            }
            // Cancel only the automatic publisher for this exact board update commit.
            // It would publish the same snapshot and cancel it after ten minutes.
            for (let attempt=0; attempt<6; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 30
              });
              for (const run of data.workflow_runs) {
                if (run.id !== context.runId && run.name === 'pages build and deployment' &&
                    ['queued','in_progress','waiting','pending','requested'].includes(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
                  core.info('Stopped duplicate automatic publisher for this commit.');
                }
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setOutput('run', String(sourceRun));
      - uses: actions/checkout@v4
      - name: Download previously built complete site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: source-artifact
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Overlay current message boards onto complete site
        run: |
          python - <<'PY'
          import os, subprocess, tarfile
          source = 'source-artifact/artifact.tar'
          target = source + '.updated'
          prefixes = ('message/board/work/', 'message/board/friends/')
          with tarfile.open(source, 'r') as old, tarfile.open(target, 'w') as new:
              for member in old:
                  name = member.name.removeprefix('./')
                  if any(name.startswith(prefix) or name == prefix.rstrip('/') for prefix in prefixes):
                      continue
                  data = old.extractfile(member) if member.isfile() else None
                  new.addfile(member, data)
              paths = subprocess.check_output(['git', 'ls-files', '-z', '--', *prefixes]).decode().split('\0')
              for path in paths:
                  if path:
                      new.add(path, arcname='./' + path, recursive=False)
          os.replace(target, source)
          print('Updated both board directories; all other site assets preserved.')
          PY
      - name: Verify message board assets in archive
        run: |
          python - <<'PY'
          import tarfile
          with tarfile.open('source-artifact/artifact.tar') as archive:
              members = {m.name.removeprefix('./'): m for m in archive.getmembers()}
              for board in ['work', 'friends']:
                  base = 'message/board/' + board + '/'
                  for name in ['index.html', 'app.js', 'notifications.js', 'sw.js', 'menu.js']:
                      if base + name not in members:
                          raise SystemExit('Missing board asset: ' + base + name)
                  page = archive.extractfile(members[base + 'index.html']).read().decode()
                  if 'id="boardMenuOpen"' not in page or 'menu.js?v=20261106menu' not in page:
                      raise SystemExit('Protected menu missing from ' + board)
          print('Both protected board menus verified; complete archive preserved.')
          PY
      - name: Upload complete Pages artifact to this run
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: source-artifact/artifact.tar
          compression-level: 0
          retention-days: 1
      - name: Publish and wait for actual completion
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        with:
          script: |
            const oidc = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.PAGES_ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: oidc
            });
            const deploymentId = deployment.id;
            if (!deploymentId) throw new Error('No Pages deployment ID returned.');
            const deadline = Date.now() + 30*60*1000;
            let previous = '';
            while (Date.now() < deadline) {
              const {data: state} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId
              });
              if (state.status !== previous) {
                core.info('Pages status: ' + state.status);
                previous = state.status;
              }
              if (state.status === 'succeed') {
                core.info('Message board update published successfully.');
                return;
              }
              if (['deployment_failed','deployment_cancelled','errored','failed','cancelled'].includes(state.status)) {
                throw new Error('Pages publication stopped: ' + state.status);
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Pages did not finish within the thirty-minute observation window.');
