name: Publish message board update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-message-board.yml']
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed Pages build run containing the complete site artifact'
        required: true
        default: '42249441614'
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: message-board-pages-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: https://ae6820dc.github.io/9062/
    steps:
      - name: Validate source snapshot and avoid duplicate publisher
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const sourceRun = Number(context.payload.inputs?.source_run || '42249441614');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: sourceRun});
            if (source.name !== 'pages build and deployment' || source.head_branch !== 'main') {
              throw new Error('Source must be the complete main-branch Pages build.');
            }
            const {data: comparison} = await github.rest.repos.compareCommits({
              ...context.repo, base: source.head_sha, head: context.sha
            });
            const allowed = '.github/workflows/publish-message-board.yml';
            if (!comparison.files || comparison.files.length >= 300 || comparison.files.some(file => file.filename !== allowed && file.filename !== '.github/workflows/diagnose-board-pages.yml' && file.filename !== 'index.html' && !file.filename.startsWith('message/board/'))) {
              throw new Error('Site contents changed since the source artifact. Select a newer Pages build.');
            }
            // Cancel only the automatic publisher for this update or its ancestor.
            // It would publish the same snapshot and cancel it after ten minutes.
            for (let attempt=0; attempt<6; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, branch: 'main', per_page: 30
              });
              for (const run of data.workflow_runs) {
                if (run.id !== context.runId && run.name === 'pages build and deployment' &&
                    ['queued','in_progress','waiting','pending','requested'].includes(run.status)) {
                  const {data: relation} = await github.rest.repos.compareCommits({
                    ...context.repo, base: run.head_sha, head: context.sha
                  });
                  if (!['ahead','identical'].includes(relation.status)) continue;
                  await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
                  core.info('Stopped overlapping automatic publisher included in this update.');
                }
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setOutput('run', String(sourceRun));
      - uses: actions/checkout@v4
      - name: Download previously built complete site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: source-artifact
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Prepare the complete site with current boards
        run: |
          mkdir -p deploy-site
          tar -xf source-artifact/artifact.tar -C deploy-site
          rm -rf deploy-site/message/board/work deploy-site/message/board/friends
          git ls-files -z -- index.html message/board/work/ message/board/friends/ | tar --null -T - -cf - | tar -xf - -C deploy-site
          python - <<'PY'
          from pathlib import Path
          for board in ['work','friends']:
              base = Path('deploy-site/message/board') / board
              for name in ['index.html','app.js','menu.js','notifications.js','sw.js']:
                  if not (base / name).is_file():
                      raise SystemExit('Missing board asset: ' + str(base / name))
              page = (base / 'index.html').read_text()
              if 'id="boardMenuOpen"' not in page or 'menu.js?v=20261106menu' not in page:
                  raise SystemExit('Protected menu missing from ' + board)
          print('Both protected board menus verified in the complete site.')
          PY
      - name: Upload complete Pages artifact to this run
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: deploy-site
          retention-days: 90
      - name: Publish and wait for actual completion
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const oidc = await core.getIDToken();
            let deployment;
            const createDeadline = Date.now() + 5*60*1000;
            while (!deployment) {
              try {
                const response = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.PAGES_ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: oidc
                });
                deployment = response.data;
              } catch (error) {
                if (error.status !== 400 || !String(error.message).includes('in progress deployment') || Date.now() >= createDeadline) throw error;
                const match = String(error.message).match(/cancel ([a-f0-9]{40}) first/);
                if (match) {
                  const {data: relation} = await github.rest.repos.compareCommits({...context.repo,base:match[1],head:context.sha});
                  if (['ahead','identical'].includes(relation.status)) {
                    await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {...context.repo,deploymentId:match[1]});
                  }
                }
                core.info('Waiting for overlapping Pages deployment to stop.');
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
            }
            const deploymentId = deployment.id;
            if (!deploymentId) throw new Error('No Pages deployment ID returned.');
            const deadline = Date.now() + 30*60*1000;
            let previous = '', emptyStates = 0;
            while (Date.now() < deadline) {
              const {data: state} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId
              });
              core.info('Deployment ID: ' + deploymentId + ' status: ' + state.status);
              emptyStates = state.status ? 0 : emptyStates + 1;
              if (emptyStates >= 4) throw new Error('Pages deployment disappeared: ' + JSON.stringify(state));
              if (state.status !== previous) {
                core.info('Pages status: ' + state.status);
                previous = state.status;
              }
              if (state.status === 'succeed') {
                core.info('Message board update published successfully.');
                return;
              }
              if (['deployment_failed','deployment_cancelled','errored','failed','cancelled'].includes(state.status)) {
                throw new Error('Pages publication stopped: ' + JSON.stringify(state));
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Pages did not finish within the thirty-minute observation window.');
