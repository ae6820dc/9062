name: Generate repository index

on:
  push:
    branches: [main]
    paths-ignore: [index.html]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json

          root = Path('.')
          ignored = {'.git', '.github', 'index.html'}
          files = []
          for p in root.rglob('*'):
              if p.is_file() and not any(x in ignored for x in p.parts):
                  files.append('/'.join(p.parts))

          tree = {}
          for path in sorted(files):
              node = tree
              parts = path.split('/')
              for i, part in enumerate(parts):
                  if i == len(parts) - 1:
                      node[part] = None
                  else:
                      node = node.setdefault(part, {})

          data = json.dumps(tree, ensure_ascii=False, separators=(',', ':'))

          html = '''<!DOCTYPE html>
          <html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9062 Repository</title>
          <style>
          :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:30px;font-family:Arial,sans-serif;background:#0d1117;color:#c9d1d9}main{max-width:1000px;margin:auto}h1{color:#fff}#path{color:#8b949e;margin:10px 0 20px}.toolbar{display:flex;gap:8px;margin-bottom:20px}button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 14px;border-radius:6px;cursor:pointer}button:hover{background:#30363d}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #21262d;padding:12px 8px}a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}.folder{color:#79c0ff;cursor:pointer}
          </style></head><body><main><h1>📦 9062 Repository</h1><div id="path">/</div><div class="toolbar"><button onclick="home()">🏠 Főkönyvtár</button><button onclick="back()">⬅️ Vissza</button></div><ul id="repo"></ul></main>
          <script>
          const tree=__TREE__;let current=[];
          function enc(p){return p.split('/').map(encodeURIComponent).join('/')}
          function node(){let n=tree;for(const x of current)n=n[x];return n}
          function render(){const n=node(),list=document.getElementById('repo');list.innerHTML='';document.getElementById('path').textContent='/'+current.join('/');const names=Object.keys(n).sort((a,b)=>{const af=n[a]!==null,bf=n[b]!==null;return af!==bf?(af?-1:1):a.localeCompare(b,'hu')});for(const name of names){const li=document.createElement('li'),folder=n[name]!==null;const label=(folder?'📁 ':'📄 ')+name;if(folder){const s=document.createElement('span');s.className='folder';s.textContent=label;s.onclick=()=>{current.push(name);render()};li.appendChild(s)}else{const a=document.createElement('a');a.href=enc([...current,name].join('/'));a.textContent=label;li.appendChild(a)}list.appendChild(li)}}
          function home(){current=[];render()}function back(){if(current.length){current.pop();render()}}render();
          </script></body></html>'''.replace('__TREE__',data)
          Path('index.html').write_text(html,encoding='utf-8')
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "Automatically update repository index"
            git push
          fi
