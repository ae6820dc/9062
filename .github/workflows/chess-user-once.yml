name: Chess Explorer user prefix
on:
  push:
    paths:
      - '.github/workflows/chess-user-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Chess Explorer sample1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('explorer/13/sample1.html')
          s=p.read_text(encoding='utf-8')
          def swap(a,b):
              global s
              if a not in s: raise RuntimeError('Missing: '+a[:90])
              s=s.replace(a,b)
          swap("const MAX_DEPTH=65537, STORAGE_KEY=","const MAX_DEPTH=65555, STORAGE_KEY=")
          swap("const sides=['White','Black'];","const digits='0123456789'.split('');")
          swap("const blackSquares=[...whiteSquares].reverse();","")
          swap("function folderSymbols(p=path){return p.length===0?sides:p[0]==='White'?whiteSquares:blackSquares;}","function folderSymbols(p=path){return p.length===0?['User']:p.length<=18?digits:whiteSquares;}")
          swap("function validPath(p){return Array.isArray(p)&&p.length<=MAX_DEPTH&&p.every((x,i)=>typeof x==='string'&&(i===0?sides.includes(x):/^[a-h][1-8]$/.test(x)));}","function validPath(p){return Array.isArray(p)&&p.length<=MAX_DEPTH&&p.every((x,i)=>typeof x==='string'&&(i===0?x==='User':i<=18?/^[0-9]$/.test(x):/^[a-h][1-8]$/.test(x)));}")
          swap("const depth=path.length-1,atEnd=path.length===MAX_DEPTH","const depth=path.length-1,atEnd=path.length===MAX_DEPTH")
          swap("$('depth').textContent=depth;","$('depth').textContent=Math.min(path.length,19);$('chessDepth').textContent=Math.max(0,path.length-19);")
          swap("Math.max(0,depth)/(MAX_DEPTH-1)*100","Math.max(0,path.length-19)/65536*100")
          swap("document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',depth)","document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',Math.max(0,path.length-19))")
          swap('<strong id="depth">-1</strong> / 65536','<strong id="depth">0</strong> / <strong id="chessDepth">0</strong> / 65536')
          swap('aria-valuemin="-1" aria-valuemax="65536" aria-valuenow="-1"','aria-valuemin="0" aria-valuemax="65536" aria-valuenow="0"')
          swap('Choose White or Black, then explore the squares.','Choose User, then 18 digits, then explore the chess squares.')
          swap('White · Black<br>64 squares on each following level<br>65536 levels to explore','User → 18 digits (0–9)<br>64 chess squares per move<br>65536 chess levels')
          swap("if(next.length)next[0]=next[0]==='white'?'White':next[0]==='black'?'Black':next[0];","if(next.length&&next[0].toLowerCase()==='user')next[0]='User';")
          swap("Start with /White or /Black, followed by squares a1–h8, up to 65536 levels.","Start with /User, then 18 digits (0–9), followed by chess squares a1–h8.")
          swap("if(path.length===0&&/^[wb]$/i.test(e.key)){e.preventDefault();squareKey='';enter(e.key.toLowerCase()==='w'?'White':'Black');}","if(path.length===0&&e.key.toLowerCase()==='u'){e.preventDefault();squareKey='';enter('User');}\nelse if(path.length>=1&&path.length<=18&&/^[0-9]$/.test(e.key)){e.preventDefault();enter(e.key);}")
          swap("else if(path.length>0&&/^[a-h]$/i.test(e.key))","else if(path.length>=19&&/^[a-h]$/i.test(e.key))")
          swap("else if(path.length>0&&/^[1-8]$/.test(e.key)&&squareKey)","else if(path.length>=19&&/^[1-8]$/.test(e.key)&&squareKey)")
          swap("Choose an earlier level on your current path (-1 is the root folder, 0 is White or Black).","Choose an earlier level on your current path (-1 is the root, 0 is User, 1–18 are user digits).")
          swap("Choose White or Black at the root. Each following level has 64 squares. White order: a8 to h8, down to a1 to h1. Black order: h1 to a1, up to h8 to a8.","Choose User at the root, then 18 digits from 0–9 to select the user. Each following level has 64 chess squares, a8 through h1.")
          p.write_text(s,encoding='utf-8')
          print('Updated Chess Explorer sample1')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/chess-user-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer/13/sample1.html .github/workflows/chess-user-once.yml
          git commit -m "Add User and 18-digit prefix to Chess Explorer sample1"
          git push
