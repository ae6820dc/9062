name: Three-stage Explorer depth counters
on:
  push:
    paths:
      - '.github/workflows/explorer-three-counters-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update counters in all Explorer samples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=sorted(Path('explorer').glob('*/sample*.html'))
          assert len(files)>150,len(files)
          for p in files:
            s=p.read_text(encoding='utf-8')
            m=re.search(r'<strong id="depth">0</strong> / <strong id="(gameDepth|chessDepth)">0</strong> / (\d+)<br><span>depth</span>',s)
            assert m,p
            maxdepth=int(m.group(2))
            s=s[:m.start()]+f'<strong id="depth">0</strong> / <strong id="idDepth">0</strong> / <strong id="{m.group(1)}">0</strong> / {maxdepth}<br><span>depth</span>'+s[m.end():]
            old1="$('depth').textContent=Math.min(depth,19);$('gameDepth').textContent=Math.max(0,depth-19);"
            old2="$('depth').textContent=Math.min(path.length,19);$('chessDepth').textContent=Math.max(0,path.length-19);"
            new1="$('depth').textContent=Math.min(depth,1);$('idDepth').textContent=Math.min(18,Math.max(0,depth-1));$('gameDepth').textContent=Math.max(0,depth-19);"
            new2="$('depth').textContent=Math.min(path.length,1);$('idDepth').textContent=Math.min(18,Math.max(0,path.length-1));$('chessDepth').textContent=Math.max(0,path.length-19);"
            if old1 in s:s=s.replace(old1,new1,1)
            elif old2 in s:s=s.replace(old2,new2,1)
            else:raise RuntimeError('Missing counter updater: '+str(p))
            assert 'id="idDepth"' in s and "$('idDepth').textContent" in s,p
            p.write_text(s,encoding='utf-8')
          print('Updated',len(files),'samples')
          PY
      - name: Commit and clean up
        run: |
          rm .github/workflows/explorer-three-counters-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer .github/workflows/explorer-three-counters-once.yml
          git commit -m "Split Explorer depth into Game, 18-digit ID and original depth"
          git push
