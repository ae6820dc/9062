name: Explorer fluid grid migration
on:
  push:
    paths:
      - '.github/workflows/explorer-fluid-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make all Explorer grids responsive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          old_js = "if(!listMode){const n=folderCount||1;let rows=Math.floor(Math.sqrt(n));while(rows>1&&n%rows!==0)rows--;folders.style.gridTemplateColumns=`repeat(${n/rows},minmax(0,1fr))`;}else folders.style.gridTemplateColumns='';"
          old_chess = "folders.style.gridTemplateColumns=listMode?'':`repeat(${path.length===0?2:8}, minmax(0, 1fr))`;"
          fluid = ".folders:not(.list){grid-template-columns:repeat(auto-fill,minmax(min(100%,105px),1fr))!important;gap:8px}@media(max-width:800px){.folders:not(.list){grid-template-columns:repeat(auto-fill,minmax(min(100%,88px),1fr))!important;gap:5px}}"
          count=0
          for p in Path('explorer').glob('*/sample*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace(old_js,'').replace(old_chess,'')
              if fluid not in s:
                  s=s.replace('</style>',fluid+'</style>',1)
              p.write_text(s,encoding='utf-8')
              count+=1
          print('Responsive Explorer samples:',count)
          PY
      - name: Commit and clean up
        run: |
          rm .github/workflows/explorer-fluid-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer .github/workflows/explorer-fluid-once.yml
          git commit -m "Use fluid responsive grid in all Explorer versions"
          git push
