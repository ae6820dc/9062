name: Import French dictionary
on:
  push:
    paths:
      - '.github/workflows/news4-dictionary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract licensed French dictionary
        run: |
          python3 - <<'PY'
          import urllib.request, re, pathlib
          url='https://raw.githubusercontent.com/wooorm/dictionaries/main/dictionaries/fr/index.dic'
          with urllib.request.urlopen(url,timeout=120) as response:
              raw=response.read()
          try:
              content=raw.decode('utf-8-sig')
          except UnicodeDecodeError:
              content=raw.decode('iso-8859-1')
          words=set()
          for line in content.splitlines()[1:]:
              entry=line.split('/')[0].split()[0] if line.strip() else ''
              if re.fullmatch(r'[A-Za-zÀÂÄÆÇÉÈÊËÎÏÔŒÙÛÜŸàâäæçéèêëîïôœùûüÿ]{2,}',entry):
                  words.add(entry)
          if len(words)<10000:
              raise RuntimeError(f'Only {len(words)} valid French dictionary entries')
          output=pathlib.Path('news/4/french-dictionary.txt')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text('\n'.join(sorted(words,key=str.casefold))+'\n',encoding='utf-8')
          print('Saved',len(words),'distinct French dictionary entries')
          with urllib.request.urlopen('https://www.mozilla.org/media/MPL/2.0/index.f75d2927d3c1.txt',timeout=60) as response:
              pathlib.Path('news/4/MPL-2.0-DICTIONARY.txt').write_bytes(response.read())
          PY
      - name: Commit dictionary and license
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/4/french-dictionary.txt news/4/MPL-2.0-DICTIONARY.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add licensed French dictionary to news/4"
            git push
          fi
