name: Factorial 45 96 APK
on:
  push:
    branches: [main]
    paths:
      - 'factorial/45/96.html'
      - '.github/workflows/factorial-45-96.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare standalone Factorial 45 application
        run: |
          cp -a android-factorial-96-v37 android-factorial-96-v45
          cp factorial/45/96.html android-factorial-96-v45/app/src/main/assets/index.html
          find android-factorial-96-v45 -type f \( -name '*.xml' -o -name '*.java' -o -name '*.gradle' -o -name '*.sh' \) -print0 | xargs -0 sed -i 's/factorial96v37/factorial96v45/g; s/37\.3\.96/45.96/g; s/96! v37/96! v45/g'
          mv android-factorial-96-v45/app/src/main/java/io/github/ae6820dc/factorial96v37 android-factorial-96-v45/app/src/main/java/io/github/ae6820dc/factorial96v45
          mv android-factorial-96-v45/app/src/androidTest/java/io/github/ae6820dc/factorial96v37 android-factorial-96-v45/app/src/androidTest/java/io/github/ae6820dc/factorial96v45
          sed -i 's/--version-code 2/--version-code 1/' android-factorial-96-v45/build-sdk.sh
      - name: Build signed offline APK
        run: |
          bash android-factorial-96-v45/build-sdk.sh
          cmp factorial/45/96.html android-factorial-96-v45/app/src/main/assets/index.html
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-factorial-96-v45/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        run: |
          mkdir -p android-distributions
          cp android-factorial-96-v45/app/build/outputs/apk/debug/app-debug.apk android-distributions/Factorial-45-96.apk
          sha256sum android-distributions/Factorial-45-96.apk > android-distributions/Factorial-45-96.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-distributions/Factorial-45-96.apk*
          git commit -m 'Build offline Factorial 45 96 Android APK' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Factorial-45-96
          path: android-distributions/Factorial-45-96.apk*
