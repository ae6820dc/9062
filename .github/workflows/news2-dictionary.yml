name: Import English dictionary (100k)
on:
  push:
    paths:
      - '.github/workflows/news2-dictionary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify SCOWL/Aspell wordlist
        run: |
          python3 - <<'PY'
          import urllib.request, re, pathlib
          url = 'https://raw.githubusercontent.com/nlile/dictionary-word-list/master/word_list_very_common_en_us_spelling_no_diacritic.txt'
          req = urllib.request.Request(url, headers={'User-Agent':'9062-English-Dictionary-Importer'})
          with urllib.request.urlopen(req, timeout=90) as response:
              raw = response.read().decode('utf-8')
          valid = sorted({w.strip().lower() for w in raw.splitlines() if re.fullmatch(r'[A-Za-z]{2,}',w.strip())})
          if len(valid) < 100000:
              raise RuntimeError(f'Only {len(valid)} valid unique words; refusing incomplete import')
          # Spread selection across alphabetic dictionary instead of taking only A-prefix words.
          selected = [valid[(i*(len(valid)-1))//99999] for i in range(100000)]
          if len(set(selected)) != 100000:
              raise RuntimeError('Unexpected duplicate in selected words')
          out=pathlib.Path('news/2/english-dictionary-100k.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(selected)+'\n', encoding='utf-8')
          print(f'Saved {len(selected)} unique English dictionary entries from {len(valid)} valid source words')
          PY
      - name: Commit dictionary to own repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/2/english-dictionary-100k.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add verified 100,000-word English dictionary to news/2"
            git push
          fi
