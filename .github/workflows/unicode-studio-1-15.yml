name: Unicode Studio 1–15
on:
  push:
    branches: [main, unicode-studio-1-15]
    paths: ['android-unicode-studio/**', 'unicode/**', '.github/workflows/unicode-studio-1-15.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and check all original assets
        working-directory: android-unicode-studio
        run: |
          ./gradlew --no-daemon assembleRelease lintRelease assembleDebug assembleDebugAndroidTest
          python3 verify-apk.py app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify all 72 samples on Android 16 offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: android-unicode-studio/android-tests.sh
      - name: Preserve a uniquely named APK
        id: apk
        run: |
          output="android-distributions/unicode-studio-1-15-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"
          (set -o noclobber; cat android-unicode-studio/app/build/outputs/apk/release/app-release.apk > "$output")
          python3 android-unicode-studio/verify-apk.py "$output" | tee "$output.verification.txt"
          sha256sum "$output" > "$output.sha256"
          echo "path=$output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: unicode-studio-1-15-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.apk.outputs.path }}*
            android-unicode-studio/runtime-*.txt
      - name: Commit verified APK without replacing previous releases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${{ steps.apk.outputs.path }}"*
          git commit -m 'Add verified Unicode Studio 1–15 APK'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicode-studio-verification-logs
          path: |
            android-unicode-studio/runtime-*.txt
            android-unicode-studio/app/build/reports/
