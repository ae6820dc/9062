name: Unicode Android APKs
on:
  push:
    paths:
      - 'android-build/**'
      - 'unicode/7/sample1.html'
      - 'unicode/9/sample1.html'
      - '.github/workflows/unicode-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: android-build/build-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unicode-test-apks
          path: |
            unicode/7/sample1.apk
            unicode/9/sample1.apk
      - name: Commit actual APKs to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unicode/7/sample1.apk unicode/9/sample1.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Unicode 7.1 and 9.1 test APKs'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
