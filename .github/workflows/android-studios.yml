name: Android Studios
on:
  push:
    paths:
      - 'android-studios/**'
      - 'calculator/**'
      - 'unicode/**'
      - '.github/workflows/android-studios.yml'
  workflow_dispatch:
    inputs:
      android_tests:
        description: 'Run native offline tests on an Android 16 emulator'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: android-studios/build-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-studios
          path: |
            android-distributions/*.apk
            android-distributions/checksums.json
      - name: Commit built APKs to their separate distribution directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-distributions/*.apk android-distributions/checksums.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build android-studios debug APKs'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
  android-runtime:
    if: github.event_name == 'push' || inputs.android_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build native test packages
        working-directory: android-studios
        run: ./gradlew assembleMathematicsDebug assembleMathematicsDebugAndroidTest assembleUnicodeDebug assembleUnicodeDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: android-studios/android-tests.sh
