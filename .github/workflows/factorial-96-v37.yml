name: Factorial 96 v37 APK
on:
  push:
    branches: [main]
    paths: ['android-factorial-96-v37/**', '.github/workflows/factorial-96-v37.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and inspect APK
        working-directory: android-factorial-96-v37
        run: |
          ./gradlew --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
          cmp app/src/main/assets/index.html ../factorial/v37/3/96.html
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 offline runtime verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: |
            adb install android-factorial-96-v37/app/build/outputs/apk/debug/app-debug.apk
            adb install android-factorial-96-v37/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w io.github.ae6820dc.factorial96v37.test/io.github.ae6820dc.factorial96v37.SmokeInstrumentation | tee runtime-factorial96.txt
            grep -q 'PASS: offline launch' runtime-factorial96.txt
      - name: Preserve verified APK
        run: |
          cp android-factorial-96-v37/app/build/outputs/apk/debug/app-debug.apk android-distributions/Factorial-96-v37.apk
          cp runtime-factorial96.txt android-distributions/Factorial-96-v37.verification.txt
          sha256sum android-distributions/Factorial-96-v37.apk > android-distributions/Factorial-96-v37.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-distributions/Factorial-96-v37*
          git commit -m 'Add verified offline Factorial 96 v37 APK'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Factorial-96-v37
          path: |
            android-distributions/Factorial-96-v37*
            runtime-factorial96.txt
            android-factorial-96-v37/app/build/reports/
