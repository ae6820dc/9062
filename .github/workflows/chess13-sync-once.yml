name: Sync Chess Explorer 13 samples
on:
  push:
    paths:
      - '.github/workflows/chess13-sync-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy sample1 behavior and UI preserving identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('explorer/13')
          base=(root/'sample1.html').read_text(encoding='utf-8')
          patterns=[
            r'Program ID: <code>([0-9a-f]{16})</code>',
            r"STORAGE_KEY='([0-9a-f]{16})'",
            r"DATABASE_NAME='([0-9a-f]{16})'"
          ]
          files=sorted(root.glob('sample*.html'))
          assert len(files)==24,len(files)
          seen=[set() for _ in patterns]
          for file in files:
            old=file.read_text(encoding='utf-8')
            new=base
            for i,pat in enumerate(patterns):
              m=re.search(pat,old)
              assert m and len(re.findall(pat,base))==1,(file,pat)
              assert m.group(1) not in seen[i],(file,pat,'duplicate')
              seen[i].add(m.group(1))
              new=re.sub(pat,lambda _: _.group(0).replace(_.group(1),m.group(1)),new,count=1)
            if file.name!='sample1.html': file.write_text(new,encoding='utf-8')
          print('Updated',len(files)-1,'samples')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/chess13-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer/13 .github/workflows/chess13-sync-once.yml
          git commit -m "Synchronize all Chess Explorer samples with Game prefix and counters"
          git push
