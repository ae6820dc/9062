name: Explorer rectangular grid migration
on:
  push:
    paths:
      - '.github/workflows/explorer-grid-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply rectangular grid to Explorer samples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = ".folders:not(.list) .folder{min-width:0;padding-left:2px;padding-right:2px}.folders:not(.list) .folder svg{max-width:100%}.folders:not(.list) .folder-name{font-size:clamp(10px,1.6vw,15px);text-align:center}@media(max-width:500px){.folders:not(.list){gap:2px}.folders:not(.list) .folder{min-height:75px;gap:4px}.folders:not(.list) .folder svg{width:min(100%,42px);height:34px}.folders:not(.list) .folder-name{font-size:11px}}"
          marker="folders.classList.toggle('list',listMode);"
          replacement="if(!listMode){const n=folderCount||1;let rows=Math.floor(Math.sqrt(n));while(rows>1&&n%rows!==0)rows--;folders.style.gridTemplateColumns=`repeat(${n/rows},minmax(0,1fr))`;}else folders.style.gridTemplateColumns='';\n"+marker
          changed=0
          for file in Path('explorer').glob('*/sample*.html'):
              text=file.read_text(encoding='utf-8')
              if 'folders.style.gridTemplateColumns' in text: continue
              if marker not in text: raise RuntimeError(f'Missing marker: {file}')
              text=text.replace(marker,replacement,1).replace('</style>',css+'</style>',1)
              file.write_text(text,encoding='utf-8')
              changed+=1
          print('Updated samples:',changed)
          PY
      - name: Commit updates and remove one-time workflow
        run: |
          rm .github/workflows/explorer-grid-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer .github/workflows/explorer-grid-once.yml
          git commit -m "Apply rectangular grid to every Explorer sample"
          git push
