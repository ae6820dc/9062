name: Sync Explorer 11 samples to sample1
on:
  push:
    paths:
      - '.github/workflows/explorer11-sync-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize samples preserving unique identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('explorer/11')
          base=(root/'sample1.html').read_text(encoding='utf-8')
          id_re=r'Program ID: <code>([0-9a-f]{16})</code>'
          key_re=r"STORAGE_KEY='([0-9a-f]{16})'"
          assert len(re.findall(id_re,base))==1 and len(re.findall(key_re,base))==1
          files=sorted(root.glob('sample*.html'))
          ids=set()
          keys=set()
          for file in files:
              original=file.read_text(encoding='utf-8')
              old_id=re.search(id_re,original)
              old_key=re.search(key_re,original)
              if not old_id or not old_key: raise RuntimeError(f'Missing IDs: {file}')
              if old_id.group(1) in ids or old_key.group(1) in keys: raise RuntimeError(f'Duplicate ID or key: {file}')
              ids.add(old_id.group(1));keys.add(old_key.group(1))
              if file.name=='sample1.html': continue
              new=re.sub(id_re,'Program ID: <code>'+old_id.group(1)+'</code>',base,count=1)
              new=re.sub(key_re,"STORAGE_KEY='"+old_key.group(1)+"'",new,count=1)
              file.write_text(new,encoding='utf-8')
          print('Synchronized:',len(files)-1,'samples')
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/explorer11-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer/11 .github/workflows/explorer11-sync-once.yml
          git commit -m "Align all Explorer 11 samples with sample1 while retaining IDs"
          git push
