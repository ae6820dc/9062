name: Explorer Studio APK
on:
  push:
    paths:
      - 'android-explorer-studio/**'
      - 'explorer/**'
      - '.github/workflows/explorer-studio.yml'
  workflow_dispatch:
concurrency:
  group: explorer-studio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Explorer APK and Android tests
        working-directory: android-explorer-studio
        run: ./gradlew --no-daemon assembleExplorerDebug assembleExplorerDebugAndroidTest lintExplorerDebug
      - name: Verify signed package and original assets
        run: python3 android-explorer-studio/verify-apk.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: android-explorer-studio/explorer-android-tests.sh
      - name: Package tested APK
        run: |
          cp android-explorer-studio/app/build/outputs/apk/explorer/debug/app-explorer-debug.apk android-distributions/Explorer-Studio.apk
          sha256sum android-distributions/Explorer-Studio.apk > android-distributions/Explorer-Studio.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Explorer-Studio
          if-no-files-found: ignore
          path: |
            android-distributions/Explorer-Studio.apk
            android-distributions/Explorer-Studio.json
            explorer-*.log
            explorer-home.png
            android-explorer-studio/app/build/reports/lint-results-explorerDebug.html
      - name: Publish tested Explorer APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-distributions/Explorer-Studio.apk android-distributions/Explorer-Studio.apk.sha256 android-distributions/Explorer-Studio.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested Explorer Studio APK with 48 programs'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
