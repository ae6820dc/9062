name: Explorer folder-specific favicons
on:
  push:
    paths:
      - '.github/workflows/explorer-icons-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and embed self-contained SVG favicons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re
          designs={
            1:('#2558db','Aa'),2:('#2558db','Aa'),3:('#2558db','Aa'),4:('#2558db','Aa'),
            5:('#047c87','09'),6:('#c24167','Á'),7:('#3448a5','36'),
            8:('#b53743','Я'),9:('#ba6a1c','Ä'),10:('#17845c','ع'),
            11:('#6448b8','U+'),12:('#a23c91','∑'),13:('#343a47','♞'),14:('#a66a17','·−')
          }
          files=sorted(Path('explorer').glob('*/sample*.html'))
          assert len(files)>150,len(files)
          for p in files:
            n=int(p.parent.name)
            bg,mark=designs[n]
            fontsize=30 if len(mark)<=2 else 24
            svg=f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="13" fill="{bg}"/><rect x="5" y="5" width="54" height="54" rx="10" fill="none" stroke="white" stroke-opacity=".24" stroke-width="2"/><text x="32" y="42" font-family="Arial,Segoe UI Symbol,sans-serif" font-size="{fontsize}" font-weight="bold" fill="white" text-anchor="middle">{mark}</text></svg>'
            tag='<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,'+quote(svg,safe='')+'">'
            s=p.read_text(encoding='utf-8')
            s,num=re.subn(r'<link\s+rel=["\x27]icon["\x27][^>]*>',lambda _:tag,s,count=1)
            if not num:
              s=s.replace('</title>','</title>\n'+tag,1)
            p.write_text(s,encoding='utf-8')
          print('Added folder-specific icons to',len(files),'HTML samples')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/explorer-icons-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorer .github/workflows/explorer-icons-once.yml
          git commit -m "Give every Explorer sample a folder-specific embedded icon"
          git push
