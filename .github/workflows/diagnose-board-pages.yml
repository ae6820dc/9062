name: Diagnose Pages publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-board-pages.yml']
permissions:
  contents: read
  actions: write
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<3; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:context.sha,per_page:10});
              for (const run of data.workflow_runs) {
                if (run.name === 'pages build and deployment' && ['queued','in_progress','waiting','pending'].includes(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
                }
              }
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            for (const deploymentId of ['86572c4906d3b809bbc4a602594a75b3feadb81a','b940e1ee8a66e69db2d8406aabadce4031520eb3']) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',{...context.repo,deploymentId});
              core.info('DIAGNOSTIC ' + deploymentId + ' ' + JSON.stringify(data));
            }
