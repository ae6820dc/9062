name: Diagnose Pages publication
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Pages deployment ID to inspect'
        required: true
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
              ...context.repo, deploymentId: process.env.DEPLOYMENT_ID
            });
            core.info(JSON.stringify(data));
