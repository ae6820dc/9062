name: Import Spanish dictionary
on:
  push:
    paths:
      - '.github/workflows/news5-dictionary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract licensed Spanish dictionary
        run: |
          python3 - <<'PY'
          import urllib.request, re, pathlib
          url='https://raw.githubusercontent.com/wooorm/dictionaries/main/dictionaries/es/index.dic'
          with urllib.request.urlopen(url,timeout=120) as response:
              raw=response.read()
          try:
              content=raw.decode('utf-8-sig')
          except UnicodeDecodeError:
              content=raw.decode('iso-8859-1')
          words=set()
          for line in content.splitlines()[1:]:
              entry=line.split('/')[0].split()[0] if line.strip() else ''
              if re.fullmatch(r'[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,}',entry):
                  words.add(entry)
          if len(words)<10000:
              raise RuntimeError(f'Only {len(words)} valid Spanish dictionary entries')
          output=pathlib.Path('news/5/spanish-dictionary.txt')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text('\n'.join(sorted(words,key=str.casefold))+'\n',encoding='utf-8')
          print('Saved',len(words),'distinct Spanish dictionary entries')
          with urllib.request.urlopen('https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt',timeout=60) as response:
              pathlib.Path('news/5/MPL-2.0-DICTIONARY.txt').write_bytes(response.read())
          PY
      - name: Commit Spanish dictionary and license
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/5/spanish-dictionary.txt news/5/MPL-2.0-DICTIONARY.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add licensed Spanish dictionary to news/5"
            git push
          fi
