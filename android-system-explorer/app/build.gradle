plugins { id 'com.android.application' }
android {
    namespace 'io.github.ae6820dc.studio'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { testInstrumentationRunner 'io.github.ae6820dc.studio.ExplorerInstrumentation'; minSdk 26; targetSdk 36; versionCode 2; versionName '1.1' }
    signingConfigs { stableDebug { storeFile file('../signing/studio-debug.jks'); storePassword 'android'; keyAlias 'unicode-test'; keyPassword 'android' } }
    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
        release { signingConfig signingConfigs.stableDebug; debuggable false }
    }
    flavorDimensions += 'studio'
    productFlavors {
        explorer { dimension 'studio'; applicationId 'io.github.ae6820dc.systemexplorer'; resValue 'string', 'app_name', 'System Explorer'; testInstrumentationRunner 'io.github.ae6820dc.studio.ExplorerInstrumentation' }
    }
    sourceSets.explorer.res.srcDirs = [layout.buildDirectory.dir('generated/resources/explorer')]
    sourceSets.explorer.assets.srcDirs = [layout.buildDirectory.dir('generated/offline/explorer')]
    sourceSets.main.res.srcDirs = [layout.buildDirectory.dir('generated/resources/main')]
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
def prepare = tasks.register('prepareOfflineAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'prepare-assets.py'
}
tasks.named('preBuild').configure { dependsOn prepare }
