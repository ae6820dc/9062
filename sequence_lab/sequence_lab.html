<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}input{width:100%;padding:12px;box-sizing:border-box;background:#222;color:#fff;border:1px solid #555;border-radius:8px}button{padding:10px;margin-top:8px}pre{background:#181818;padding:15px;border-radius:10px}</style></head><body><main><h1>🔢 Sequence Lab</h1><input id="s" value="1, 4, 9, 16, 25"><button onclick="go()">Elemzés</button><pre id="o"></pre></main><script>function go(){let a=s.value.split(',').map(Number),d=a.slice(1).map((v,i)=>v-a[i]),dd=d.slice(1).map((v,i)=>v-d[i]),msg='';if(d.every(v=>v===d[0]))msg='Állandó különbség: '+d[0]+'\nKövetkező: '+(a.at(-1)+d[0]);else if(dd.length&&dd.every(v=>v===dd[0])){msg='Állandó második különbség: '+dd[0]+'\n';let nd=d.at(-1)+dd[0];msg+='Következő: '+(a.at(-1)+nd)}else msg='Egyszerű számtani/négyzetes szabály nem azonosítható biztosan.';o.textContent='Adatok: '+a.join(', ')+'\n\n'+msg}go()</script></body></html>
