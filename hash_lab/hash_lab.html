<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}textarea{width:100%;height:140px;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:10px}pre{white-space:pre-wrap;background:#181818;padding:15px;border-radius:10px}</style></head><body><main><h1>🔐 Hash Lab</h1><textarea id="t" placeholder="Írj be szöveget..."></textarea><button onclick="go()">SHA-256 / SHA-384 / SHA-512</button><pre id="o"></pre></main><script>async function h(a){let b=await crypto.subtle.digest(a,new TextEncoder().encode(t.value));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function go(){o.textContent='Számítás...';o.textContent='SHA-256  '+await h('SHA-256')+'\n\nSHA-384  '+await h('SHA-384')+'\n\nSHA-512  '+await h('SHA-512')}</script></body></html>
