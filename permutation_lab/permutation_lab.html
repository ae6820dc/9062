<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permutation Lab</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}main{max-width:800px;margin:auto}input,button{padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:15px}.grid div{background:#181818;padding:8px;border-radius:6px}</style></head><body><main><h1>🧩 Permutation Lab</h1><input id="s" value="ABC"><button onclick="go()">Generálás</button><p id="n"></p><div class="grid" id="o"></div></main><script>function fact(x){return x<2?1:x*fact(x-1)}function go(){let a=[...s.value],r=[];function p(x,l){if(r.length>10000)return;if(!l.length)r.push(x.join(''));else l.forEach((v,i)=>p([...x,v],[...l.slice(0,i),...l.slice(i+1)]))}p([],a);n.textContent='Összesen: '+fact(a.length)+' (ismétlődő elemeknél a listában duplikátumok lehetnek)';o.innerHTML=r.map(x=>'<div>'+x+'</div>').join('')}go()</script></body></html>
