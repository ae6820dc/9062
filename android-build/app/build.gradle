plugins { id 'com.android.application' }
android {
    namespace 'io.github.ae6820dc.unicode'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { minSdk 26; targetSdk 36; versionCode 1; versionName '1.0' }
    signingConfigs {
        test { storeFile file('../signing/unicode-test.jks'); storePassword 'android'; keyAlias 'unicode-test'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.test } }
    flavorDimensions += 'edition'
    productFlavors {
        unicode7 { dimension 'edition'; applicationId 'io.github.ae6820dc.unicode71'; resValue 'string', 'app_name', 'Unicode 7.1' }
        unicode9 { dimension 'edition'; applicationId 'io.github.ae6820dc.unicode91'; resValue 'string', 'app_name', 'Unicode 9.1' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        unicode7.assets.srcDirs = [layout.buildDirectory.dir('offline/unicode7')]
        unicode9.assets.srcDirs = [layout.buildDirectory.dir('offline/unicode9')]
    }
}
['7', '9'].each { edition ->
    def copyTask = tasks.register("packageHtml${edition}", Sync) {
        from "../../unicode/${edition}/sample1.html"
        into layout.buildDirectory.dir("offline/unicode${edition}")
    }
    tasks.configureEach { task ->
        if (task.name.contains("Unicode${edition}")) task.dependsOn(copyTask)
    }
}
