'use strict';const $=id=>document.getElementById(id);
const latin='abcdefghijklmnopqrstuvwxyz';
const sets={en:latin,de:latin+'äöüß',fr:latin+'àâæçéèêëîïôœùûüÿ',es:latin+'áéíñóúü',it:latin+'àèéìíîòóùú',ru:'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',la:'abcdefghijklmnopqrstuvxyz',ar:'ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأإؤئىة',hu:latin+'áéíóöőúüű',hex:'0123456789ABCDEF',he:'אבגדהוזחטיכלמנסעפצקרשתךםןףץ',fa:'آابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی',bn:'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ',ne:'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसहक्षत्रज्ञ',no:latin+'æøå',fi:latin+'äöå',sv:latin+'åäö',el:'αβγδεζηθικλμνξοπρστυφχψω',tr:latin+'çğıöşü',cs:latin+'áčďéěíňóřšťúůýž',pl:latin+'ąćęłńóśźż',pt:latin+'áâãàçéêíóôõúü'};
const ranges={bo:[[0x0f40,0x0f6c]],ko:[[0xac00,0xd7a3]],ja:[[0x3041,0x3096],[0x30a1,0x30fa],[0x4e00,0x9fff]],zh:[[0x4e00,0x9fff]]};
const chars={};for(const [k,v] of Object.entries(sets))chars[k]=Array.from(v);for(const [k,rr] of Object.entries(ranges)){chars[k]=[];for(const [a,b] of rr)for(let cp=a;cp<=b;cp++)chars[k].push(String.fromCodePoint(cp));}

const STORAGE_KEY='698CB08CE3189E08';
let timer=null,count=0,positions={},index=0;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({set:$('set').value,speed:$('speed').value,custom:$('custom').value,positions,index,count,playing:timer!==null}))}catch(e){$('status').textContent='A helyi mentés nem elérhető.'}}
let cachedPool=null;function pool(){if(cachedPool)return cachedPool;const value=$('set').value;return cachedPool=Array.from(value==='custom'?$('custom').value:chars[value]).filter(c=>c.trim()!=='');}
function updatePoolCount(){const n=new Set(pool()).size;$('poolCount').textContent='Különböző karakterek száma: '+n.toLocaleString('hu-HU');}
function uniquePool(){return [...new Set(pool())];}
function fitGlyph(){
 const screen=$('screen'), glyph=$('glyph');
 // A betű tényleges sorának is marad hely, nem csak a rajzolt jelnek.
 const availableH=Math.max(80,screen.clientHeight-48);
 const availableW=Math.max(80,screen.clientWidth-48);
 let size=Math.min(430,availableH/1.55,availableW/1.25);
 glyph.style.fontSize=Math.floor(size)+'px';
 // További méretcsökkentés, ha a böngésző betűmetrikája megkívánja.
 for(let n=0;n<12&&(glyph.scrollHeight>availableH||glyph.scrollWidth>availableW);n++){
  size*=0.9;glyph.style.fontSize=Math.floor(size)+'px';
 }
}
window.addEventListener('resize',fitGlyph);
document.addEventListener('fullscreenchange',()=>requestAnimationFrame(fitGlyph));
function display(){const items=uniquePool();if(!items.length){$('glyph').textContent='—';$('counter').textContent='Nincs karakter';return}index=((index%items.length)+items.length)%items.length;$('glyph').textContent=items[index];fitGlyph();$('counter').textContent=(index+1).toLocaleString('hu-HU')+' / '+items.length.toLocaleString('hu-HU')+' · Léptetések: '+count.toLocaleString('hu-HU');}
function stop(){if(timer!==null){clearInterval(timer);timer=null}$('start').textContent='▶ Indítás';}
function step(delta){const items=uniquePool();if(!items.length){stop();display();return}index=(index+delta+items.length)%items.length;positions[$('set').value]=index;count++;display();save();}
function start(){const seconds=Number($('speed').value);if(!Number.isFinite(seconds)||seconds<0.05||seconds>3600){$('status').textContent='Az időköz 0,05 és 3600 másodperc között legyen.';return}if(!uniquePool().length){$('status').textContent='Adj meg legalább egy karaktert.';return}if(timer!==null){stop();$('status').textContent='Szüneteltetve';save();return}timer=setInterval(()=>step(1),seconds*1000);$('start').textContent='⏸ Szünet';$('status').textContent='Lejátszás';save();}
$('start').onclick=start;
$('prev').onclick=()=>{step(-1);$('status').textContent='Előző karakter'};
$('next').onclick=()=>{step(1);$('status').textContent='Következő karakter'};
$('set').onchange=()=>{const playing=timer!==null;stop();cachedPool=null;index=Number(positions[$('set').value])||0;updatePoolCount();$('customBox').hidden=$('set').value!=='custom';display();save();if(playing)start()};
$('custom').addEventListener('input',()=>{cachedPool=null;index=0;positions.custom=0;updatePoolCount();display();save()});
$('speed').onchange=()=>{const playing=timer!==null;stop();save();if(playing)start()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('screen').requestFullscreen()}catch(e){$('status').textContent='A teljes képernyő nem támogatott ebben a böngészőben.'}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&typeof saved==='object'){if([...$('set').options].some(o=>o.value===saved.set))$('set').value=saved.set;if(saved.speed!==undefined)$('speed').value=saved.speed;if(typeof saved.custom==='string')$('custom').value=saved.custom;if(saved.positions&&typeof saved.positions==='object')positions=saved.positions;index=Number.isSafeInteger(saved.index)?saved.index:0;count=Number.isSafeInteger(saved.count)?saved.count:0;}}catch(e){}$('customBox').hidden=$('set').value!=='custom';updatePoolCount();display();$('status').textContent='Készen áll · állapot visszaállítva';save();
</script></body></html>
