let timer=null,count=0,positions={},index=0;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({set:$('set').value,speed:$('speed').value,positions,index,count,playing:timer!==null}))}catch(e){$('status').textContent='A helyi mentés nem elérhető.'}}
let cachedPool=null;function pool(){if($('set').value==='unicode')return getUnicodePoints();if(cachedPool)return cachedPool;const value=$('set').value;return cachedPool=Array.from(chars[value]).filter(c=>c.trim()!=='');}
function updatePoolCount(){const n=$('set').value==='unicode'?pool().length:new Set(pool()).size;$('poolCount').textContent='Különböző karakterek száma: '+n.toLocaleString('hu-HU');}
function uniquePool(){return $('set').value==='unicode'?pool():[...new Set(pool())];}
function fitGlyph(){
 const screen=$('screen'),glyph=$('glyph');
 const availableH=Math.max(40,screen.clientHeight-96);
 const availableW=Math.max(40,screen.clientWidth-96);
 // A ténylegesen kirajzolt karakter körvonalát is mérjük: egyes
 // ékírásos és díszítő jelek túlnyúlnak a szokásos betűdobozon.
 const canvas=fitGlyph.canvas||(fitGlyph.canvas=document.createElement('canvas'));
 const ctx=canvas.getContext('2d');
 const font=getComputedStyle(glyph).fontFamily;
 const character=glyph.textContent||'';
 let size=Math.min(220,availableH/2.7,availableW/2.1);
 for(let n=0;n<20;n++){
  glyph.style.fontSize=Math.max(1,Math.floor(size))+'px';
  ctx.font=Math.max(1,Math.floor(size))+'px '+font;
  const m=ctx.measureText(character);
  const inkW=(m.actualBoundingBoxLeft||0)+(m.actualBoundingBoxRight||0);
  const inkH=(m.actualBoundingBoxAscent||0)+(m.actualBoundingBoxDescent||0);
  // A vászon-mérésen felül tartalékot hagyunk a különleges fontoknak.
  const safeW=Math.max(glyph.scrollWidth,inkW*1.18);
  const safeH=Math.max(glyph.scrollHeight,inkH*1.35);
  if(safeW<=availableW&&safeH<=availableH)break;
  size*=Math.min(0.9,availableW/Math.max(safeW,1),availableH/Math.max(safeH,1));
 }
}
window.addEventListener('resize',fitGlyph);
document.addEventListener('fullscreenchange',()=>requestAnimationFrame(fitGlyph));
function updateCodePoint(){$('codepoint').textContent='U+'+$('glyph').textContent.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');}
function display(){const items=uniquePool();if(!items.length){$('glyph').textContent='—';updateCodePoint();$('counter').textContent='Nincs karakter';return}index=((index%items.length)+items.length)%items.length;$('glyph').textContent=$('set').value==='unicode'?String.fromCodePoint(items[index]):items[index];updateCodePoint();fitGlyph();$('counter').textContent=(index+1).toLocaleString('hu-HU')+' / '+items.length.toLocaleString('hu-HU')+' · Lépések: '+count.toLocaleString('hu-HU');}
function stop(){if(timer!==null){clearInterval(timer);timer=null}$('start').textContent='▶ Indítás';}
function step(delta){const items=uniquePool();if(!items.length){stop();display();return}index=(index+delta+items.length)%items.length;positions[$('set').value]=index;count++;display();save();}
function start(){const seconds=Number($('speed').value);if(!Number.isFinite(seconds)||seconds<0.05||seconds>3600){$('status').textContent='Az időköz 0,05 és 3600 másodperc között legyen.';return}if(!uniquePool().length){$('status').textContent='Adj meg legalább egy karaktert.';return}if(timer!==null){stop();$('status').textContent='Szüneteltetve';save();return}timer=setInterval(()=>step(1),seconds*1000);$('start').textContent='⏸ Szünet';$('status').textContent='Lejátszás';save();}
$('start').onclick=start;
// Egy másodperces nyomva tartás mindkét léptetőn ugyanazt az ugrási ablakot nyitja.
let jumpWasPlaying=false;
function openJump(){
 jumpWasPlaying=timer!==null;stop();save();
 $('jumpOverlay').classList.add('open');
 $('jumpError').textContent='';
 document.querySelector('input[name="jumpMode"][value="position"]').checked=true;
 $('jumpInput').value=String(index+1);updateJumpMode();
 $('jumpInput').focus();$('jumpInput').select();
}
function closeJump(){ $('jumpOverlay').classList.remove('open');$('status').textContent='Szüneteltetve';save(); }
function updateJumpMode(){
 const unicode=document.querySelector('input[name="jumpMode"]:checked').value==='unicode';
 $('jumpLabel').firstChild.textContent=unicode?'Unicode-kódpont (hexadecimális)':'Karakter sorszáma';
 $('jumpInput').inputMode=unicode?'text':'numeric';
 const items=uniquePool();
 $('jumpInput').value=unicode?(items.length?($('set').value==='unicode'?items[index]:items[index].codePointAt(0)).toString(16).toUpperCase():''):String(index+1);
 $('jumpError').textContent='';
}
document.querySelectorAll('input[name="jumpMode"]').forEach(r=>r.addEventListener('change',updateJumpMode));
$('jumpCancel').onclick=closeJump;
$('jumpOverlay').addEventListener('click',e=>{if(e.target===$('jumpOverlay'))closeJump()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('jumpOverlay').classList.contains('open'))closeJump();if(e.key==='Enter'&&$('jumpOverlay').classList.contains('open'))performJump()});
function performJump(){
 const items=uniquePool(),raw=$('jumpInput').value.trim();
 const unicode=document.querySelector('input[name="jumpMode"]:checked').value==='unicode';
 let target=-1;
 if(unicode){
  const hex=raw.replace(/^U\\+/i,'');
  if(/^[0-9a-fA-F]{1,6}$/.test(hex)){
   const cp=parseInt(hex,16);
   if(cp<=0x10FFFF){
    if($('set').value==='unicode'){
     let lo=0,hi=items.length-1;
     while(lo<=hi){const mid=(lo+hi)>>>1;if(items[mid]===cp){target=mid;break}if(items[mid]<cp)lo=mid+1;else hi=mid-1}
    }else target=items.findIndex(c=>c.codePointAt(0)===cp);
   }
  }
 }else if(/^[0-9]+$/.test(raw)){const n=Number(raw);if(Number.isSafeInteger(n)&&n>=1&&n<=items.length)target=n-1}
 if(target<0){$('jumpError').textContent=unicode?'Ez a kódpont nincs a kiválasztott karakterkészletben.':'Érvényes sorszám: 1–'+items.length.toLocaleString('hu-HU');return}
 index=target;positions[$('set').value]=index;display();save();
 $('jumpOverlay').classList.remove('open');$('status').textContent='Ugrás kész · szüneteltetve';save();
}
$('jumpGo').onclick=performJump;
$('prev').onclick=()=>{step(-1);$('status').textContent='Előző karakter'};
$('next').onclick=()=>{step(1);$('status').textContent='Következő karakter'};
$('jumpButton').onclick=openJump;

$('set').onchange=()=>{const playing=timer!==null;stop();cachedPool=null;index=Number(positions[$('set').value])||0;updatePoolCount();display();save();if(playing)start()};
$('speed').onchange=()=>{const playing=timer!==null;stop();save();if(playing)start()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('screen').requestFullscreen()}catch(e){$('status').textContent='A teljes képernyő nem támogatott ebben a böngészőben.'}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&typeof saved==='object'){if(saved.set==='hex')saved.set='math';if([...$('set').options].some(o=>o.value===saved.set))$('set').value=saved.set;if(saved.speed!==undefined)$('speed').value=saved.speed;if(saved.positions&&typeof saved.positions==='object')positions=saved.positions;index=Number.isSafeInteger(saved.index)?saved.index:0;count=Number.isSafeInteger(saved.count)?saved.count:0;}}catch(e){}updatePoolCount();display();$('status').textContent='Készen áll · állapot visszaállítva';save();
</script></body></html>
