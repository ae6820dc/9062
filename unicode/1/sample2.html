<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Text Generator – 11 nyelv Extended</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233156c4'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='35' font-weight='bold' fill='white'%3E文%3C/text%3E%3C/svg%3E"><style>:root{color-scheme:light;--bg:#f5f7fc;--fg:#17243b;--muted:#53627a;--panel:#e6ebf5;--border:#9caac0;--field:#fff;--button:#3156c4;--hover:#2446aa;--status:#17683a}body.dark{color-scheme:dark;--bg:#101827;--fg:#edf2ff;--muted:#aab7d0;--panel:#1c2940;--border:#52617b;--field:#101827;--button:#375bd0;--hover:#4c70e6;--status:#9fd3a9}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:4px}p{color:var(--muted)}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;background:var(--panel);padding:18px;border-radius:14px}label{display:grid;gap:6px;font-size:14px}input,select,button,textarea{font:inherit;border-radius:8px;border:1px solid var(--border);padding:10px;background:var(--field);color:var(--fg);min-width:0}button{cursor:pointer;background:var(--button);color:white;border:0}button:hover{background:var(--hover)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.stats{color:var(--muted);margin:12px 0}textarea{width:100%;height:52vh;box-sizing:border-box;resize:vertical;line-height:1.7}#status{color:var(--status)}</style></head><body><main><h1>🌐 Random Text Generator</h1><p>11 bővített nyelvi készlet · végtelen, újragenerálható oldalak · UTF-8 export</p><section class="controls"><label>Nyelv<select id="lang"><option value="en">Angol</option><option value="de">Német</option><option value="fr">Francia</option><option value="es">Spanyol</option><option value="it">Olasz</option><option value="ru">Orosz</option><option value="ja">Japán</option><option value="la">Latin</option><option value="ar">Arab</option><option value="zh">Kínai</option><option value="hu" selected>Magyar</option></select></label><label>Minimum szóhossz<input id="min" type="number" min="1" max="50" value="1"></label><label>Maximum szóhossz<input id="max" type="number" min="1" max="50" value="50"></label><label>Szavak oldalanként<select id="count"><option>1000</option><option selected>10000</option><option>50000</option></select></label><label>Seed (szám vagy szöveg)<input id="seed" value="RandomText2026"></label><label>Oldalszám<input id="page" type="text" inputmode="numeric" value="1"></label></section><div class="buttons"><button id="generate">🎲 Generálás</button><button id="prev">← Előző oldal</button><button id="next">Következő oldal →</button><button id="randomSeed">Új seed</button><button id="copy">Másolás</button><button id="save">HTML mentése</button><button id="theme" type="button">🌙 Sötét téma</button></div><div class="stats" id="stats">Még nincs generált oldal.</div><textarea id="output" spellcheck="false" aria-label="Generált szöveg"></textarea><p id="status" role="status"></p></main><script>
'use strict';
const $=id=>document.getElementById(id);
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('theme').textContent=dark?'☀️ Világos téma':'🌙 Sötét téma';};
// Unicode-alapú, nyelvspecifikus készletek. A többjegyű magyar betű egy egység.
const latin='abcdefghijklmnopqrstuvwxyz';
const upper=s=>s.toLocaleUpperCase();
const unique=s=>[...new Set(Array.from(s))];
const latinSets={
 en:latin,
 de:latin+'äöüßẞ',
 fr:latin+'àâæçéèêëîïôœùûüÿ',
 es:latin+'áéíñóúü',
 it:latin+'àèéìíîòóùú',
 la:latin+'āēīōūȳăĕĭŏŭæœ',
 hu:latin+'áéíóöőúüű',
};
const sets={
 ...Object.fromEntries(Object.entries(latinSets).map(([k,v])=>[k,unique(v+upper(v))])),
 ru:unique('абвгдеёжзийклмнопрстуфхцчшщъыьэюя'+'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'),
 ar:unique('ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأإؤئىةٱپچڤگژک ی')
};
// Magyar 44 betű: 35 egyjegyű + 9 többjegyű (a kis- és nagybetűk külön alakok).
const huDigraphs=['cs','dz','dzs','gy','ly','ny','sz','ty','zs'];
sets.hu=[...sets.hu,...huDigraphs,...huDigraphs.map(upper)];
// Arab rövid magánhangzók: a diakritika betűhöz kapcsolva kerül a készletbe.
const arabBase=Array.from('ابتثجحخدذرزسشصضطظعغفقكلمنهوي');
sets.ar=[...sets.ar,...arabBase.flatMap(c=>['\u064e','\u064f','\u0650','\u0652','\u0651','\u064b','\u064c','\u064d'].map(mark=>c+mark))];
// Unicode 15.1 Han és kana tartományok: ritka és kiegészítő írásjegyekkel.
const hanRanges=[[11904,11929],[11931,12019],[12032,12245],[12293,12293],[12295,12295],[12321,12329],[12344,12347],[13312,19903],[19968,40959],[63744,64109],[64112,64217],[94178,94179],[94192,94198],[131072,173791],[173824,178205],[178208,183981],[183984,191456],[191472,192093],[194560,195101],[196608,201546],[201552,210041]];
const kanaRanges=[[12353,12438],[12445,12447],[12449,12538],[12541,12543],[12784,12799],[13008,13054],[13056,13143],[65382,65391],[65393,65437],[110576,110579],[110581,110587],[110589,110590],[110592,110882],[110898,110898],[110928,110930],[110933,110933],[110948,110951],[127488,127488]];
function makePool(rr){let total=0;const items=rr.map(([a,b])=>{total+=b-a+1;return [a,b,total]});return {total,items}}
const unicodePools={zh:makePool(hanRanges),ja:makePool([...hanRanges,...kanaRanges])};
const chars=sets;
function randomChar(lang,rand){const pool=unicodePools[lang];if(!pool){const arr=chars[lang];return arr[Math.floor(rand()*arr.length)]}const ix=Math.floor(rand()*pool.total);let lo=0,hi=pool.items.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(ix<pool.items[mid][2])hi=mid;else lo=mid+1}const [a,b,end]=pool.items[lo];return String.fromCodePoint(a+ix-(end-(b-a+1)))}
function hash(s){let h=2166136261;for(const c of new TextEncoder().encode(s)){h=Math.imul(h^c,16777619)}return h>>>0}
function rng(seed){let x=seed>>>0;return ()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function valid(){const mn=Number($('min').value),mx=Number($('max').value),n=Number($('count').value),p=$('page').value.trim();if(!Number.isInteger(mn)||!Number.isInteger(mx)||mn<1||mx>50||mn>mx)throw Error('A szóhossz 1–50 között legyen, és a minimum ne legyen nagyobb a maximumnál.');if(!/^[1-9]\d*$/.test(p)||p.length>10000)throw Error('Az oldalszám pozitív egész szám legyen.');return {mn,mx,n,p:BigInt(p),lang:$('lang').value,seed:$('seed').value}}
function generate(){try{const {mn,mx,n,p,lang,seed}=valid();const start=performance.now();const rand=rng(hash(JSON.stringify([seed,lang,mn,mx,n,p.toString()])));const words=new Array(n);for(let i=0;i<n;i++){const len=mn+Math.floor(rand()*(mx-mn+1));let word='';for(let j=0;j<len;j++)word+=randomChar(lang,rand);words[i]=word;}const result=words.join(' ');$('output').value=result;$('output').dir=lang==='ar'?'rtl':'ltr';$('stats').textContent=`${n.toLocaleString('hu-HU')} szó · ${result.length.toLocaleString('hu-HU')} UTF-16 kódegység · ${ (performance.now()-start).toFixed(1)} ms · ${p.toString()}. oldal`;$('status').textContent='Az oldal elkészült.';}catch(e){$('status').textContent='Hiba: '+e.message}}
$('generate').onclick=generate;$('prev').onclick=()=>{try{const p=valid().p;if(p>1n){$('page').value=(p-1n).toString();generate()}}catch(e){$('status').textContent=e.message}};$('next').onclick=()=>{try{$('page').value=(valid().p+1n).toString();generate()}catch(e){$('status').textContent=e.message}};$('randomSeed').onclick=()=>{const a=new Uint32Array(4);crypto.getRandomValues(a);$('seed').value=Array.from(a,x=>x.toString(16).padStart(8,'0')).join('');$('page').value='1';generate()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Szöveg másolva.'}catch(e){$('output').select();$('status').textContent='Jelöld ki és másold a szöveget Ctrl+C-vel (helyi fájlnál a vágólap engedélyhez kötött).'}};$('save').onclick=()=>{const text=$('output').value;if(!text){$('status').textContent='Előbb generálj szöveget.';return;}const lang=$('lang').value,page=$('page').value,seed=$('seed').value;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const savedAt=new Date(),unixTime=savedAt.getTime(),savedLocal=savedAt.toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short'});const dark=document.body.classList.contains('dark');const exportBg=dark?'#101827':'#f5f7fc',exportFg=dark?'#edf2ff':'#17243b',exportMuted=dark?'#aab7d0':'#53627a';const html=`<!doctype html><html lang="${esc(lang)}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Text – ${esc(lang)} – ${esc(page)}. oldal</title><style>body{font:16px/1.8 system-ui;margin:0;background:${exportBg};color:${exportFg}}main{max-width:1100px;margin:auto;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}small{color:${exportMuted}}</style></head><body><main><h1>Random Text Generator</h1><small>Nyelv: ${esc(lang)} | Oldal: ${esc(page)} | Seed: ${esc(seed)} | Mentve: ${esc(savedLocal)} | Unix (ms): ${unixTime}</small><pre dir="${lang==='ar'?'rtl':'auto'}">${esc(text)}</pre></main></body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`RandomText_${unixTime}_${lang}_page_${page}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='HTML mentés elindítva.'};generate();
</script></body></html>
