<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Text Generator</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDY0IDY0Ij48cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxNCIgZmlsbD0iIzMxNTZjNCIvPjx0ZXh0IHg9IjMyIiB5PSI0MyIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMzUiIGZvbnQtd2VpZ2h0PSJib2xkIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+QWE8L3RleHQ+PC9zdmc+"><style>:root{color-scheme:light;--bg:#f5f7fc;--fg:#17243b;--muted:#53627a;--panel:#e6ebf5;--border:#9caac0;--field:#fff;--button:#3156c4;--hover:#2446aa;--status:#17683a}body.dark{color-scheme:dark;--bg:#101827;--fg:#edf2ff;--muted:#aab7d0;--panel:#1c2940;--border:#52617b;--field:#101827;--button:#375bd0;--hover:#4c70e6;--status:#9fd3a9}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:4px}p{color:var(--muted)}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;background:var(--panel);padding:18px;border-radius:14px}label{display:grid;gap:6px;font-size:14px}input,select,button,textarea{font:inherit;border-radius:8px;border:1px solid var(--border);padding:10px;background:var(--field);color:var(--fg);min-width:0}button{cursor:pointer;background:var(--button);color:white;border:0}button:hover{background:var(--hover)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.stats{color:var(--muted);margin:12px 0}textarea{width:100%;height:52vh;box-sizing:border-box;resize:vertical;line-height:1.7}#status{color:var(--status)}</style></head><body><main><h1>🌐 Random Text Generator</h1><p>26 nyelv · végtelen, újragenerálható oldalak · UTF-8 export</p><p id="programId" style="font-size:13px;overflow-wrap:anywhere;margin:7px 0 17px"><strong>Program ID:</strong> <code style="user-select:all">097929839D6764959B5427B3A689FD2A</code></p><section class="controls"><label>Nyelv<select id="lang"><option value="en">Angol</option><option value="ar">Arab</option><option value="bn">Bengáli</option><option value="cs">Cseh</option><option value="fi">Finn</option><option value="fr">Francia</option><option value="el">Görög</option><option value="hex">Hexadecimális</option><option value="he">Héber</option><option value="ja">Japán</option><option value="ko">Koreai</option><option value="zh">Kínai</option><option value="la">Latin</option><option value="pl">Lengyel</option><option value="hu" selected>Magyar</option><option value="ne">Nepáli</option><option value="no">Norvég</option><option value="de">Német</option><option value="it">Olasz</option><option value="ru">Orosz</option><option value="fa">Perzsa</option><option value="pt">Portugál</option><option value="es">Spanyol</option><option value="sv">Svéd</option><option value="bo">Tibeti</option><option value="tr">Török</option></select></label><label>Minimum szóhossz<input id="min" type="number" min="1" max="50" value="1"></label><label>Maximum szóhossz<input id="max" type="number" min="1" max="50" value="50"></label><label>Szavak oldalanként<select id="count"><option>1000</option><option selected>10000</option><option>50000</option></select></label><label>Seed (16 jegyű hex)<input id="seed" value="0000000000000000" maxlength="16" minlength="16" pattern="[0-9a-fA-F]{16}" spellcheck="false"></label><label>Oldalszám<input id="page" type="text" inputmode="numeric" value="1"></label></section><div class="buttons"><button id="generate">🎲 Generálás</button><button id="prev">← Előző oldal</button><button id="next">Következő oldal →</button><button id="randomSeed">Új seed</button><button id="copy">Másolás</button><button id="save">HTML mentése</button><button id="theme" type="button">🌙 Sötét téma</button></div><div class="stats" id="stats">Még nincs generált oldal.</div><textarea id="output" spellcheck="false" aria-label="Generált szöveg"></textarea><p id="status" role="status"></p></main><script>
'use strict';
const $=id=>document.getElementById(id);
const STORAGE_KEY='36a47b258d3344a0';
function applyTheme(dark){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀️ Világos téma':'🌙 Sötét téma';}
try{applyTheme(localStorage.getItem(STORAGE_KEY)==='dark')}catch(e){}
$('theme').onclick=()=>{const dark=!document.body.classList.contains('dark');applyTheme(dark);try{localStorage.setItem(STORAGE_KEY,dark?'dark':'light')}catch(e){}};
const latin='abcdefghijklmnopqrstuvwxyz';
const sets={en:latin,de:latin+'äöüß',fr:latin+'àâæçéèêëîïôœùûüÿ',es:latin+'áéíñóúü',it:latin+'àèéìíîòóùú',ru:'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',la:'abcdefghijklmnopqrstuvxyz',ar:'ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأإؤئىة',hu:latin+'áéíóöőúüű',hex:'0123456789ABCDEF',he:'אבגדהוזחטיכלמנסעפצקרשתךםןףץ',fa:'آابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی',bn:'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ',ne:'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसहक्षत्रज्ञ',no:latin+'æøå',fi:latin+'äöå',sv:latin+'åäö',el:'αβγδεζηθικλμνξοπρστυφχψω',tr:latin+'çğıöşü',cs:latin+'áčďéěíňóřšťúůýž',pl:latin+'ąćęłńóśźż',pt:latin+'áâãàçéêíóôõúü'};
const ranges={bo:[[0x0f40,0x0f6c]],ko:[[0xac00,0xd7a3]],ja:[[0x3041,0x3096],[0x30a1,0x30fa],[0x4e00,0x9fff]],zh:[[0x4e00,0x9fff]]};
const chars={};for(const [k,v] of Object.entries(sets))chars[k]=Array.from(v);for(const [k,rr] of Object.entries(ranges)){chars[k]=[];for(const [a,b] of rr)for(let cp=a;cp<=b;cp++)chars[k].push(String.fromCodePoint(cp));}
// A beállítások 64 bites FNV-1a lenyomata; a seed NEM kerül hash-elésre.
const MASK64=(1n<<64n)-1n;
function hashSettings(s){let h=0xcbf29ce484222325n;for(const c of new TextEncoder().encode(s))h=((h^BigInt(c))*0x100000001b3n)&MASK64;return h}
// SplitMix64: minden 64 bites kezdőállapot megengedett, beleértve a nullát is.
// A belső számláló teljes periódusa 2^64, mert páratlan konstanssal lép.
function rng(seed){let state=seed&MASK64;return ()=>{
  state=(state+0x9e3779b97f4a7c15n)&MASK64;
  let z=state;
  z=((z^(z>>30n))*0xbf58476d1ce4e5b9n)&MASK64;
  z=((z^(z>>27n))*0x94d049bb133111ebn)&MASK64;
  z=z^(z>>31n);
  return Number(z>>11n)/9007199254740992;
}}
function valid(){const mn=Number($('min').value),mx=Number($('max').value),n=Number($('count').value),p=$('page').value.trim();if(!Number.isInteger(mn)||!Number.isInteger(mx)||mn<1||mx>50||mn>mx)throw Error('A szóhossz 1–50 között legyen, és a minimum ne legyen nagyobb a maximumnál.');if(!/^[1-9]\d*$/.test(p)||p.length>10000)throw Error('Az oldalszám pozitív egész szám legyen.');const seed=$('seed').value.trim().toLowerCase();if(!/^[0-9a-f]{16}$/.test(seed))throw Error('A seed pontosan 16 hexadecimális karakter legyen.');return {mn,mx,n,p:BigInt(p),lang:$('lang').value,seed}}
function generate(){try{const {mn,mx,n,p,lang,seed}=valid();const start=performance.now();const settingsOffset=hashSettings(JSON.stringify([lang,mn,mx,n,p.toString()]));const rand=rng((BigInt('0x'+seed)+settingsOffset)&MASK64);const pool=chars[lang],words=new Array(n);for(let i=0;i<n;i++){const len=mn+Math.floor(rand()*(mx-mn+1));let word='';for(let j=0;j<len;j++)word+=pool[Math.floor(rand()*pool.length)];words[i]=word;}const result=words.join(' ');$('output').value=result;$('output').dir=['ar','fa','he'].includes(lang)?'rtl':'ltr';$('stats').textContent=`${n.toLocaleString('hu-HU')} szó · ${result.length.toLocaleString('hu-HU')} UTF-16 kódegység · ${ (performance.now()-start).toFixed(1)} ms · ${p.toString()}. oldal`;$('status').textContent='Az oldal elkészült.';}catch(e){$('status').textContent='Hiba: '+e.message}}
$('generate').onclick=generate;$('prev').onclick=()=>{try{const p=valid().p;if(p>1n){$('page').value=(p-1n).toString();generate()}}catch(e){$('status').textContent=e.message}};$('next').onclick=()=>{try{$('page').value=(valid().p+1n).toString();generate()}catch(e){$('status').textContent=e.message}};$('randomSeed').onclick=()=>{const a=new Uint32Array(2);crypto.getRandomValues(a);$('seed').value=Array.from(a,x=>x.toString(16).padStart(8,'0')).join('');$('page').value='1';generate()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Szöveg másolva.'}catch(e){$('output').select();$('status').textContent='Jelöld ki és másold a szöveget Ctrl+C-vel (helyi fájlnál a vágólap engedélyhez kötött).'}};$('save').onclick=()=>{const text=$('output').value;if(!text){$('status').textContent='Előbb generálj szöveget.';return;}const lang=$('lang').value,page=$('page').value,seed=$('seed').value;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const savedAt=new Date(),unixTime=savedAt.getTime(),savedLocal=savedAt.toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short'});const dark=document.body.classList.contains('dark');const exportBg=dark?'#101827':'#f5f7fc',exportFg=dark?'#edf2ff':'#17243b',exportMuted=dark?'#aab7d0':'#53627a';const html=`<!doctype html><html lang="${esc(lang)}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Text – ${esc(lang)} – ${esc(page)}. oldal</title><style>*{box-sizing:border-box}html{width:var(--reading-width,100%)}body{font:1rem/1.8 system-ui;margin:0;background:${exportBg};color:${exportFg};overflow-wrap:anywhere;word-break:normal}main{width:100%;max-width:1100px;min-width:0;margin:auto;padding:clamp(8px,4vw,24px)}h1{font-size:2em;line-height:1.2}pre{max-width:100%;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font:inherit}small{color:${exportMuted}}</style></head><body><main><h1>Random Text Generator</h1><div style="margin:7px 0;font:.875rem system-ui;overflow-wrap:anywhere"><strong>Program ID:</strong> <code>097929839D6764959B5427B3A689FD2A</code></div><small style="display:block">Nyelv: ${esc(lang)} | Oldal: ${esc(page)} | Seed: ${esc(seed)}</small><small style="display:block">Mentve: ${esc(savedLocal)} | Unix (ms): ${unixTime}</small><pre dir="${['ar','fa','he'].includes(lang)?'rtl':'auto'}">${esc(text)}</pre></main><script>
// Reflow to the visible width during pinch zoom without restricting browser zoom.
if(window.visualViewport){const viewport=window.visualViewport;const reflow=()=>{document.documentElement.style.setProperty('--reading-width',Math.min(document.documentElement.clientWidth,viewport.width)+'px')};viewport.addEventListener('resize',()=>{document.documentElement.style.removeProperty('--reading-width');reflow()});reflow()}
<\/script></body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`RandomText_${unixTime}_${lang}_page_${page}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='HTML mentés elindítva.'};generate();
