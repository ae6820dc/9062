function mathCharacters(){const result=new Set(Array.from(mathExtras).filter(c=>c.trim()));for(const [a,b] of [...mathRanges,...numberRanges]){for(let cp=a;cp<=b;cp++){const c=String.fromCodePoint(cp);if(/\p{Assigned}/u.test(c)&&!/\p{Control}|\p{Format}|\p{Private_Use}|\p{Surrogate}/u.test(c))result.add(c)}}return [...result]}

// Unicode: csak kiosztott, megjelenítésre szánt kódpontok; egyszeri, tömör index.
let unicodePoints=null;
function getUnicodePoints(){
 if(unicodePoints)return unicodePoints;
 const assigned=/\p{Assigned}/u, excluded=/[\p{Cc}\p{Cf}\p{Cs}\p{Co}]/u;
 const out=[];
 for(let cp=0;cp<=0x10FFFF;cp++){
  if(cp>=0xD800&&cp<=0xDFFF){cp=0xDFFF;continue}

  if(assigned.test(c)&&!excluded.test(c))out.push(cp);

}

const STORAGE_KEY='60EB35BADF29D65D';
// Only alphabet indices (bounded by 0x110000) become Numbers, never ordinals.
function orderedAlphabet(items){return [...new Set(items)].sort((a,b)=>a-b)}
function alphabetFor(key){return key==='unicode'?getUnicodePoints():orderedAlphabet(chars[key].filter(c=>c.trim()!=='').map(c=>c.codePointAt(0)))}
function stringAt(items,length,ordinal){let value=ordinal-1n;const base=BigInt(items.length),out=Array(length);for(let i=length-1;i>=0;i--){out[i]=String.fromCodePoint(items[Number(value%base)]);value/=base}return out.join('')}
function decimal(raw){if(typeof raw!=='string'||!/^\d+$/.test(raw))throw Error('A sorszám csak tízes számrendszerbeli számjegyeket tartalmazhat.');return BigInt(raw)}
function validLength(raw){if(!/^\d+$/.test(String(raw)))throw Error('A hossz 1 és 128 közötti egész szám legyen.');const n=Number(raw);if(!Number.isInteger(n)||n<1||n>128)throw Error('A hossz 1 és 128 közötti egész szám legyen.');return n}
function validSpeed(raw){const n=Number(raw);if(!Number.isFinite(n)||n<.05||n>3600)throw Error('Az időköz 0,05 és 3600 másodperc között legyen.');return n}
let key='en',length=1,alphabet=alphabetFor(key),ordinal=1n,total=BigInt(alphabet.length),timer=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:17,set:key,length,speed:$('speed').value,ordinal:ordinal.toString()}))}catch(e){$('error').textContent='A helyi mentés nem elérhető; a program mentés nélkül működik.'}}
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('start').textContent='▶ Indítás'}
function display(){const current=stringAt(alphabet,length,ordinal);$('glyph').replaceChildren(...Array.from(current,c=>{const span=document.createElement('span');span.textContent=c;return span}));$('glyph').classList.toggle('single',length===1);$('counter').textContent=ordinal.toString()+' / '+total.toString();$('total').textContent=total.toString();$('poolCount').textContent='Különböző karakterek száma: '+alphabet.length;$('ordinal').value=ordinal.toString();$('prev').disabled=ordinal===1n;$('next').disabled=ordinal===total;$('status').textContent=ordinal===total?'Utolsó karakterlánc · a sorozat vége':ordinal===1n?'Első karakterlánc':timer===null?'Szüneteltetve':'Lejátszás';if(ordinal===total)stop();document.querySelector('[name=jumpMode][value=unicode]').disabled=length!==1}
function go(target){if(target<1n||target>total)throw Error('A sorszám tartománya: 1–'+total.toString());ordinal=target;display();save()}
function step(delta){const target=ordinal+delta;if(target<1n||target>total){display();return}go(target)}
function start(){try{const speed=validSpeed($('speed').value);if(ordinal===total){display();return}timer=setInterval(()=>step(1n),speed*1000);$('start').textContent='⏸ Szünet';$('status').textContent='Lejátszás';save()}catch(e){$('error').textContent=e.message}}
$('start').onclick=()=>{if(timer!==null){stop();display()}else start()};
$('prev').onclick=()=>step(-1n);$('next').onclick=()=>step(1n);
function apply(){try{const nextLength=validLength($('length').value),nextAlphabet=alphabetFor($('set').value),nextTotal=BigInt(nextAlphabet.length)**BigInt(nextLength),target=decimal($('ordinal').value);if(target<1n||target>nextTotal)throw Error('A sorszám tartománya: 1–'+nextTotal);stop();key=$('set').value;length=nextLength;alphabet=nextAlphabet;total=nextTotal;$('error').textContent='';go(target)}catch(e){$('error').textContent=e.message}}
$('apply').onclick=apply;
$('set').onchange=()=>{$('ordinal').value='1';apply()};
$('speed').onchange=()=>{try{validSpeed($('speed').value);$('error').textContent='';const playing=timer!==null;stop();save();if(playing)start()}catch(e){stop();$('error').textContent=e.message}};
function closeJump(){$('jumpOverlay').classList.remove('open');$('jumpButton').focus()}
$('jumpButton').onclick=()=>{stop();display();$('jumpOverlay').classList.add('open');$('jumpError').textContent='';$('jumpInput').value=ordinal.toString();document.querySelector('[name=jumpMode][value=position]').checked=true;updateJumpMode();$('jumpInput').focus()};
function updateJumpMode(){const unicode=document.querySelector('[name=jumpMode]:checked').value==='unicode';$('jumpInput').inputMode=unicode?'text':'numeric';$('jumpInput').value=unicode?$('glyph').textContent.codePointAt(0).toString(16).toUpperCase():ordinal.toString()}
document.querySelectorAll('[name=jumpMode]').forEach(r=>{if(r.value==='unicode')r.disabled=true;r.onchange=()=>{if(length!==1&&r.value==='unicode')return;updateJumpMode()}});
function performJump(){try{let target;if(document.querySelector('[name=jumpMode]:checked').value==='unicode'){if(length!==1)throw Error('Unicode-keresés csak 1 hossz esetén használható.');const raw=$('jumpInput').value.replace(/^U\+/i,'');if(!/^[0-9a-fA-F]{1,6}$/.test(raw))throw Error('Érvénytelen hexadecimális kódpont.');const index=alphabet.indexOf(parseInt(raw,16));if(index<0)throw Error('Ez a kódpont nincs a kiválasztott készletben.');target=BigInt(index)+1n}else target=decimal($('jumpInput').value);go(target);closeJump()}catch(e){$('jumpError').textContent=e.message}}
$('jumpGo').onclick=performJump;$('jumpCancel').onclick=closeJump;

try{const raw=localStorage.getItem(STORAGE_KEY);if(raw!==null){const saved=JSON.parse(raw);if(!saved||saved.version!==17||typeof saved.length!=='number'||typeof saved.speed!=='string'||!Object.hasOwn(chars,saved.set)&&saved.set!=='unicode')throw Error('Ismeretlen mentett készlet.');const savedLength=validLength(saved.length);validSpeed(saved.speed);const savedAlphabet=alphabetFor(saved.set),savedTotal=BigInt(savedAlphabet.length)**BigInt(savedLength),savedOrdinal=decimal(saved.ordinal);if(savedOrdinal<1n||savedOrdinal>savedTotal)throw Error('A mentett sorszám tartományon kívül van.');key=saved.set;length=savedLength;alphabet=savedAlphabet;total=savedTotal;ordinal=savedOrdinal;$('speed').value=saved.speed}}catch(e){$('error').textContent='A mentett állapot nem állítható vissza: '+e.message+' Alapállapot betöltve.'}
$('set').value=key;$('length').value=length;display();
