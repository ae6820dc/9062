</style></head><body><main><header>Program ID: 66DE6A06E5DF1CE0</header><h1>Unicode 18</h1><div class="controls"><label>Karakterkészlet<select id="set"><option value="en">Angol</option><option value="ar">Arab</option><option value="bn">Bengáli</option><option value="cs">Cseh</option><option value="fi">Finn</option><option value="fr">Francia</option><option value="el">Görög</option><option value="he">Héber</option><option value="ja">Japán</option><option value="zh">Kínai</option><option value="ko">Koreai</option><option value="la">Latin</option><option value="pl">Lengyel</option><option value="hu">Magyar</option><option value="de">Német</option><option value="ne">Nepáli</option><option value="no">Norvég</option><option value="it">Olasz</option><option value="ru">Orosz</option><option value="fa">Perzsa</option><option value="pt">Portugál</option><option value="es">Spanyol</option><option value="sv">Svéd</option><option value="bo">Tibeti</option><option value="tr">Török</option><option value="vi">Vietnámi</option></select></label><label>Váltás (másodperc)<input id="speed" type="number" min="0.05" max="3600" step="0.05" value="1"></label><label>Karakterlánc<input id="length" type="number" min="1" max="8192" step="1" value="1"></label><label>Kezdő sorszám<input id="ordinal" type="text" inputmode="numeric" autocomplete="off" value="1"></label><button id="apply">Alkalmazás</button></div><div id="error" role="alert"></div><p id="poolCount"></p><div class="actions"><button id="start">▶ Indítás</button><button id="prev">⏮ Előző</button><button id="next">⏭ Következő</button><button id="fullscreen">⛶ Teljes képernyő</button></div><div id="status" role="status"></div><div class="viewer" id="viewer"><div class="screen" id="screen"><div class="glyph" id="glyph" dir="ltr"></div></div></div><div class="meta"><span id="counter"></span></div></main><script>
'use strict';const $=id=>document.getElementById(id);
const latin='abcdefghijklmnopqrstuvwxyz';
// A 8. verzió vietnámi készlete, kis- és nagybetűkkel; előre összeállított kódpontok.
const vietnamese='aăâbcdđeêghiklmnoôơpqrstuưvxyáàảãạắằẳẵặấầẩẫậéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ';
const sets={en:latin,de:latin+'äöüß',fr:latin+'àâæçéèêëîïôœùûüÿ',es:latin+'áéíñóúü',it:latin+'àèéìíîòóùú',ru:'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',la:'abcdefghijklmnopqrstuvxyz',ar:'ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأإؤئىة',hu:latin+'áéíóöőúüű',he:'אבגדהוזחטיכלמנסעפצקרשתךםןףץ',fa:'آابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی',bn:'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ',ne:'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसहक्षत्रज्ञ',no:latin+'æøå',fi:latin+'äöå',sv:latin+'åäö',el:'αβγδεζηθικλμνξοπρστυφχψω',tr:latin+'çğıöşü',cs:latin+'áčďéěíňóřšťúůýž',pl:latin+'ąćęłńóśźż',pt:latin+'áâãàçéêíóôõúü',vi:vietnamese+vietnamese.toUpperCase()};
const ranges={bo:[[0x0f40,0x0f6c]],ko:[[0xac00,0xd7a3]],ja:[[0x3041,0x3096],[0x30a1,0x30fa],[0x4e00,0x9fff]],zh:[[0x4e00,0x9fff]]};
const chars={};for(const [k,v] of Object.entries(sets))chars[k]=Array.from(v);for(const [k,rr] of Object.entries(ranges)){chars[k]=[];for(const [a,b] of rr)for(let cp=a;cp<=b;cp++)chars[k].push(String.fromCodePoint(cp));}

const STORAGE_KEY='1F2FB4C30A9CB15E';
// Only alphabet indices (bounded by 0x110000) become Numbers, never ordinals.
function orderedAlphabet(items){return [...new Set(items)].sort((a,b)=>a-b)}
function alphabetFor(key){return orderedAlphabet(chars[key].filter(c=>c.trim()!=='').map(c=>c.codePointAt(0)))}
function stringAt(items,length,ordinal){let value=ordinal-1n;const base=BigInt(items.length),out=Array(length);for(let i=length-1;i>=0;i--){out[i]=String.fromCodePoint(items[Number(value%base)]);value/=base}return out.join('')}
function decimal(raw){if(typeof raw!=='string'||!/^\d+$/.test(raw))throw Error('A sorszám csak tízes számrendszerbeli számjegyeket tartalmazhat.');return BigInt(raw)}
function validLength(raw){if(!/^\d+$/.test(String(raw)))throw Error('A hossz 1 és 8192 közötti egész szám legyen.');const n=Number(raw);if(!Number.isInteger(n)||n<1||n>8192)throw Error('A hossz 1 és 8192 közötti egész szám legyen.');return n}
function validSpeed(raw){const n=Number(raw);if(!Number.isFinite(n)||n<.05||n>3600)throw Error('Az időköz 0,05 és 3600 másodperc között legyen.');return n}
let key='en',length=1,alphabet=alphabetFor(key),ordinal=1n,total=BigInt(alphabet.length),timer=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:18,set:key,length,speed:$('speed').value,ordinal:ordinal.toString()}))}catch(e){$('error').textContent='A helyi mentés nem elérhető; a program mentés nélkül működik.'}}
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('start').textContent='▶ Indítás'}
// Fixed cells reserve space for the widest alphabet character, independent of the current string.
function sizeDisplay(){const glyph=$('glyph'),screen=$('screen');glyph.classList.toggle('single',length===1);const style=getComputedStyle(glyph),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font=style.font;let widest=0;for(const cp of alphabet)widest=Math.max(widest,ctx.measureText(String.fromCodePoint(cp)).width);const cell=Math.ceil(widest)+4,width=screen.clientWidth-36-2,columns=Math.max(1,Math.floor(width/cell)),rows=Math.ceil(length/columns);glyph.style.gridTemplateColumns=length===1?'1fr':`repeat(${columns}, minmax(0, 1fr))`;screen.style.height=Math.max(260,Math.ceil(rows*parseFloat(style.lineHeight)+38))+'px'}
function display(){const current=stringAt(alphabet,length,ordinal);$('glyph').replaceChildren(...Array.from(current,c=>{const span=document.createElement('span');span.textContent=c;return span}));$('glyph').classList.toggle('single',length===1);$('counter').textContent=ordinal.toString()+' / '+total.toString();$('poolCount').textContent='Különböző karakterek száma: '+alphabet.length;$('ordinal').value=ordinal.toString();$('prev').disabled=ordinal===1n;$('next').disabled=ordinal===total;$('status').textContent=ordinal===total?'Utolsó karakterlánc · a sorozat vége':ordinal===1n?'Első karakterlánc':timer===null?'Szüneteltetve':'Lejátszás';if(ordinal===total)stop()}
function go(target){if(target<1n||target>total)throw Error('A sorszám tartománya: 1–'+total.toString());ordinal=target;display();save()}
function step(delta){const target=ordinal+delta;if(target<1n||target>total){display();return}go(target)}
function start(){try{const speed=validSpeed($('speed').value);if(ordinal===total){display();return}timer=setInterval(()=>step(1n),speed*1000);$('start').textContent='⏸ Szünet';$('status').textContent='Lejátszás';save()}catch(e){$('error').textContent=e.message}}
$('start').onclick=()=>{if(timer!==null){stop();display()}else start()};
$('prev').onclick=()=>step(-1n);$('next').onclick=()=>step(1n);
function apply(){try{const nextLength=validLength($('length').value),nextAlphabet=alphabetFor($('set').value),nextTotal=BigInt(nextAlphabet.length)**BigInt(nextLength),target=decimal($('ordinal').value);if(target<1n||target>nextTotal)throw Error('A sorszám tartománya: 1–'+nextTotal);stop();key=$('set').value;length=nextLength;alphabet=nextAlphabet;total=nextTotal;$('error').textContent='';sizeDisplay();go(target)}catch(e){$('error').textContent=e.message}}
$('apply').onclick=apply;
$('set').onchange=()=>{$('ordinal').value='1';apply()};
$('speed').onchange=()=>{try{validSpeed($('speed').value);$('error').textContent='';const playing=timer!==null;stop();save();if(playing)start()}catch(e){stop();$('error').textContent=e.message}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['ordinal','length'].includes(e.target.id))apply()});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewer').requestFullscreen()}catch(e){$('error').textContent='A teljes képernyő ebben a böngészőben nem elérhető.'}};
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw!==null){const saved=JSON.parse(raw);if(saved&&(saved.set==='math'||saved.set==='unicode')){saved.set='hu';saved.ordinal='1'}if(!saved||saved.version!==18||typeof saved.length!=='number'||typeof saved.speed!=='string'||!Object.hasOwn(chars,saved.set))throw Error('Ismeretlen mentett készlet.');const savedLength=validLength(saved.length);validSpeed(saved.speed);const savedAlphabet=alphabetFor(saved.set),savedTotal=BigInt(savedAlphabet.length)**BigInt(savedLength),savedOrdinal=decimal(saved.ordinal);if(savedOrdinal<1n||savedOrdinal>savedTotal)throw Error('A mentett sorszám tartományon kívül van.');key=saved.set;length=savedLength;alphabet=savedAlphabet;total=savedTotal;ordinal=savedOrdinal;$('speed').value=saved.speed}}catch(e){$('error').textContent='A mentett állapot nem állítható vissza: '+e.message+' Alapállapot betöltve.'}
$('set').value=key;$('length').value=length;sizeDisplay();display();
let lastWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width!==lastWidth){lastWidth=width;sizeDisplay()}}).observe($('screen'));
document.fonts.ready.then(sizeDisplay);
</script></body></html>
