<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Visualizer</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:20px}main{max-width:900px;margin:auto}input,button{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}canvas{width:100%;height:520px;background:#181818;border:1px solid #444;border-radius:12px}</style></head><body><main><h1>🧮 Math Visualizer</h1><p>Függvény grafikus megjelenítése.</p><input id="f" value="sin(x)" style="width:260px"><input id="min" type="number" value="-10"><input id="max" type="number" value="10"><button onclick="draw()">Kirajzolás</button><canvas id="c" width="900" height="520"></canvas></main><script>const c=document.getElementById('c'),x=c.getContext('2d');function draw(){x.clearRect(0,0,c.width,c.height);let a=+min.value,b=+max.value,W=c.width,H=c.height; x.strokeStyle='#444';x.beginPath();for(let i=0;i<=10;i++){let X=i*W/10,Y=i*H/10;x.moveTo(X,0);x.lineTo(X,H);x.moveTo(0,Y);x.lineTo(W,Y)}x.stroke();let fn=f.value.replace(/\^/g,'**').replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/sqrt/g,'Math.sqrt').replace(/abs/g,'Math.abs').replace(/log/g,'Math.log10').replace(/pi/gi,'Math.PI');let py=null;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();for(let i=0;i<W;i++){let z=a+(b-a)*i/W,y;try{y=Function('x','return '+fn)(z)}catch(e){y=NaN}let Y=H/2-y*H/(Math.max(Math.abs(a),Math.abs(b))||10);if(!Number.isFinite(Y)||Math.abs(Y)>H*4){py=null;continue}if(py===null)x.moveTo(i,Y);else x.lineTo(i,Y);py=Y}x.stroke()}draw()</script></body></html>
