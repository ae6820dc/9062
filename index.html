<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9062 – Repo tartalom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 {
            color: #58a6ff;
            font-size: 1.6em;
            margin-bottom: 8px;
        }

        .breadcrumb {
            font-size: 0.95em;
            color: #8b949e;
            word-break: break-all;
        }

        .breadcrumb a {
            color: #58a6ff;
            text-decoration: none;
        }

        .breadcrumb a:hover { text-decoration: underline; }

        .status {
            text-align: center;
            padding: 30px;
            color: #8b949e;
        }

        .error {
            color: #f85149;
            background: #161b22;
            border: 1px solid #f85149;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .file-list {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            text-decoration: none;
            color: #c9d1d9;
            transition: background 0.15s;
        }

        .file-item:last-child { border-bottom: none; }

        .file-item:hover { background: #1f242c; }

        .file-icon {
            font-size: 1.2em;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .file-name {
            flex: 1;
            font-weight: 500;
            word-break: break-all;
        }

        .file-item.dir .file-name { color: #58a6ff; }

        .file-size {
            color: #8b949e;
            font-size: 0.85em;
            flex-shrink: 0;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="repoTitle">📁 Repo tartalom</h1>
            <div class="breadcrumb" id="breadcrumb"></div>
        </header>

        <div id="status" class="status">⏳ Betöltés...</div>
        <div id="content"></div>
    </div>

    <script>
        // ⚙️ GitHub adatok – a te oldaladhoz beállítva
        const OWNER  = 'ae6820dc';
        const REPO   = '9062';
        const BRANCH = 'main';   // ha nem működik, próbáld: 'master'

        // A repo gyökeréből indulunk
        let currentPath = '';

        const statusDiv = document.getElementById('status');
        const contentDiv = document.getElementById('content');
        const breadcrumbDiv = document.getElementById('breadcrumb');
        const repoTitle = document.getElementById('repoTitle');

        repoTitle.textContent = `📁 ${OWNER}/${REPO}`;

        // Fájl ikonok kiterjesztés alapján
        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                js: '📜', ts: '📘', jsx: '⚛️', tsx: '⚛️',
                html: '🌐', htm: '🌐', css: '🎨', scss: '🎨',
                json: '📋', md: '📝', txt: '📄',
                py: '🐍', java: '☕', c: '📘', cpp: '📘', cs: '📘',
                go: '🐹', rs: '🦀', rb: '💎', php: '🐘',
                sh: '⚡', bat: '⚡', yml: '⚙️', yaml: '⚙️',
                png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️',
                svg: '🖼️', webp: '🖼️', ico: '🖼️',
                mp3: '🎵', wav: '🎵', mp4: '🎬', mov: '🎬',
                zip: '📦', rar: '📦', tar: '📦', gz: '📦',
                pdf: '📕', doc: '📘', docx: '📘', xls: '📗', xlsx: '📗',
                exe: '⚙️', dll: '⚙️'
            };
            return icons[ext] || '📄';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        function renderBreadcrumb() {
            const parts = currentPath ? currentPath.split('/') : [];

            let html = `<a href="#" data-path="">${OWNER}/${REPO}</a>`;

            let accumulated = '';
            parts.forEach(part => {
                accumulated += (accumulated ? '/' : '') + part;
                html += ` / <a href="#" data-path="${accumulated}">${part}</a>`;
            });

            breadcrumbDiv.innerHTML = html;

            breadcrumbDiv.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPath = a.dataset.path;
                    loadContents();
                });
            });
        }

        async function loadContents() {
            statusDiv.style.display = 'block';
            statusDiv.textContent = '⏳ Betöltés...';
            contentDiv.innerHTML = '';
            renderBreadcrumb();

            try {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentPath}?ref=${BRANCH}`;
                const response = await fetch(url);

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('A mappa nem található, vagy a repo/branch rossz. (Ellenőrizd, hogy "main" vagy "master" a branch neve!)');
                    }
                    if (response.status === 403) {
                        throw new Error('API limit elérve. Próbáld később.');
                    }
                    throw new Error(`Hiba: ${response.status} ${response.statusText}`);
                }

                const items = await response.json();
                statusDiv.style.display = 'none';
                renderItems(items);

            } catch (err) {
                statusDiv.style.display = 'none';
                contentDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            }
        }

        function renderItems(items) {
            if (!Array.isArray(items)) {
                contentDiv.innerHTML = `<div class="empty">Ez egy fájl, nem mappa.</div>`;
                return;
            }

            if (items.length === 0) {
                contentDiv.innerHTML = `<div class="empty">Ez a mappa üres.</div>`;
                return;
            }

            // Mappák elöl, aztán fájlok, ABC sorrendben
            items.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            const list = document.createElement('div');
            list.className = 'file-list';

            items.forEach(item => {
                const el = document.createElement('a');
                el.className = 'file-item' + (item.type === 'dir' ? ' dir' : '');
                el.href = '#';

                const icon = item.type === 'dir' ? '📁' : getFileIcon(item.name);
                const sizeText = item.type === 'file' && item.size
                    ? formatSize(item.size)
                    : '';

                el.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span class="file-name">${item.name}</span>
                    <span class="file-size">${sizeText}</span>
                `;

                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (item.type === 'dir') {
                        currentPath = item.path;
                        loadContents();
                    } else {
                        window.open(item.html_url, '_blank');
                    }
                });

                list.appendChild(el);
            });

            contentDiv.appendChild(list);
        }

        // Indítás – a repo gyökeréből
        loadContents();
    </script>
</body>
</html>
