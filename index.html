<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Repository</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: white;
        }

        #path {
            margin: 15px 0 25px;
            color: #8b949e;
        }

        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 14px;
            margin-right: 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #30363d;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            border-bottom: 1px solid #21262d;
            padding: 12px 8px;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .folder {
            color: #79c0ff;
            cursor: pointer;
        }

        .file {
            color: #c9d1d9;
        }

        #loading {
            color: #8b949e;
        }

        #error {
            color: #f85149;
        }
    </style>
</head>

<body>

    <h1>📦 GitHub Repository</h1>

    <div id="path">/</div>

    <button onclick="goHome()">🏠 Főkönyvtár</button>
    <button onclick="goBack()">⬅️ Vissza</button>

    <div id="loading">Betöltés...</div>
    <div id="error"></div>

    <ul id="repo"></ul>


<script>

// ==========================================
// GITHUB BEÁLLÍTÁSOK
// ==========================================

const owner = "ae6820dc";
const repository = "9062";


// ==========================================
// ÁLLAPOT
// ==========================================

let currentPath = "";


// ==========================================
// REPOSITORY BETÖLTÉSE
// ==========================================

async function loadDirectory(path = "") {

    currentPath = path;

    const list = document.getElementById("repo");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const pathDisplay = document.getElementById("path");

    list.innerHTML = "";
    error.innerHTML = "";

    pathDisplay.textContent = "/" + path;

    loading.style.display = "block";

    try {

        const url =
            `https://api.github.com/repos/${owner}/${repository}/contents/${path}`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                `GitHub API hiba: ${response.status}`
            );
        }

        const files = await response.json();

        loading.style.display = "none";


        // ==================================
        // FÁJLOK / MAPPÁK LISTÁZÁSA
        // ==================================

        files.sort((a, b) => {

            // Mappák kerüljenek előre
            if (a.type === "dir" && b.type !== "dir") return -1;
            if (a.type !== "dir" && b.type === "dir") return 1;

            return a.name.localeCompare(b.name);
        });


        files.forEach(file => {

            const li = document.createElement("li");


            // ==================================
            // MAPPA
            // ==================================

            if (file.type === "dir") {

                const folder = document.createElement("span");

                folder.className = "folder";

                folder.textContent = "📁 " + file.name;

                folder.onclick = () => {

                    loadDirectory(file.path);

                };

                li.appendChild(folder);

            }


            // ==================================
            // FÁJL
            // ==================================

            else {

                const link = document.createElement("a");

                link.className = "file";

                link.href = file.html_url;

                link.target = "_blank";

                link.textContent =
                    getFileIcon(file.name) + " " + file.name;

                li.appendChild(link);

            }


            list.appendChild(li);

        });

    }

    catch (err) {

        loading.style.display = "none";

        error.textContent =
            "❌ Hiba: " + err.message;

    }
}


// ==========================================
// FÁJL IKON
// ==========================================

function getFileIcon(filename) {

    const extension =
        filename.split(".").pop().toLowerCase();


    const icons = {

        html: "🌐",
        htm: "🌐",

        css: "🎨",

        js: "📜",
        json: "⚙️",

        py: "🐍",

        java: "☕",

        c: "🔧",
        cpp: "🔧",
        h: "🔧",

        md: "📝",

        txt: "📄",

        jpg: "🖼️",
        jpeg: "🖼️",
        png: "🖼️",
        gif: "🖼️",
        webp: "🖼️",

        mp3: "🎵",
        mp4: "🎬",

        zip: "📦",

        pdf: "📕"

    };

    return icons[extension] || "📄";
}


// ==========================================
// FŐKÖNYVTÁR
// ==========================================

function goHome() {

    loadDirectory("");

}


// ==========================================
// VISSZA
// ==========================================

function goBack() {

    if (!currentPath) {
        return;
    }

    const parts = currentPath.split("/");

    parts.pop();

    const previousPath = parts.join("/");

    loadDirectory(previousPath);

}


// ==========================================
// INDÍTÁS
// ==========================================

loadDirectory("");

</script>

</body>
</html>
