<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>72!</title><style>
:root{color-scheme:dark;--bg:#0f1420;--on:#3ec7c2;--off:#2a3550;--ink:#e8eef8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,Arial;display:flex;align-items:center;flex-direction:column;padding:12px}h1{font-size:16px;margin:6px 0 14px;overflow-wrap:anywhere}.panel{width:min(100%,420px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#19243a;padding:10px;border-radius:10px;min-width:0}.stat small{display:block;color:#9fb3c8}.stat strong{font-size:clamp(15px,3vw,24px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.hex{font-size:clamp(22px,6vw,32px);font-weight:800;letter-spacing:.04em;text-align:center;margin:12px 0;color:var(--on)}.board{display:grid;gap:5px}.boardrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.cell{aspect-ratio:1;min-width:0;border:0;border-radius:3px;background:var(--off);color:#e7f0ff;font-size:clamp(16px,5vw,22px);font-weight:700;padding:0;cursor:pointer}.cell.on{background:var(--on);color:#0a1320}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}button.action{background:#2a3550;color:var(--ink);border:1px solid #4a607f;border-radius:9px;padding:12px 16px;font-size:16px;cursor:pointer}.action.primary{background:#217f7a;border-color:#3ec7c2}.speed{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}input[type=range]{width:min(300px,70vw)}.footer{color:#91a5be;font-size:12px;margin-top:10px;text-align:center}html{height:100%}
body{height:100dvh;min-height:0;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
.panel{height:100%;min-height:0;display:flex;flex-direction:column;gap:6px}
h1{flex:none;font-size:14px;line-height:1.2;margin:0}
.stats{flex:none;gap:8px;margin:0}
.stat{padding:6px 8px}
.stat small{font-size:11px;line-height:1.25}
.stat strong{font-size:17px;line-height:1.25}
.hex{flex:none;font-size:24px;line-height:1.15;margin:0}
.board{flex:1;min-height:0;grid-template-rows:repeat(12,minmax(0,1fr));gap:3px}
.boardrow{min-height:0}
.cell{aspect-ratio:auto;height:100%;min-height:0;font-size:clamp(12px,2.8dvh,20px);touch-action:manipulation}
.controls{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
button.action{padding:9px 3px;font-size:14px;white-space:nowrap;touch-action:manipulation}
.speed{flex:none;gap:4px;flex-direction:column;font-size:13px;line-height:1.2}
input[type=range]{width:min(300px,100%);margin:0;height:22px}
.footer{flex:none;font-size:11px;line-height:1.2;margin:0}
@media(max-height:450px){.panel{gap:3px}h1{font-size:11px}.stat{padding:3px 6px}.stat strong{font-size:14px}.hex{font-size:18px}button.action{padding:5px 3px;font-size:12px}.speed{flex-direction:row;gap:8px}input[type=range]{width:40%;height:18px}.cell{font-size:11px}.board{gap:2px}}
</style></head><body><div class="panel"><h1>Program ID 69CCECE5417A4ACD4F46CD288ED9F8A8</h1><div class="stats"><div class="stat"><small>Sorszám (1–2 176 782 336)</small><strong id="step">1</strong></div><div class="stat"><small>Befejezett ciklusok</small><strong id="cycles">0</strong></div></div><div class="hex" id="hex">000000000000</div><div class="board" id="board" aria-label="12 sor, soronként 6 számjegy, 0-tól 5-ig"></div><div class="controls"><button class="action primary" id="play">▶ Indítás</button><button class="action" id="next">+1 lépés</button><button class="action" id="prev">−1 lépés</button></div><div class="speed"><label for="speed">Sebesség: <b id="speedlabel">5</b> lépés/mp</label><input id="speed" type="range" min="1" max="60" value="5"></div><div class="footer" id="status">Készen áll.</div></div><script>
(()=>{'use strict';const STORAGE_KEY='1426DC0E0688D50D',MAX=6**12-1;let value=0,cycles=0,running=false,timer=null,dirty=false;const $=id=>document.getElementById(id),board=$('board'),cells=[];for(let r=0;r<12;r++){let row=document.createElement('div');row.className='boardrow';let cs=[];for(let c=0;c<6;c++){let b=document.createElement('button');b.type='button';b.className='cell';b.textContent=String(c);b.setAttribute('aria-label',`Sor ${r+1}, számjegy ${b.textContent}`);b.addEventListener('click',()=>{stop();const place=6**(11-r);const digit=Math.floor(value/place)%6;value+=(c-digit)*place;render()});row.append(b);cs.push(b)}board.append(row);cells.push(cs)}function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({value,cycles,speed:Number($('speed').value)}));return true}catch(e){$('status').textContent='A böngésző nem engedte a mentést.';return false}}
function loadState(){try{const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return false;const s=JSON.parse(saved);if(!s||!Number.isInteger(s.value)||s.value<0||s.value>MAX)return false;value=s.value;if(Number.isSafeInteger(s.cycles)&&s.cycles>=0)cycles=s.cycles;if(Number.isFinite(s.speed)&&s.speed>=1&&s.speed<=60)$('speed').value=s.speed;return true}catch(e){return false}}
function render(){$('cycles').textContent=cycles.toLocaleString('hu-HU');const hex=value.toString(6).padStart(12,'0');$('hex').textContent=hex;$('step').textContent=(value+1).toLocaleString('hu-HU');for(let r=0;r<12;r++){const digit=Number(hex[r]);for(let c=0;c<6;c++){const active=c===digit;cells[r][c].classList.toggle('on',active);cells[r][c].setAttribute('aria-pressed',String(active))}}saveState()}function stop(){running=false;clearInterval(timer);timer=null;$('play').textContent='▶ Indítás'}function tick(){if(value===MAX)cycles++;value=value===MAX?0:value+1;render()}function start(){if(running)return;running=true;$('play').textContent='⏸ Szünet';$('status').textContent='Szekvenciális bejárás folyamatban';timer=setInterval(tick,1000/Number($('speed').value))}$('play').onclick=()=>running?stop():start();$('next').onclick=()=>{stop();tick()};$('prev').onclick=()=>{stop();if(value>0)value--;render()};$('speed').oninput=()=>{$('speedlabel').textContent=$('speed').value;saveState();if(running){stop();start()}};loadState();$('speedlabel').textContent=$('speed').value;render();document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();saveState()}});window.addEventListener('pagehide',saveState)})();
</script></body></html>
