<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>128 Hex Sequence v43</title><style>
:root{color-scheme:dark;--bg:#0f1420;--on:#3ec7c2;--off:#2a3550;--ink:#e8eef8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,Arial;display:flex;align-items:center;flex-direction:column;padding:12px}h1{font-size:19px;margin:6px 0 14px}.panel{width:min(100%,900px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#19243a;padding:10px;border-radius:10px;min-width:0}.stat small{display:block;color:#9fb3c8}.stat strong{font-size:clamp(15px,3vw,24px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.hex{font-size:clamp(25px,6vw,42px);font-weight:800;letter-spacing:.08em;text-align:center;margin:12px 0;color:var(--on)}.board{display:grid;gap:5px}.boardrow{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}.cell{aspect-ratio:1;min-width:0;border:0;border-radius:3px;background:var(--off);color:#e7f0ff;font-size:clamp(9px,2.4vw,19px);font-weight:700;padding:0;cursor:pointer}.cell.on{background:var(--on);color:#0a1320}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}button.action{background:#2a3550;color:var(--ink);border:1px solid #4a607f;border-radius:9px;padding:12px 16px;font-size:16px;cursor:pointer}.action.primary{background:#217f7a;border-color:#3ec7c2}.speed{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}input[type=range]{width:min(300px,70vw)}.footer{color:#91a5be;font-size:12px;margin-top:10px;text-align:center}</style></head><body><div class="panel"><h1>Program ID C1F9849D12894D62A7481EF401CF8FF3</h1><div class="stats"><div class="stat"><small>Sorszám (1–4 294 967 296)</small><strong id="step">1</strong></div><div class="stat"><small>Befejezett ciklusok</small><strong id="cycles">0</strong></div></div><div class="hex" id="hex">00000000</div><div class="board" id="board" aria-label="8 sor, soronként 16 hexadecimális számjegy"></div><div class="controls"><button class="action primary" id="play">▶ Indítás</button><button class="action" id="next">+1 lépés</button><button class="action" id="prev">−1 lépés</button></div><div class="speed"><label for="speed">Sebesség: <b id="speedlabel">5</b> lépés/mp</label><input id="speed" type="range" min="1" max="60" value="5"></div><div class="footer" id="status">Készen áll.</div></div><script>
(()=>{'use strict';const KEY='hex128_v44_seq_65F6ABF254A84103',MAX=0xffffffff;let value=0,cycles=0,running=false,timer=null,dirty=false;const $=id=>document.getElementById(id),board=$('board'),cells=[];for(let r=0;r<8;r++){let row=document.createElement('div');row.className='boardrow';let cs=[];for(let c=0;c<16;c++){let b=document.createElement('button');b.type='button';b.className='cell';b.textContent=c.toString(16).toUpperCase();b.setAttribute('aria-label',`Sor ${r+1}, számjegy ${b.textContent}`);b.addEventListener('click',()=>{stop();const shift=(7-r)*4;value=(((value&(~(15<<shift)))|(c<<shift))>>>0);render();save()});row.append(b);cs.push(b)}board.append(row);cells.push(cs)}function save(){try{localStorage.setItem(KEY,JSON.stringify({value,cycles,speed:Number($('speed').value)}))}catch(e){$('status').textContent='A böngésző nem engedte a mentést.'}}function render(){$('cycles').textContent=cycles.toLocaleString('hu-HU');const hex=value.toString(16).toUpperCase().padStart(8,'0');$('hex').textContent=hex;$('step').textContent=(value+1).toLocaleString('hu-HU');for(let r=0;r<8;r++){const digit=parseInt(hex[r],16);for(let c=0;c<16;c++){const active=c===digit;cells[r][c].classList.toggle('on',active);cells[r][c].setAttribute('aria-pressed',String(active))}}}function stop(){running=false;clearInterval(timer);timer=null;$('play').textContent='▶ Indítás'}function tick(){if(value===MAX)cycles++;value=(value+1)>>>0;render();save()}function start(){if(running)return;running=true;$('play').textContent='⏸ Szünet';$('status').textContent='Szekvenciális bejárás folyamatban';timer=setInterval(tick,1000/Number($('speed').value))}$('play').onclick=()=>running?stop():start();$('next').onclick=()=>{stop();tick()};$('prev').onclick=()=>{stop();if(value>0)value--;render();save()};$('speed').oninput=()=>{$('speedlabel').textContent=$('speed').value;save();if(running){stop();start()}};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Number.isInteger(s.value)&&s.value>=0&&s.value<=MAX)value=s.value;if(s&&Number.isSafeInteger(s.cycles)&&s.cycles>=0)cycles=s.cycles;if(s&&Number.isFinite(s.speed)&&s.speed>=1&&s.speed<=60)$('speed').value=s.speed}catch(e){}$('speedlabel').textContent=$('speed').value;render();document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();save()}});window.addEventListener('pagehide',save)})();
</script></body></html>
