<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المفاتيح العربية</title>
<link rel="icon" href="arabic.svg" type="image/svg+xml">
<meta name="description" content="لوحة مفاتيح عربية على الشاشة لكتابة النصوص ونسخها وحفظها.">
<style>
:root{color-scheme:dark;font-family:"Noto Sans Arabic",Tahoma,system-ui,sans-serif;background:#0c1915;color:#faf0da;--surface:#162a22;--edge:#8d997a;--accent:#edc983}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#234638 0%,#0c1915 70%)}
main{width:min(100% - 32px,850px);margin:auto;padding:clamp(30px,8vh,76px) 0 32px}
.program-id{direction:ltr;text-align:right;margin:0 0 12px;padding-inline:2px;color:#d0c5a9;font:600 13px/1.4 ui-monospace,monospace;letter-spacing:.08em}
.editor,.keyboard{border:1px solid var(--edge);background:var(--surface);border-radius:18px;padding:14px}
textarea{padding:13px;font:inherit;font-size:20px}
textarea{display:block;width:100%;min-height:142px;resize:vertical;background:#091711;color:inherit;border:1px solid var(--edge);border-radius:10px;caret-color:var(--accent)}
textarea::placeholder{color:#d0c5a9;font-size:16px}
.actions{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"copy clear status export";gap:8px;align-items:center;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--edge);border-radius:8px;background:#233d31;touch-action:manipulation}
button:hover{background:#345343}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(forced-colors:active){textarea:focus-visible{outline:2px solid Highlight;outline-offset:2px}}
.actions button{min-height:38px;padding:0 13px;font-size:14px;font-weight:650}
#copy{box-shadow:0 0 14px #edc98333;background:var(--accent);color:#091711;border-color:transparent}
#copy:hover{background:#ffe1a0}
#copy{grid-area:copy}
#clear{grid-area:clear}
#export{box-shadow:0 0 14px #b4d7bd33;grid-area:export;justify-self:end;background:#b4d7bd;color:#091711;border-color:transparent}
#export:hover{background:#d1e9d6}
#status{grid-area:status;justify-self:end;color:#dacfb6;font-size:13px}
#status:empty{display:none}
@media(max-width:570px){
  .actions{grid-template-columns:auto auto minmax(0,1fr);grid-template-areas:"copy clear export" "status status status";row-gap:0}
  .actions button{padding-inline:8px;font-size:13px}
  #status{margin-top:6px}
}
.keyboard{margin-top:14px;display:grid;gap:7px}
.keyboard-rows{display:contents}
.row{direction:ltr;display:flex;justify-content:center;gap:5px}
.key{padding:0;flex:1 1 0;min-width:0;height:clamp(44px,8vw,57px);font-size:clamp(14px,3.7vw,22px);font-weight:600;box-shadow:0 2px 0 #07100c;user-select:none}
.key:active{transform:translateY(2px);box-shadow:none}
.key.special{flex:1.65;color:#f6deb0;background:#2b493a;font-size:clamp(12px,3vw,16px)}
.key[aria-pressed=true],.key:active{background:var(--accent);color:#091711}
.key[aria-pressed=true]{box-shadow:0 0 12px #edc98355}
.key.space{flex:5}
.emoji-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:5px;margin-top:7px}
.emoji-panel[hidden]{display:none}
.emoji-panel button{min-height:42px;padding:0;font-size:22px}
.key.special.emoji{font-size:20px}
@media(max-width:570px){main{width:calc(100% - 16px)}.editor,.keyboard{padding:7px;border-radius:12px}.row{gap:2px}.key{border-radius:5px}.keyboard{gap:5px}}
</style>
</head>
<body>
<main>
<h1 class="program-id" aria-label="معرّف البرنامج 9F5B15BFED505446">Program ID: 9F5B15BFED505446</h1>
<section class="editor" aria-label="محرر النصوص">
<textarea id="output" aria-label="النص" placeholder="ابدأ الكتابة…" lang="ar" dir="rtl" spellcheck="true" inputmode="none"></textarea>
<div class="actions"><button id="copy" type="button">نسخ</button><button id="clear" type="button">مسح</button><button id="export" type="button">تصدير</button><span id="status" role="status"></span></div>
</section>
<section class="keyboard" aria-label="لوحة مفاتيح عربية على الشاشة">
<div id="keyboard" class="keyboard-rows"></div>
<div id="emoji-panel" class="emoji-panel" role="group" aria-label="رموز تعبيرية" hidden></div>
</section>
</main>
<script>
const output = document.getElementById('output');
const keyboard = document.getElementById('keyboard');
const status = document.getElementById('status');
const draftKey = '9F5B15BFED505446';
let draftDatabase;
let draftChanged = false;

function showDraftError() {
  status.textContent = 'الحفظ التلقائي غير متاح.';
}

function writeDraft() {
  const transaction = draftDatabase.transaction('drafts', 'readwrite');
  const drafts = transaction.objectStore('drafts');
  transaction.addEventListener('abort', showDraftError);
  if (output.value) {
    drafts.put(output.value, draftKey);
  } else {
    drafts.delete(draftKey);
  }
}

function saveDraft() {
  draftChanged = true;
  if (draftDatabase) writeDraft();
}

function restoreDraft() {
  if (!window.indexedDB) {
    showDraftError();
    return;
  }
  let opening;
  try {
    opening = window.indexedDB.open('9062-keyboard', 1);
  } catch {
    showDraftError();
    return;
  }
  opening.addEventListener('upgradeneeded', () => {
    opening.result.createObjectStore('drafts');
  });
  opening.addEventListener('error', showDraftError);
  opening.addEventListener('blocked', showDraftError);
  opening.addEventListener('success', () => {
    draftDatabase = opening.result;
    draftDatabase.addEventListener('versionchange', () => {
      draftDatabase.close();
      draftDatabase = undefined;
      showDraftError();
    });
    if (draftChanged) {
      writeDraft();
      return;
    }
    const reading = draftDatabase.transaction('drafts').objectStore('drafts').get(draftKey);
    reading.addEventListener('error', showDraftError);
    reading.addEventListener('success', () => {
      if (draftChanged || typeof reading.result !== 'string') return;
      output.value = reading.result;
      output.setSelectionRange(output.value.length, output.value.length);
    });
  });
}
const emojiPanel = document.getElementById('emoji-panel');
const emojis = ['😁', '😀', '😄', '😂', '🤣', '😉', '😊', '😍', '🥰', '😎', '🤔', '😮', '😢', '😭', '😡', '👍', '👎', '✌️', '👏', '🙏', '❤️', '🔥', '✨', '🎉'];
const graphemes = new Intl.Segmenter('ar', { granularity: 'grapheme' });
const rows = [
  ["ذ","1","2","3","4","5","6","7","8","9","0","-","=","backspace"],
  ["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د"],
  ["ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط","\\","enter"],
  ["shift","ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ","caps"],
  ['symbols', 'space', 'emoji']
];
const shifted = new Map([
  ["ذ","ّ"], ["1","!"], ["2","@"], ["3","#"], ["4","$"], ["5","%"], ["6","^"], ["7","&"], ["8","*"], ["9",")"], ["0","("], ["-","_"], ["=","+"],
  ["ض","َ"], ["ص","ً"], ["ث","ُ"], ["ق","ٌ"], ["ف","لإ"], ["غ","إ"], ["ع","‘"], ["ه","÷"], ["خ","×"], ["ح","؛"], ["ج","<"], ["د",">"],
  ["ش","ِ"], ["س","ٍ"], ["ي","]"], ["ب","["], ["ل","لأ"], ["ا","أ"], ["ت","ـ"], ["ن","،"], ["م","/"], ["ك",":"], ["ط","\""], ["\\","|"],
  ["ئ","~"], ["ء","ْ"], ["ؤ","}"], ["ر","{"], ["لا","لآ"], ["ى","آ"], ["ة","’"], ["و",","], ["ز","."], ["ظ","؟"]
]);
const writingMarks = [...'،؛؟«»…–—'];
const symbolRows = [
  [...'١٢٣٤٥٦٧٨٩٠', 'backspace'],
  [...'0123456789'],
  [...'!@#$%&*+-=٫٬٪'],
  [...'()[]{}<>/:"', 'enter'],
  ['symbols', 'space', 'emoji']
];
const special = {
  backspace: ['⌫', 'حذف للخلف'],
  enter: ['↵', 'سطر جديد'],
  shift: ['⇧', 'الرمز البديل للمفتاح التالي'],
  caps: ['⇧⇧', 'تثبيت الرموز البديلة'],
  space: ['مسافة', 'مسافة'],
  emoji: ['😁', 'رموز تعبيرية']
};
let shift = false;
let caps = false;
let symbols = false;

function keepEditorFocus(event) {
  event.preventDefault();
  output.focus({ preventScroll: true });
}

function setText(text, start = output.selectionStart, end = output.selectionEnd) {
  output.setRangeText(text, start, end, 'end');
  status.textContent = '';
  saveDraft();
}

function pressKey(key, label) {
  const wasShifted = shift;
  if (key === 'emoji') {
    emojiPanel.hidden = !emojiPanel.hidden;
    keyboard.querySelector('.emoji').setAttribute('aria-expanded', String(!emojiPanel.hidden));
  } else if (key === 'shift') {
    shift = !shift;
  } else if (key === 'caps') {
    caps = !caps;
  } else if (key === 'symbols') {
    symbols = !symbols;
    shift = false;
  } else if (key === 'backspace') {
    const { selectionStart, selectionEnd, value } = output;
    const start = selectionStart === selectionEnd && selectionStart > 0
      ? graphemes.segment(value.slice(0, selectionStart)).containing(selectionStart - 1).index
      : selectionStart;
    setText('', start, selectionEnd);
  } else {
    setText(key === 'enter' ? '\n' : key === 'space' ? ' ' : label);
    if (shift) shift = false;
  }
  if (key === 'shift' || key === 'caps' || key === 'symbols' || shift !== wasShifted) render(key);
}

function render(previousKey) {
  const active = document.activeElement;
  const focusedIndex = Array.from(keyboard.querySelectorAll('button')).indexOf(active);
  const layout = symbols ? symbolRows : rows;
  const renderedRows = [...layout.slice(0, -1), writingMarks, layout.at(-1)].map((keys) => {
    const row = document.createElement('div');
    row.className = 'row';
    const isWritingRow = keys === writingMarks;
    if (isWritingRow) {
      row.setAttribute('role', 'group');
      row.setAttribute('aria-label', 'علامات الترقيم');
    }
    keys.forEach((key) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'key';
      let label = key;
      if (!symbols && !isWritingRow && (shift || caps)) label = shifted.get(key) ?? key;
      button.textContent = /^\p{M}$/u.test(label) ? '◌' + label : label;
      if (Object.hasOwn(special, key) || key === 'symbols') {
        const [caption, name] = special[key] ?? [symbols ? 'أبج' : '123', symbols ? 'العودة إلى الحروف' : 'المزيد من الرموز'];
        button.classList.add('special', key);
        button.textContent = caption;
        button.setAttribute('aria-label', name);
      }
      if (key === 'shift') button.setAttribute('aria-pressed', String(shift));
      if (key === 'caps') button.setAttribute('aria-pressed', String(caps));
      if (key === 'symbols') button.setAttribute('aria-pressed', String(symbols));
      if (key === 'emoji') {
        button.setAttribute('aria-controls', 'emoji-panel');
        button.setAttribute('aria-expanded', String(!emojiPanel.hidden));
      }
      button.addEventListener('pointerdown', keepEditorFocus);
      button.addEventListener('click', () => pressKey(key, label));
      row.append(button);
    });
    return row;
  });
  keyboard.replaceChildren(...renderedRows);
  if (focusedIndex >= 0) {
    const next = previousKey === 'symbols' ? keyboard.querySelector('.symbols') : keyboard.querySelectorAll('button')[focusedIndex];
    next?.focus({ preventScroll: true });
  }
}

output.addEventListener('input', () => {
  status.textContent = '';
  saveDraft();
});
document.querySelectorAll('.actions button').forEach((button) => {
  button.addEventListener('pointerdown', keepEditorFocus);
});
document.getElementById('clear').addEventListener('click', () => setText('', 0, output.value.length));
document.getElementById('copy').addEventListener('click', async () => {
  if (!output.value) {
    status.textContent = 'حقل النص فارغ.';
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = 'تم النسخ.';
  } catch {
    output.focus();
    output.select();
    status.textContent = document.execCommand('copy') ? 'تم النسخ.' : 'تم تحديد النص.';
  }
});

document.getElementById('export').addEventListener('click', () => {
  if (!output.value) {
    status.textContent = 'حقل النص فارغ.';
    return;
  }

  const savedAt = new Date();
  const unixMilliseconds = savedAt.getTime();
  const localTime = savedAt.toLocaleString('ar', {
    year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'shortOffset'
  });
  const programLabel = document.querySelector('.program-id').textContent;
  const escapedText = output.value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

  const html = `<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصدير النص</title>
<style>
body{margin:clamp(16px,5vw,48px) auto;padding:0 16px;max-width:72ch;font:18px/1.6 system-ui,sans-serif}
header{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid #aaa;font-size:14px}
main{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<div dir="ltr">${programLabel}</div>
<div>وقت التصدير <time datetime="${savedAt.toISOString()}">${localTime}</time></div>
<div>وقت يونكس (مللي ثانية) <bdi>${unixMilliseconds}</bdi></div>
</header>
<main>${escapedText}</main>
</body>
</html>`;

  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `text-${unixMilliseconds}.html`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

for (const emoji of emojis) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = emoji;
  button.addEventListener('pointerdown', keepEditorFocus);
  button.addEventListener('click', () => pressKey('insert-emoji', emoji));
  emojiPanel.append(button);
}

emojiPanel.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    const toggle = keyboard.querySelector('.emoji');
    pressKey('emoji');
    toggle.focus({ preventScroll: true });
  }
});

render();
output.focus({ preventScroll: true });
restoreDraft();
</script>
</body>
</html>
