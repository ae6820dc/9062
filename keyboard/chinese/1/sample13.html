<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文键盘</title>
<link rel="icon" href="chinese-flag.svg" type="image/svg+xml">
<meta name="description" content="用于输入简体中文的屏幕拼音键盘。">
<style>
:root{color-scheme:dark;font-family:"Geist",system-ui,sans-serif;background:#101a31;color:#f4f5fa;--surface:#182642;--edge:#394b6a;--accent:#ffd17a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#263e64 0%,#101a31 70%)}
main{width:min(100% - 32px,850px);margin:auto;padding:clamp(30px,8vh,76px) 0 32px}
.program-id{margin:0 0 12px;padding-inline:2px;color:#b2c3dd;font:600 13px/1.4 ui-monospace,monospace;letter-spacing:.08em}
.editor,.keyboard{border:1px solid var(--edge);background:var(--surface);border-radius:18px;padding:14px}
.text-field{position:relative}
textarea,.caret-measure{padding:13px;font:inherit;font-size:20px}
textarea{display:block;width:100%;min-height:142px;resize:vertical;background:#111c33;color:inherit;border:1px solid var(--edge);border-radius:10px;caret-color:var(--accent)}
.caret-layer{position:absolute;top:1px;left:1px;overflow:hidden;pointer-events:none}
.caret-measure{visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word}
.editor-caret{position:absolute;width:3px;background:var(--accent);animation:caret-blink 1s step-end infinite}
@keyframes caret-blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.editor-caret{animation:none}}
@media(forced-colors:none){
  .text-field.has-caret textarea{caret-color:transparent}
}
@media(forced-colors:active){.caret-layer{display:none}}
textarea::placeholder{color:#b2c3dd;font-size:16px}
.actions{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"copy clear status export";gap:8px;align-items:center;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--edge);border-radius:8px;background:#223653;touch-action:manipulation}
button:hover{background:#304967}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus{outline:none}
@media(forced-colors:active){textarea:focus-visible{outline:2px solid Highlight;outline-offset:2px}}
.actions button{min-height:38px;padding:0 13px;font-size:14px;font-weight:650}
#copy{background:var(--accent);color:#2e200c;border-color:transparent}
#copy:hover{background:#ffe5ab}
#copy{grid-area:copy}
#clear{grid-area:clear}
#export{grid-area:export;justify-self:end;background:#9cdded;color:#112c40;border-color:transparent}
#export:hover{background:#c3f1fa}
#status{grid-area:status;justify-self:end;color:#c4ced9;font-size:13px}
#status:empty{display:none}
@media(max-width:570px){
  .actions{grid-template-columns:auto auto minmax(0,1fr);grid-template-areas:"copy clear export" "status status status";row-gap:0}
  .actions button{padding-inline:8px;font-size:13px}
  #status{margin-top:6px}
}
.keyboard{margin-top:14px;display:grid;gap:7px}
.keyboard-rows{display:contents}
.pinyin-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px;background:#111c33;border-radius:9px}
#pinyin-code{color:var(--accent);min-width:3em;font-weight:650;overflow-wrap:anywhere;max-width:100%}
#pinyin-candidates{display:flex;flex-wrap:wrap;gap:5px}
#pinyin-candidates button{min-height:36px;padding:4px 8px}
@media(max-width:570px){.row[aria-label="标点符号"] .key{font-size:12px}}
.row{display:flex;justify-content:center;gap:5px}
.key{padding:0;flex:1 1 0;min-width:0;height:clamp(44px,8vw,57px);font-size:clamp(14px,3.7vw,22px);font-weight:600;box-shadow:0 2px 0 #0a1325;user-select:none}
.key:active{transform:translateY(2px);box-shadow:none}
.key.special{flex:1.65;background:#1c2c48;font-size:clamp(12px,3vw,16px)}
.key[aria-pressed=true]{background:var(--accent);color:#2e200c}
.key.space{flex:5}
.emoji-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:5px;margin-top:7px}
.emoji-panel[hidden]{display:none}
.emoji-panel button{min-height:42px;padding:0;font-size:22px}
.key.special.emoji{font-size:20px}
@media(max-width:570px){main{width:calc(100% - 16px)}.editor,.keyboard{padding:7px;border-radius:12px}.row{gap:2px}.key{border-radius:5px}.keyboard{gap:5px}}
</style>
</head>
<body>
<main>
<h1 class="program-id" aria-label="程序编号 AC4A54B728D3DF54">Program ID: AC4A54B728D3DF54</h1>
<section class="editor" aria-label="文本编辑器">
<div class="text-field">
<textarea id="output" aria-label="文本" placeholder="在此输入文字…" spellcheck="false" inputmode="none"></textarea>
<div class="caret-layer" aria-hidden="true"><div class="caret-measure"></div><div class="editor-caret" hidden></div></div>
</div>
<div class="actions"><button id="copy" type="button">复制</button><button id="clear" type="button">清空</button><button id="export" type="button">导出</button><span id="status" role="status"></span></div>
</section>
<section class="keyboard" aria-label="中文屏幕键盘">
<div class="pinyin-bar" role="group" aria-label="拼音候选">
<span id="pinyin-code">拼音</span><div id="pinyin-candidates"></div>
</div>
<div id="keyboard" class="keyboard-rows"></div>
<div id="emoji-panel" class="emoji-panel" role="group" aria-label="表情" hidden></div>
</section>
</main>
<script src="pinyin-data.js"></script>
<script>
const output = document.getElementById('output');
const textField = output.parentElement;
const caretLayer = textField.querySelector('.caret-layer');
const caretMeasure = textField.querySelector('.caret-measure');
const editorCaret = textField.querySelector('.editor-caret');
const caretRange = document.createRange();
let caretFrame = 0;
let revealCaret = false;

function refreshCaret() {
  caretFrame = 0;
  const shouldReveal = revealCaret;
  revealCaret = false;
  const { selectionStart, selectionEnd, value } = output;
  const showCaret = document.activeElement === output && selectionStart === selectionEnd;
  if (!showCaret) {
    editorCaret.hidden = true;
    textField.classList.remove('has-caret');
    return;
  }

  caretLayer.style.width = `${output.clientWidth}px`;
  caretLayer.style.height = `${output.clientHeight}px`;
  // Give an empty final line a measurable caret position.
  const measureText = value === '' || value.endsWith('\n') ? value + '\u200b' : value;
  if (caretMeasure.textContent !== measureText) caretMeasure.textContent = measureText;
  caretRange.setStart(caretMeasure.firstChild, selectionStart);
  caretRange.collapse(true);
  const rect = caretRange.getBoundingClientRect();
  const origin = caretMeasure.getBoundingClientRect();
  editorCaret.hidden = rect.height === 0;
  textField.classList.toggle('has-caret', !editorCaret.hidden);
  editorCaret.style.left = `${rect.left - origin.left - output.scrollLeft}px`;
  const caretTop = rect.top - origin.top;
  if (shouldReveal && !editorCaret.hidden) {
    const visibleTop = output.scrollTop;
    const visibleBottom = visibleTop + output.clientHeight;
    if (caretTop < visibleTop) {
      output.scrollTop = Math.floor(caretTop);
    } else if (caretTop + rect.height > visibleBottom) {
      output.scrollTop = Math.ceil(caretTop + rect.height - output.clientHeight);
    }
  }
  editorCaret.style.top = `${caretTop - output.scrollTop}px`;
  editorCaret.style.height = `${rect.height}px`;
}

function scheduleCaret() {
  if (!caretFrame) caretFrame = requestAnimationFrame(refreshCaret);
}

for (const event of ['focus', 'blur', 'input', 'click', 'keyup', 'select', 'scroll']) {
  output.addEventListener(event, scheduleCaret);
}
document.addEventListener('selectionchange', scheduleCaret);
new ResizeObserver(scheduleCaret).observe(output);
const keyboard = document.getElementById('keyboard');
const status = document.getElementById('status');
const draftKey = 'AC4A54B728D3DF54';
let draftDatabase;
let draftChanged = false;

function showDraftError() {
  status.textContent = '无法自动保存。';
}

function writeDraft() {
  const transaction = draftDatabase.transaction('drafts', 'readwrite');
  const drafts = transaction.objectStore('drafts');
  transaction.addEventListener('abort', showDraftError);
  if (output.value) {
    drafts.put(output.value, draftKey);
  } else {
    drafts.delete(draftKey);
  }
}

function saveDraft() {
  draftChanged = true;
  if (draftDatabase) writeDraft();
}

function restoreDraft() {
  if (!window.indexedDB) {
    showDraftError();
    return;
  }
  let opening;
  try {
    opening = window.indexedDB.open('9062-keyboard', 1);
  } catch {
    showDraftError();
    return;
  }
  opening.addEventListener('upgradeneeded', () => {
    opening.result.createObjectStore('drafts');
  });
  opening.addEventListener('error', showDraftError);
  opening.addEventListener('blocked', showDraftError);
  opening.addEventListener('success', () => {
    draftDatabase = opening.result;
    draftDatabase.addEventListener('versionchange', () => {
      draftDatabase.close();
      draftDatabase = undefined;
      showDraftError();
    });
    if (draftChanged) {
      writeDraft();
      return;
    }
    const reading = draftDatabase.transaction('drafts').objectStore('drafts').get(draftKey);
    reading.addEventListener('error', showDraftError);
    reading.addEventListener('success', () => {
      if (draftChanged || typeof reading.result !== 'string') return;
      output.value = reading.result;
      output.setSelectionRange(output.value.length, output.value.length);
      revealCaret = true;
      scheduleCaret();
    });
  });
}
const emojiPanel = document.getElementById('emoji-panel');
const emojis = ['😁', '😀', '😄', '😂', '🤣', '😉', '😊', '😍', '🥰', '😎', '🤔', '😮', '😢', '😭', '😡', '👍', '👎', '✌️', '👏', '🙏', '❤️', '🔥', '✨', '🎉'];
const graphemes = new Intl.Segmenter('zh-CN', { granularity: 'grapheme' });
const codeDisplay = document.getElementById('pinyin-code');
const candidateBar = document.getElementById('pinyin-candidates');
let chinese = true;
let code = '';
let candidatePage = 0;
const pageSize = 8;

function candidates() {
  return typeof pinyinDictionary !== 'undefined' && Object.hasOwn(pinyinDictionary, code)
    ? pinyinDictionary[code] : [];
}

function candidateButton(label, action) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.addEventListener('pointerdown', keepEditorFocus);
  button.addEventListener('click', () => {
    output.focus({ preventScroll: true });
    action();
  });
  candidateBar.append(button);
}

function showCandidates() {
  const words = candidates();
  const start = candidatePage * pageSize;
  codeDisplay.textContent = code || (chinese ? '拼音' : '英文');
  candidateBar.replaceChildren();
  if (code && words.length === 0) candidateBar.textContent = '暂无候选';
  words.slice(start, start + pageSize).forEach((word, i) => {
    candidateButton(`${i + 1}. ${word}`, () => commitPinyin(word));
  });
  if (candidatePage > 0) candidateButton('上一页', () => {
    candidatePage--;
    showCandidates();
  });
  if (start + pageSize < words.length) candidateButton('下一页', () => {
    candidatePage++;
    showCandidates();
  });
}

function setPinyin(value) {
  code = value;
  candidatePage = 0;
  showCandidates();
}

function commitPinyin(word = candidates()[candidatePage * pageSize] ?? code) {
  if (!code) return;
  setPinyin('');
  setText(word);
}

function handlePinyin(key) {
  if (!chinese) return false;
  if (/^[a-z]$/i.test(key)) {
    setPinyin(code + key.toLowerCase());
    return true;
  }
  if (!code) return false;
  const choice = /^[1-8]$/.test(key) ? candidates()[candidatePage * pageSize + Number(key) - 1] : undefined;
  if (choice) commitPinyin(choice);
  else if (key === 'space') commitPinyin();
  else if (key === 'backspace') setPinyin(code.slice(0, -1));
  else if (key === 'Escape') setPinyin('');
  else return false;
  return true;
}

const rows = [
  [...'1234567890-=', 'backspace'],
  [...'qwertyuiop'],
  [...'asdfghjkl', 'enter'],
  ['shift', ...'zxcvbnm,.', 'caps'],
  ['mode', 'symbols', 'space', 'emoji']
];
const shifted = new Map(Array.from('1234567890-=,.', (key, index) => [key, '!@#$%^&*()_+<>'[index]]));
const writingMarks = [...'，。！？、；：“”《》（）', '——', '……'];
const symbolRows = [
  [...'1234567890-=', 'backspace'],
  [...'!?"%:;()[]{}'],
  [...'+*/\\_@#$&<>', 'enter'],
  [...'¥€', "'", '’'],
  ['mode', 'symbols', 'space', 'emoji']
];
const special = {
  backspace: ['⌫', '退格'],
  enter: ['↵', '换行'],
  shift: ['⇧', '切换下一个字符'],
  caps: ['⇧⇧', '持续大写'],
  space: ['空格', '空格'],
  emoji: ['😁', '表情'],
  mode: ['中', '切换中英文输入']
};
let shift = false;
let caps = false;
let symbols = false;

function keepEditorFocus(event) {
  event.preventDefault();
  output.focus({ preventScroll: true });
}

function setText(text, start = output.selectionStart, end = output.selectionEnd) {
  output.setRangeText(text, start, end, 'end');
  revealCaret = true;
  scheduleCaret();
  status.textContent = '';
  saveDraft();
}

function pressKey(key, label) {
  if (key === 'mode') {
    commitPinyin();
    chinese = !chinese;
    showCandidates();
    render(key);
    return;
  }
  if (!symbols && handlePinyin(key)) {
    if (shift && /^[a-z]$/.test(key)) {
      shift = false;
      render(key);
    }
    return;
  }
  if (!['shift', 'caps', 'emoji'].includes(key)) commitPinyin();
  const wasShifted = shift;
  if (key === 'emoji') {
    emojiPanel.hidden = !emojiPanel.hidden;
    keyboard.querySelector('.emoji').setAttribute('aria-expanded', String(!emojiPanel.hidden));
  } else if (key === 'shift') {
    shift = !shift;
  } else if (key === 'caps') {
    caps = !caps;
  } else if (key === 'symbols') {
    symbols = !symbols;
    shift = false;
  } else if (key === 'backspace') {
    const { selectionStart, selectionEnd, value } = output;
    const start = selectionStart === selectionEnd && selectionStart > 0
      ? graphemes.segment(value.slice(0, selectionStart)).containing(selectionStart - 1).index
      : selectionStart;
    setText('', start, selectionEnd);
  } else if (key === 'enter') {
    setText('\n');
  } else if (key === 'space') {
    setText(' ');
  } else {
    setText(label);
    if (shift) shift = false;
  }
  if (key === 'shift' || key === 'caps' || key === 'symbols' || shift !== wasShifted) render(key);
}

function render(previousKey) {
  const active = document.activeElement;
  const focusedIndex = Array.from(keyboard.querySelectorAll('button')).indexOf(active);
  const layout = symbols ? symbolRows : rows;
  const renderedRows = [...layout.slice(0, -1), writingMarks, layout.at(-1)].map((keys) => {
    const row = document.createElement('div');
    row.className = 'row';
    const isWritingRow = keys === writingMarks;
    if (isWritingRow) {
      row.setAttribute('role', 'group');
      row.setAttribute('aria-label', '标点符号');
    }
    keys.forEach((key) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'key';
      let label = key;
      if (!symbols && !isWritingRow) {
        if (shift) label = shifted.get(key) ?? key.toUpperCase();
        else if (caps && !chinese && /^\p{L}$/u.test(key)) label = key.toUpperCase();
      }
      button.textContent = label;
      if (Object.hasOwn(special, key) || key === 'symbols') {
        const [caption, name] = special[key] ?? [symbols ? '字母' : '123', '更多符号'];
        button.classList.add('special', key);
        button.textContent = key === 'mode' && !chinese ? '英' : caption;
        if (key === 'mode') button.setAttribute('aria-pressed', String(chinese));
        if (key === 'caps') button.disabled = chinese;
        button.setAttribute('aria-label', name);
      }
      if (key === 'shift') button.setAttribute('aria-pressed', String(shift));
      if (key === 'caps') button.setAttribute('aria-pressed', String(caps));
      if (key === 'symbols') button.setAttribute('aria-pressed', String(symbols));
      if (key === 'emoji') {
        button.setAttribute('aria-controls', 'emoji-panel');
        button.setAttribute('aria-expanded', String(!emojiPanel.hidden));
      }
      button.addEventListener('pointerdown', keepEditorFocus);
      button.addEventListener('click', () => pressKey(key, label));
      row.append(button);
    });
    return row;
  });
  keyboard.replaceChildren(...renderedRows);
  if (focusedIndex >= 0) {
    const next = previousKey === 'symbols' ? keyboard.querySelector('.symbols') : keyboard.querySelectorAll('button')[focusedIndex];
    next?.focus({ preventScroll: true });
  }
}

output.addEventListener('keydown', (event) => {
  if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey || !chinese) return;
  const key = { Backspace: 'backspace', ' ': 'space' }[event.key] ?? event.key;
  if (handlePinyin(key)) event.preventDefault();
  else if (event.key === 'Enter' || event.key.length === 1) commitPinyin();
});

output.addEventListener('input', () => {
  status.textContent = '';
  saveDraft();
});
document.querySelectorAll('.actions button').forEach((button) => {
  button.addEventListener('pointerdown', keepEditorFocus);
});
document.getElementById('clear').addEventListener('click', () => {
  setPinyin('');
  setText('', 0, output.value.length);
});
document.getElementById('copy').addEventListener('click', async () => {
  commitPinyin();
  if (!output.value) {
    status.textContent = '文本框为空。';
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = '已复制。';
  } catch {
    output.focus();
    output.select();
    status.textContent = document.execCommand('copy') ? '已复制。' : '已选中文本。';
  }
});

document.getElementById('export').addEventListener('click', () => {
  commitPinyin();
  if (!output.value) {
    status.textContent = '文本框为空。';
    return;
  }

  const savedAt = new Date();
  const unixMilliseconds = savedAt.getTime();
  const localTime = savedAt.toLocaleString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'shortOffset'
  });
  const programLabel = document.querySelector('.program-id').textContent;
  const escapedText = output.value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

  const html = `<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本导出</title>
<style>
body{margin:clamp(16px,5vw,48px) auto;padding:0 16px;max-width:72ch;font:18px/1.6 system-ui,sans-serif}
header{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid #aaa;font-size:14px}
main{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<div>${programLabel}</div>
<div>导出时间: <time datetime="${savedAt.toISOString()}">${localTime}</time></div>
<div>Unix（毫秒）: ${unixMilliseconds}</div>
</header>
<main>${escapedText}</main>
</body>
</html>`;

  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `text-${unixMilliseconds}.html`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

for (const emoji of emojis) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = emoji;
  button.addEventListener('pointerdown', keepEditorFocus);
  button.addEventListener('click', () => {
    commitPinyin();
    setText(emoji);
  });
  emojiPanel.append(button);
}

emojiPanel.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    const toggle = keyboard.querySelector('.emoji');
    pressKey('emoji');
    toggle.focus({ preventScroll: true });
  }
});

render();
output.focus({ preventScroll: true });
restoreDraft();
</script>
</body>
</html>
