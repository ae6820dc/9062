<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orosz billentyűzet</title>
<meta name="description" content="Virtuális orosz billentyűzet cirill szöveg írásához és másolásához.">
<style>
:root{color-scheme:dark;font-family:"Geist",system-ui,sans-serif;background:#11141a;color:#f4f5fa;--surface:#1b2029;--edge:#353c49;--accent:#c6f789}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#232e33 0%,#11141a 70%)}
main{width:min(100% - 32px,850px);margin:auto;padding:clamp(30px,8vh,76px) 0 32px}
h1{font-size:clamp(30px,6vw,55px);letter-spacing:-.065em;margin:0 0 24px;line-height:1}
.editor,.keyboard{border:1px solid var(--edge);background:var(--surface);border-radius:18px;padding:14px}
textarea{display:block;width:100%;min-height:142px;resize:vertical;background:#12161e;color:inherit;border:1px solid var(--edge);border-radius:10px;padding:13px;font:inherit;font-size:20px}
textarea::placeholder{color:#a4aebd;font-size:16px}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--edge);border-radius:8px;background:#292f3b;touch-action:manipulation}
button:hover{background:#373f4d}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions button{min-height:38px;padding:0 13px;font-size:14px;font-weight:650}
#copy{background:var(--accent);color:#18220e;border-color:transparent}
#copy:hover{background:#d8ffac}
#status{color:#c4ced9;font-size:13px;margin-left:auto}
.keyboard{margin-top:14px;display:grid;gap:7px}
.row{display:flex;justify-content:center;gap:5px}
.key{padding:0;flex:1 1 0;min-width:0;height:clamp(44px,8vw,57px);font-size:clamp(14px,3.7vw,22px);font-weight:600;box-shadow:0 2px 0 #0c1015;user-select:none}
.key:active{transform:translateY(2px);box-shadow:none}
.key.special{flex:1.65;background:#222733;font-size:clamp(12px,3vw,16px)}
.key[aria-pressed=true]{background:var(--accent);color:#18220e}
.key.space{flex:5}
@media(max-width:570px){main{width:calc(100% - 16px)}h1{margin-left:6px}.editor,.keyboard{padding:7px;border-radius:12px}.row{gap:2px}.key{border-radius:5px}.keyboard{gap:5px}}
</style>
</head>
<body>
<main>
<h1>Orosz billentyűzet</h1>
<section class="editor" aria-label="Szövegszerkesztő">
<textarea id="output" aria-label="Szöveg" placeholder="Kezdj el gépelni…" spellcheck="false" inputmode="none"></textarea>
<div class="actions"><button id="copy" type="button">Másolás</button><button id="clear" type="button">Törlés</button><span id="status" role="status"></span></div>
</section>
<section id="keyboard" class="keyboard" aria-label="Orosz virtuális billentyűzet"></section>
</main>
<script>
const output = document.getElementById('output');
const keyboard = document.getElementById('keyboard');
const status = document.getElementById('status');
const rows = [
  [...'ё1234567890-=', 'backspace'],
  [...'йцукенгшщзхъ', '\\'],
  [...'фывапролджэ', 'enter'],
  ['shift', ...'ячсмитьбю.', 'shift'],
  ['symbols', 'space']
];
const shifted = new Map(Array.from('1234567890-=\\.', (key, index) => [key, Array.from('!"№;%:?*()_+/,')[index]]));
const symbolRows = [
  [...'1234567890-=', 'backspace'],
  [...'!?"№%:;()[]{}'],
  [...'+*/\\_@#$&<>', 'enter'],
  [...'.,«»…—€₽', "'", '’'],
  ['symbols', 'space']
];
const special = {
  backspace: ['⌫', 'Visszatörlés'],
  enter: ['↵', 'Enter'],
  shift: ['⇧', 'Shift'],
  space: ['Szóköz', 'Szóköz']
};
let shift = false;
let symbols = false;

function setText(text, start = output.selectionStart, end = output.selectionEnd) {
  output.setRangeText(text, start, end, 'end');
  status.textContent = '';
}

function pressKey(key, label) {
  const wasShifted = shift;
  if (key === 'shift') {
    shift = !shift;
  } else if (key === 'symbols') {
    symbols = !symbols;
    shift = false;
  } else if (key === 'backspace') {
    const { selectionStart, selectionEnd, value } = output;
    const before = Array.from(value.slice(0, selectionStart)).at(-1) ?? '';
    const start = selectionStart === selectionEnd ? selectionStart - before.length : selectionStart;
    setText('', start, selectionEnd);
  } else if (key === 'enter') {
    setText('\n');
  } else if (key === 'space') {
    setText(' ');
  } else {
    setText(label);
    if (shift) shift = false;
  }
  if (key === 'shift' || key === 'symbols' || shift !== wasShifted) render(key);
}

function render(previousKey) {
  const active = document.activeElement;
  const focusedIndex = Array.from(keyboard.querySelectorAll('button')).indexOf(active);
  const renderedRows = (symbols ? symbolRows : rows).map((keys) => {
    const row = document.createElement('div');
    row.className = 'row';
    keys.forEach((key) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'key';
      const label = shift && !symbols ? shifted.get(key) ?? key.toUpperCase() : key;
      button.textContent = label;
      if (Object.hasOwn(special, key) || key === 'symbols') {
        const [caption, name] = special[key] ?? [symbols ? 'АБВ' : '123', 'Szimbólumok'];
        button.classList.add('special', key);
        button.textContent = caption;
        button.setAttribute('aria-label', name);
      }
      if (key === 'shift' || key === 'symbols') button.setAttribute('aria-pressed', key === 'shift' ? shift : symbols);
      button.addEventListener('pointerdown', (event) => event.preventDefault());
      button.addEventListener('click', () => pressKey(key, label));
      row.append(button);
    });
    return row;
  });
  keyboard.replaceChildren(...renderedRows);
  if (focusedIndex >= 0) {
    const next = previousKey === 'symbols' ? keyboard.querySelector('.symbols') : keyboard.querySelectorAll('button')[focusedIndex];
    next?.focus({ preventScroll: true });
  }
}

output.addEventListener('input', () => { status.textContent = ''; });
document.getElementById('clear').addEventListener('click', () => setText('', 0, output.value.length));
document.getElementById('copy').addEventListener('click', async () => {
  if (!output.value) {
    status.textContent = 'A szövegmező üres.';
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = 'Másolva.';
  } catch {
    output.focus();
    output.select();
    status.textContent = document.execCommand('copy') ? 'Másolva.' : 'A szöveg kijelölve.';
  }
});
render();
</script>
</body>
</html>
